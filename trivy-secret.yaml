# Secret-scan config for the image gates. Trivy reads trivy-secret.yaml from the
# working directory by default, so the trivy-action steps pick this up as is.

# gcp-service-account matches the bare string "type": "service_account", which
# the AI providers form ships as a placeholder in the SPA bundle. A real
# service-account JSON still trips the private-key rule on its private_key.
disable-rules:
  - gcp-service-account
