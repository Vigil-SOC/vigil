# Test-only override for tests/medic_compose/test_compose_live.py. Never for installs.
#
# Applied on top of infra/docker/docker-compose.yml + the Medic overlay, under its
# own project name (medic-s6 by default), so it can run beside a developer's
# deeptempo-* stack:
#   - container_name and host ports are reset (the real ones are fixed names and
#     loopback ports that a running stack already holds);
#   - the Vigil services Medic's checks touch become one small stub (stub.py) that
#     listens on their real ports, so no Vigil image has to be built. The networks
#     come from the real files untouched: that topology is what's under test.
# The three Medic services are the real images, unchanged.
#
# Written out per service: YAML merge keys (<<: *anchor) drop Compose's !reset
# and !override tags, so an anchor would silently keep the real ports and names.
services:
  medic:
    container_name: !reset null
  medic-gateway:
    container_name: !reset null
  medic-dockerproxy:
    container_name: !reset null

  backend:
    image: python:3.12-slim
    build: !reset null
    container_name: !reset null
    # Published on 0.0.0.0 like the real backend's 6987, on a random host port,
    # so check 7 can prove Medic can't reach it via its bridge's host address.
    ports: !override ["6987"]
    depends_on: !reset {}
    extra_hosts: !reset []
    entrypoint: !reset null
    command: !override ["python", "/stub/stub.py"]
    volumes: !override ["${MEDIC_S6_STUB_DIR:?}/stub.py:/stub/stub.py:ro"]
    healthcheck: !override {test: ["CMD", "python", "-c", "0"], interval: 5s}
    restart: "no"
    environment: !override
      STUB_ROLE: backend
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?}
    secrets: [medic_viewer_password]

  agent-worker:
    image: python:3.12-slim
    build: !reset null
    container_name: !reset null
    ports: !reset []
    depends_on: !reset {}
    extra_hosts: !reset []
    entrypoint: !reset null
    command: !override ["python", "/stub/stub.py"]
    volumes: !override ["${MEDIC_S6_STUB_DIR:?}/stub.py:/stub/stub.py:ro"]
    healthcheck: !override {test: ["CMD", "python", "-c", "0"], interval: 5s}
    restart: "no"
    environment:
      STUB_ROLE: agent-worker
      STUB_CANARY: ${MEDIC_S6_CANARY:?}

  agent-serve:
    image: python:3.12-slim
    build: !reset null
    container_name: !reset null
    ports: !reset []
    depends_on: !reset {}
    extra_hosts: !reset []
    entrypoint: !reset null
