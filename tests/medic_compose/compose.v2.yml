# Test-only override for tests/medic_compose/test_last_seen_live.py, last after
# compose.v1.yml. Never for installs.
#
# The skeleton's Medic doesn't serve its API yet (X2 is G3's), so a stub
# (stub.py, role medic-api) stands in for it as `medic`: same name, networks,
# uid and api_key secret, so the backend's poll goes through the real gateway
# exactly as it will to the real Medic. "Kill Medic" stops this container.
services:
  medic:
    image: python:3.12-slim
    build: !reset null
    entrypoint: !reset null
    command: !override ["python", "/stub/stub.py"]
    volumes: !override ["${MEDIC_V1_STUB_DIR:?}/stub.py:/stub/stub.py:ro"]
    healthcheck: !override {test: ["CMD", "python", "-c", "0"], interval: 5s}
    environment: !override
      STUB_ROLE: medic-api
