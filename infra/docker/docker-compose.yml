# Both agent processes run the same image against the same seam, so they take
# the same environment; only the command and the port differ. Anchored here
# rather than duplicated, because a URL that drifts between the two is a run
# that behaves differently depending on which process picked it up.
x-agent-env: &agent-env
  # No DATABASE_URL: the agent assembles the connection from these, the same way
  # the Helm chart supplies it.
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_DB=deeptempo_soc
  - POSTGRES_USER=deeptempo
  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
  - REDIS_URL=redis://redis:6379/0
  # The four /internal endpoints. Each defaults to localhost:6987 in-process,
  # which is the agent container itself here, so all four have to be named.
  # VIGIL_RUNS_URL unset is the quiet one: progress stops reaching the UI and a
  # run that needs an approval parks with nothing able to answer it.
  - VIGIL_PLAYBOOKS_URL=http://backend:6987/internal/playbooks
  - VIGIL_PRICING_URL=http://backend:6987/internal/pricing
  - VIGIL_RUNS_URL=http://backend:6987/internal/runs
  - VIGIL_TOOLS_URL=http://backend:6987/internal/tools/invoke
  # Same secret the backend checks. Empty on both sides means every /internal
  # call answers 503, so a run fails before its first model call.
  - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
  - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
  # Pass-through, not `${BIFROST_API_KEY:-}`: the harness falls back to a
  # placeholder only when the variable is absent, and the := form would set it
  # to an empty string the OpenAI client then sends as a real credential.
  - BIFROST_API_KEY
  # Inspecting-proxy CA. Pass-through (no `:-` default): an empty SSL_CERT_FILE
  # makes Python fail every HTTPS call. Bind-mount the operator PEM — Compose
  # has no optional-volume syntax, so do not default the source to /dev/null.
  #   volumes:
  #     - ${VIGIL_CA_BUNDLE}:/etc/vigil/ca-bundle.pem:ro
  # with SSL_CERT_FILE / REQUESTS_CA_BUNDLE / NODE_EXTRA_CA_CERTS=/etc/vigil/ca-bundle.pem
  - SSL_CERT_FILE
  - REQUESTS_CA_BUNDLE
  - NODE_EXTRA_CA_CERTS

services:
  postgres:
    # pgvector-capable image (findings.embedding uses vector(768) + HNSW).
    # The stock postgres:16 image does NOT ship the `vector` extension.
    image: pgvector/pgvector:pg16
    container_name: deeptempo-postgres
    environment:
      POSTGRES_DB: deeptempo_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      # Loopback-only. A bare "5432:5432" publishes on 0.0.0.0, which put the
      # findings, cases and llm_provider_configs tables in reach of anything on
      # the operator's network -- behind a password whose default is committed
      # above. Nothing off-host consumes this: sibling containers dial
      # postgres:5432 over deeptempo-network and a host-run backend uses
      # loopback. Widening this is a deployment decision, not a default.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Path is relative to this compose file (infra/docker/), so ../ points
      # at infra/, where the schema SQL now lives (infra/database/init/).
      # Must run here, not just in db-seed: the extensions have to exist before
      # the backend's create_all (its indexes use pg_trgm's gin_trgm_ops), and
      # the auth tables have to be created by this SQL — with the DEFAULT
      # clauses create_all does not emit. 00_apply.sh explains why it isn't
      # plain *.sql (Postgres initdb uses ON_ERROR_STOP=1 and would abort at 05).
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../database/init:/db-init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptempo -d deeptempo_soc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - deeptempo-network

  # Second pass over the same files, once the backend's create_all has built the
  # tables the data-only scripts need. On the default `up` (no profile): a seed
  # profile would never run — this compose file has no wrapper that `compose
  # run`s it. /api/health always returns 200, so wait for a table only create_all
  # creates — its DDL is one transaction, so that sentinel implies the rest.
  # Re-runs on every `up` so a volume that aborted at 05 still gets the rest of
  # the files.
  db-seed:
    image: postgres:16-alpine
    container_name: deeptempo-db-seed
    environment:
      PGHOST: postgres
      PGUSER: deeptempo
      PGDATABASE: deeptempo_soc
      PGPASSWORD: ${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
    volumes:
      - ../database/init:/db-init:ro
      - ./initdb/00_apply.sh:/apply.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 60); do
          [ "$$(psql -tAc "SELECT to_regclass('public.sla_policies') IS NOT NULL")" = t ] && break;
          sleep 1;
        done;
        if [ "$$(psql -tAc "SELECT to_regclass('public.sla_policies') IS NOT NULL")" != t ]; then
          echo "sla_policies still missing after wait; applying anyway" >&2;
        fi;
        exec sh /apply.sh
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, not service_healthy: /api/health always returns 200
      # "healthy" (including on error), so compose treating the backend as
      # ready is not a schema signal. The wait loop above is the real gate.
      # Started implies postgres/redis/bifrost are already up, which a
      # postgres-only depends_on would not.
      backend:
        condition: service_started
    restart: "no"
    networks:
      - deeptempo-network

  # Redis - Job queue backend for ARQ (LLM request queuing + session store)
  redis:
    image: redis:7-alpine
    container_name: deeptempo-redis
    ports:
      # Loopback-only, for the same reason as postgres above, and with less
      # standing in the way: this Redis runs without requirepass, so anything
      # that reaches the port owns the ARQ queue and the session store.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - deeptempo-network

  # SOC Backend API
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    container_name: deeptempo-backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deeptempo_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      - REDIS_URL=redis://redis:6379/0
      # Shared secret the agent worker presents on /internal. Unset means every
      # such call answers 503, so no workflow can run.
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
      # Chat and run projections. core/config.py defaults this to localhost:6989,
      # which was the agent layer's address while it shared the backend process.
      - AGENT_URL=http://agent-serve:6989
      - PYTHONUNBUFFERED=1
      # Inspecting-proxy CA. Pass-through; bind-mount the PEM (see x-agent-env).
      - SSL_CERT_FILE
      - REQUESTS_CA_BUNDLE
      - NODE_EXTRA_CA_CERTS
    ports:
      - "6987:6987"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deeptempo-network

  # Second pass: replay init SQL after the backend's create_all has built
  # ORM-managed tables. Mirrors clients/desktop/standalone/docker-compose.yml
  # db-seed. /api/health answers while create_all may still be running, so
  # the sentinel is an ORM-only table (sla_policies), not the health endpoint.
  db-seed:
    image: pgvector/pgvector:pg16
    container_name: deeptempo-db-seed
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: deeptempo
      PGDATABASE: deeptempo_soc
      PGPASSWORD: ${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
    volumes:
      - ../database/init:/db-init:ro
      - ./initdb/00_apply.sh:/apply.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 60); do
          [ "$$(psql -tAc "SELECT to_regclass('public.sla_policies') IS NOT NULL")" = t ] && break;
          sleep 1;
        done;
        exec sh /apply.sh
    restart: "no"
    networks:
      - deeptempo-network

  # SOC Daemon - Autonomous monitoring and response
  soc-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.daemon
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    container_name: deeptempo-daemon
    environment:
      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deeptempo_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      # AI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      # Redis (LLM queue)
      - REDIS_URL=redis://redis:6379/0
      # Polling intervals (seconds)
      - DAEMON_SPLUNK_POLL_INTERVAL=${DAEMON_SPLUNK_POLL_INTERVAL:-300}
      - DAEMON_CROWDSTRIKE_POLL_INTERVAL=${DAEMON_CROWDSTRIKE_POLL_INTERVAL:-60}
      # Processing
      - DAEMON_AUTO_TRIAGE=${DAEMON_AUTO_TRIAGE:-true}
      - DAEMON_AUTO_ENRICH=${DAEMON_AUTO_ENRICH:-true}
      - DAEMON_BATCH_SIZE=${DAEMON_BATCH_SIZE:-10}
      # Response
      - DAEMON_AUTO_RESPONSE=${DAEMON_AUTO_RESPONSE:-true}
      - DAEMON_CONFIDENCE_THRESHOLD=${DAEMON_CONFIDENCE_THRESHOLD:-0.90}
      - DAEMON_FORCE_APPROVAL=${DAEMON_FORCE_APPROVAL:-false}
      - DAEMON_DRY_RUN=${DAEMON_DRY_RUN:-false}
      # Escalation
      - DAEMON_ESCALATION_ENABLED=${DAEMON_ESCALATION_ENABLED:-true}
      - DAEMON_SLACK_ENABLED=${DAEMON_SLACK_ENABLED:-true}
      - DAEMON_SLACK_CHANNEL=${DAEMON_SLACK_CHANNEL:-#soc-alerts}
      - DAEMON_PAGERDUTY_ENABLED=${DAEMON_PAGERDUTY_ENABLED:-false}
      - DAEMON_ESCALATE_SEVERITIES=${DAEMON_ESCALATE_SEVERITIES:-critical,high}
      # Scheduler
      - DAEMON_THREAT_HUNT_ENABLED=${DAEMON_THREAT_HUNT_ENABLED:-true}
      - DAEMON_THREAT_HUNT_INTERVAL=${DAEMON_THREAT_HUNT_INTERVAL:-86400}
      - DAEMON_CLEANUP_RETENTION_DAYS=${DAEMON_CLEANUP_RETENTION_DAYS:-90}
      # Metrics / Health
      - DAEMON_METRICS_ENABLED=${DAEMON_METRICS_ENABLED:-true}
      - DAEMON_HEALTH_PORT=${DAEMON_HEALTH_PORT:-9091}
      # Webhook
      - DAEMON_WEBHOOK_ENABLED=${DAEMON_WEBHOOK_ENABLED:-true}
      - DAEMON_WEBHOOK_PORT=${DAEMON_WEBHOOK_PORT:-8081}
      # Logging
      - DAEMON_LOG_LEVEL=${DAEMON_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # Inspecting-proxy CA. Pass-through; bind-mount the PEM (see x-agent-env).
      - SSL_CERT_FILE
      - REQUESTS_CA_BUNDLE
      - NODE_EXTRA_CA_CERTS
      # Integrations (loaded from core/config)
      - SPLUNK_URL=${SPLUNK_URL}
      - SPLUNK_USERNAME=${SPLUNK_USERNAME}
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - CROWDSTRIKE_CLIENT_ID=${CROWDSTRIKE_CLIENT_ID}
      - CROWDSTRIKE_CLIENT_SECRET=${CROWDSTRIKE_CLIENT_SECRET}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
      # Kafka ingestion (opt-in; UI toggle at /settings?tab=kafka)
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-vigil-soc}
      - KAFKA_TOPICS=${KAFKA_TOPICS:-}
      - KAFKA_AUTO_OFFSET_RESET=${KAFKA_AUTO_OFFSET_RESET:-latest}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      - KAFKA_SSL_CA_LOCATION=${KAFKA_SSL_CA_LOCATION:-}
      - KAFKA_MAX_POLL_RECORDS=${KAFKA_MAX_POLL_RECORDS:-500}
      - KAFKA_SESSION_TIMEOUT_MS=${KAFKA_SESSION_TIMEOUT_MS:-30000}
    ports:
      - "8081:8081"  # Webhook ingestion
      - "9090:9090"  # Prometheus /metrics (OTEL PrometheusMetricReader)
      - "9091:9091"  # Health /health + /status
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deeptempo-network

  # ARQ Worker - Processes LLM requests from the queue
  llm-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    container_name: deeptempo-llm-worker
    command: ["python", "-m", "services.worker"]
    healthcheck:
      # Shares the backend image, whose HEALTHCHECK curls :6987. A queue worker
      # serves no HTTP, so inheriting it just reports unhealthy forever.
      disable: true
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deeptempo_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      # Inspecting-proxy CA. Pass-through; bind-mount the PEM (see x-agent-env).
      - SSL_CERT_FILE
      - REQUESTS_CA_BUNDLE
      - NODE_EXTRA_CA_CERTS
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deeptempo-network

  # ─── Agent layer (TypeScript) ─────────────────────────────────────────────
  # One image, two commands (infra/docker/Dockerfile.agent), the same split the
  # chart deploys: a queue consumer and an HTTP surface scale on unrelated
  # signals, so they are separate services here too.
  #
  # Drains the BullMQ `agent-runs` queue that core/agents/queue.py enqueues to.
  # Runs alongside llm-worker rather than replacing it — see
  # infra/helm/vigil/templates/agent-worker-deployment.yaml for what has to
  # stop using arq:llm before that one can go away.
  agent-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    container_name: deeptempo-agent-worker
    # The image's default CMD. Named anyway, so the two services read as the
    # pair they are rather than one command and one absence.
    command: ["node", "dist/worker.js"]
    environment: *agent-env
    healthcheck:
      # The image declares no HEALTHCHECK: the port depends on the command.
      # 6990 is probes only here — nothing routes to a queue consumer. Node 20
      # has global fetch, so this needs no curl in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:6990/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deeptempo-network

  # Chat over SSE and the run projections a supervisor reads. The backend calls
  # it at AGENT_URL. No `ports:` on purpose — ADR 0014 dropped the loopback
  # check, so what keeps this off the host is the private bridge plus the bearer
  # token, exactly as the chart relies on ClusterIP plus a NetworkPolicy.
  agent-serve:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    container_name: deeptempo-agent-serve
    command: ["node", "dist/serve.js"]
    environment: *agent-env
    healthcheck:
      # Deliberately the traffic port: a health check on a side port cannot
      # notice the one that serves requests wedging.
      test: ["CMD", "node", "-e", "fetch('http://localhost:6989/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # An SSE stream can sit on one model call for minutes; the chart's
    # terminationGracePeriodSeconds says the same thing.
    stop_grace_period: 120s
    # Postgres only. Serve reads and writes the ledger and never touches the
    # queue, which is the reason it is a separate service at all; waiting on
    # Redis would say otherwise.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deeptempo-network

  # ─── Multi-provider LLM gateway ───────────────────────────────────────────
  # Bifrost is the single path for all LLM traffic (GH #84 PR-B). Anthropic
  # calls hit the /anthropic passthrough (preserves extended thinking and
  # prompt caching); OpenAI/Ollama/etc. hit the /v1 OpenAI-format surface.
  # Live config lives in /app/data/config.db (SQLite); config.json is used
  # as a first-boot seed. Providers, keys, models and virtual keys are managed
  # from Vigil's own Settings -> AI Config, which reaches this config store
  # through the authenticated passthrough in
  # services/api/routers/bifrost_config.py. Bifrost's own UI at
  # http://localhost:8080 remains the place for what that passthrough
  # deliberately does not expose: cache and plugin config.
  bifrost:
    image: maximhq/bifrost:latest
    container_name: deeptempo-bifrost
    ports:
      # Loopback-only, for the same reason as postgres and redis above, and
      # with the least standing of the three: Bifrost serves an unauthenticated
      # config API on its inference port, so anything that reaches this can read
      # and rewrite provider credentials via PUT /api/providers/{name}/keys/
      # {key_id}. Sibling containers dial bifrost:8080 over deeptempo-network;
      # the UI at http://localhost:8080 is unaffected from the host.
      - "127.0.0.1:8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      # The file is the bootstrap; the volume is where Bifrost keeps what it was
      # told at runtime. Without it every UI change lasted until the next recreate.
      - bifrost_data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # wget --spider does HEAD and Bifrost /health only answers GET (405 on HEAD).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - deeptempo-network

  # PgAdmin for database management (optional, can be commented out in production)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deeptempo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@deeptempo.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # SERVER_MODE is deliberately left at pgAdmin's default (True). Setting it
      # to 'False' selects desktop mode, which disables the login prompt
      # entirely -- the container logs "Configuring authentication for DESKTOP
      # mode" and GET / lands straight on /browser/ with no credential check.
      # That made PGADMIN_DEFAULT_PASSWORD decorative rather than a gate (#707).
    ports:
      # Loopback-only, for the same reason as postgres and redis above. This
      # console reaches the database over deeptempo-network by service name, so
      # it is inside the perimeter that the loopback binds establish -- an
      # unauthenticated console published on 0.0.0.0 would route straight around
      # them, using the default password committed above.
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - dev  # Only start in dev profile

  # ─── Observability stack (opt-in: --profile observability) ────────────────

  # OpenTelemetry Collector — receives OTLP spans/metrics, fans out to Jaeger + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: deeptempo-otel-collector
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - deeptempo-network
    profiles:
      - observability

  # Jaeger — distributed trace UI
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: deeptempo-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - deeptempo-network
    profiles:
      - observability

  # Prometheus — scrapes /metrics from daemon and backend
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: deeptempo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9095:9090"  # Prometheus UI on host port 9095 (avoids conflict with daemon's 9090)
    networks:
      - deeptempo-network
    profiles:
      - observability

  # Grafana — dashboards for system overview, LLM costs, investigation lifecycle
  grafana:
    image: grafana/grafana:10.4.0
    container_name: deeptempo-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"  # Grafana UI
    depends_on:
      - prometheus
    networks:
      - deeptempo-network
    profiles:
      - observability

  # ─── SIEM testing ─────────────────────────────────────────────────────────

  # Splunk Enterprise for SIEM testing
  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    container_name: deeptempo-splunk
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme123}
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
    ports:
      - "8000:8000"   # Web UI (host 6990 is taken by the agent worker health port)
      - "8088:8088"   # HEC (HTTP Event Collector)
      - "8089:8089"   # Management port
      - "9997:9997"   # Forwarder port
    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
    restart: unless-stopped
    networks:
      - deeptempo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - splunk  # Only start when splunk profile is active

  # ─── Kafka (opt-in: --profile kafka) ─────────────────────────────────────
  # Single-broker KRaft-mode Kafka for local streaming ingestion. See the
  # "Kafka" tab in Settings to enable the consumer and configure topics.
  kafka:
    image: apache/kafka:3.7.0
    container_name: deeptempo-kafka
    hostname: kafka
    ports:
      - "9092:9092"  # External listener (host)
    environment:
      # KRaft single-broker controller/broker combined
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - kafka

  # ─── Elastic Security (opt-in: --profile elastic) ────────────────────────
  # Single-node Elasticsearch + Kibana for SIEM testing, mirroring the Splunk
  # profile. Security is disabled for local use, so the integration connects
  # over plain HTTP with no credentials. Seed data via Kibana's built-in sample
  # datasets (:5601 → Add data) or bulk-index to a logs-* index.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: deeptempo-elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"   # REST API
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - deeptempo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: deeptempo-kibana
    hostname: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"   # Web UI
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - elastic

  # ─── MISP threat-intel (opt-in: --profile misp) ──────────────────────────
  # Official MISP stack (core + modules + its own db/redis). Unlike Splunk/
  # Elastic there is no credential-less mode: after first boot, log into
  # https://localhost:8443 (admin@admin.test / admin), generate an Auth Key
  # (Administration → Auth Keys), put it in .env as MISP_API_KEY, then enable
  # the `misp` MCP server. First boot takes several minutes to initialise.
  misp-db:
    image: mariadb:11.4
    container_name: deeptempo-misp-db
    environment:
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misp
      - MYSQL_ROOT_PASSWORD=misp_root
      - MYSQL_DATABASE=misp
    command: --innodb-buffer-pool-size=256M
    volumes:
      - misp_db:/var/lib/mysql
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - misp

  misp-redis:
    image: valkey/valkey:7.2
    container_name: deeptempo-misp-redis
    # misp-core defaults to redis password "redispassword" (incl. the PHP
    # session save_path); require it here so sessions authenticate.
    command: ["valkey-server", "--requirepass", "redispassword"]
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - misp

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:latest
    container_name: deeptempo-misp-modules
    environment:
      - REDIS_BACKEND=misp-redis
    depends_on:
      - misp-redis
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - misp

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: deeptempo-misp-core
    environment:
      - BASE_URL=https://localhost:8443
      - MYSQL_HOST=misp-db
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misp
      - MYSQL_DATABASE=misp
      # This image reads REDIS_HOST/PORT/PASSWORD (not REDIS_FQDN). Point at our
      # own misp-redis — otherwise it defaults to host "redis", which collides
      # with Vigil's redis on this network and breaks sessions. Keep the image's
      # default password so the PHP session save_path matches misp-redis.
      - REDIS_HOST=misp-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
      - DISABLE_IPV6=true
    ports:
      - "127.0.0.1:8443:443"   # Web UI + REST (self-signed TLS)
    volumes:
      - misp_config:/var/www/MISP/app/Config
      - misp_files:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
    depends_on:
      - misp-db
      - misp-redis
      - misp-modules
    restart: unless-stopped
    networks:
      - deeptempo-network
    profiles:
      - misp

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  splunk_data:
    driver: local
  splunk_etc:
    driver: local
  prometheus_data:
    driver: local
  bifrost_data:
    driver: local
  grafana_data:
    driver: local
  kafka_data:
    driver: local
  elastic_data:
    driver: local
  misp_db:
    driver: local
  misp_config:
    driver: local
  misp_files:
    driver: local
  misp_logs:
    driver: local

networks:
  deeptempo-network:
    driver: bridge

