# Medic on Compose, part 2 of 2: Medic's networks and the Vigil services on them.
#
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/medic/docker-compose.medic.yml --profile medic up -d
#
# Part 1 is the three `profiles: [medic]` services in docker-compose.yml. This
# file is separate because putting soc-daemon and the agents on medic-net in the
# main file would change them for every install, Medic on or off (C8: off by
# default changes nothing). So it adds Medic's networks and the backend's path to
# Medic's status, and nothing else. Use it on every compose command that should
# keep Medic, or Docker drops the agents off medic-net at the next `up` (Medic
# then sees DNS errors: blind, not down).
# scripts/lib.sh `dc` (start.sh) and the console's service controls add it
# whenever enable-compose.sh's compose.env exists (V1-4).
#
# Both networks are `internal: true` and the host has no address on their
# bridges: nothing on them has a route off the host or to it (C3 R2). Neither holds the backend (R1), Redis, Postgres or Bifrost (C3 §5).
#   medic-net      Medic + the three below, whose readiness and status ports
#                  Medic reads directly. They keep deeptempo-network, so their
#                  own traffic is unchanged.
#   medic-private  Medic + medic-gateway (outbound :8471) + medic-dockerproxy.
#                  Kept apart from medic-net so the agents, which handle
#                  attacker-influenced content, can't use Medic's Docker proxy
#                  or its Viewer session (S6-9).
# tests/medic_compose/ pins all of this.
services:
  # The backend polls Medic's status once a minute (C5 §5.3, V2) through the
  # gateway's inbound listener, the alias on deeptempo-network, with the same
  # X-Medic-Key Medic checks. Never on a Medic network itself (C3 rule 5).
  backend:
    environment:
      VIGIL_MEDIC_API_URL: http://medic-gateway-in:8470
      VIGIL_MEDIC_API_KEY_FILE: /run/secrets/medic_api_key
    secrets:
      - medic_api_key
    # The key file is root:10010 0640 on Linux; Medic shares this group (S6-3).
    group_add: ["10010"]
  soc-daemon:
    networks: [medic-net]
  agent-worker:
    networks: [medic-net]
  agent-serve:
    networks: [medic-net]

# inhibit_ipv4: the host takes no address on these bridges. `internal` alone
# drops forwarded traffic but leaves the host's own address on the bridge, so
# anything on the host listening on 0.0.0.0 (sshd, a published port) answered
# Medic and the agents there. Members still reach each other on the bridge.
networks:
  medic-net:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  medic-private:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
