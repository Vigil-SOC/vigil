# Medic on Compose, part 2 of 2: medic-net and the Vigil services on it.
#
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/medic/docker-compose.medic.yml --profile medic up -d
#
# Part 1 is the three `profiles: [medic]` services in docker-compose.yml. This
# file is separate because putting soc-daemon and the agents on medic-net in the
# main file would change them for every install, Medic on or off (C8: off by
# default changes nothing). So it adds medic-net and nothing else. Use it on
# every compose command that should keep Medic, or Docker drops the agents off
# medic-net at the next `up`.
#
# medic-net (C3 §4.4, shape C): `internal: true`, so nothing on it has a route
# off the host (R2). Members: medic, medic-gateway, medic-dockerproxy (from the
# main file) and the three below, whose readiness and status ports Medic reads
# directly. NOT the backend (R1): Medic reaches it only through the gateway's
# path list. Redis, Postgres and Bifrost stay off until a read-only role or ACL
# exists (C3 §5). The three below keep deeptempo-network, so their own traffic
# is unchanged. tests/medic_compose/ pins all of this.
services:
  soc-daemon:
    networks: [medic-net]
  agent-worker:
    networks: [medic-net]
  agent-serve:
    networks: [medic-net]

networks:
  medic-net:
    internal: true
