{{- if .Values.llmWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.llmWorker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "llm-worker") | nindent 4 }}
spec:
  {{- if not .Values.llmWorker.autoscaling.enabled }}
  replicas: {{ .Values.llmWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "llm-worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.llmWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vigil.serviceAccountName" . }}
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: llm-worker
          image: {{ include "vigil.image" (dict "context" . "component" "llmWorker") | quote }}
          imagePullPolicy: {{ include "vigil.imagePullPolicy" (dict "context" . "component" "llmWorker") }}
          command:
            - python
            - -m
            - services.worker
          envFrom:
            {{- include "vigil.envFrom" . | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vigil.postgres.passwordSecret" . }}
                  key: {{ include "vigil.postgres.passwordSecretKey" . }}
            {{- include "vigil.env" . | nindent 12 }}
            {{- include "vigil.stateEnv" . | nindent 12 }}
            {{- include "vigil.caBundleEnv" . | nindent 12 }}
            {{- with .Values.llmWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* No port to probe: an ARQ worker is reached through Redis. Each
                 probe asks ARQ whether this pod's health key exists; the worker
                 rewrites it every 30 s from its poll loop (health_check_interval
                 in services/worker/jobs.py) and it expires 31 s later, so a
                 wedged loop lets it lapse.

                 Startup covers on_startup (gateway rate fetch, router init)
                 before the first key is written: up to 30 x 10 s = 300 s, as
                 backend allows. Liveness then tolerates 4 x 30 s = 120 s
                 without the key -- about four refresh cycles -- so one slow
                 check or a short Redis blip cannot flap it, while a wedged
                 worker is restarted within roughly 2.5 min. Readiness drops
                 after two misses, which halts a rollout whose new pods never
                 start polling. */}}
          startupProbe:
            exec:
              command: ["arq", "--check", "services.worker.jobs.WorkerSettings"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["arq", "--check", "services.worker.jobs.WorkerSettings"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["arq", "--check", "services.worker.jobs.WorkerSettings"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            {{- toYaml .Values.llmWorker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "vigil.stateVolumeMount" . | nindent 12 }}
            {{- include "vigil.caBundleVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "vigil.stateVolume" . | nindent 8 }}
        {{- include "vigil.caBundleVolume" . | nindent 8 }}
      {{- with .Values.llmWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
