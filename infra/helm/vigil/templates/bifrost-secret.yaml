{{- /*
Admin password for the in-chart Bifrost, in a Secret of its own so only the Bifrost
pod and the pods that call its /api/* hold it. Skipped when bifrost.auth.existingSecret
supplies it. Rendered even with secrets.existingSecret or externalSecret: those
replace the app Secret, not this one.

Bifrost enables auth on this value and answers 401 when it is empty, so one is always
set: secrets.bifrostAdminPassword, else generated once and read back with lookup on
every upgrade so it stays put. lookup sees nothing under `helm template` or a GitOps
controller, which would draw a new one each render; set secrets.bifrostAdminPassword
there.
*/ -}}
{{- if and .Values.bifrost.enabled (not .Values.bifrost.auth.existingSecret) }}
{{- $name := include "vigil.bifrost.auth.secretName" . }}
{{- $key := include "vigil.bifrost.auth.secretKey" . }}
{{- $password := .Values.secrets.bifrostAdminPassword }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = (dig "data" $key "" $existing) | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $password | quote }}
{{- end }}
