{{- /*
The shell's bearer (#4570), in its own Secret as the MCP runner's is: the shell
pod holds this one key, which opens nothing but the shell. Skipped when
secrets.existingSecret or externalSecret supplies it (see vigil.agentShell.tokenSecret).

Left unset, a token is generated once and read back with lookup on every
upgrade. lookup sees nothing under `helm template` or a GitOps controller, which
would draw a new one each render; set secrets.agentShellToken there.
*/ -}}
{{- if and .Values.agentShell.enabled (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- $name := include "vigil.agentShell.fullname" . }}
{{- $token := .Values.secrets.agentShellToken }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token = (dig "data" "SHELL_TOKEN" "" $existing) | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-shell") | nindent 4 }}
type: Opaque
stringData:
  SHELL_TOKEN: {{ $token | quote }}
{{- end }}
