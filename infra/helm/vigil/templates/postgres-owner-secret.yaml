{{- /* Owner password, mounted only by Postgres and the db-init Job. */ -}}
{{- if eq (include "vigil.postgres.usesChartOwnerSecret" .) "true" }}
{{- $owner := required "secrets.postgresPassword is required unless postgresql.auth.existingSecret, postgresql.external.existingSecret, or the Bitnami subchart supplies the owner password" .Values.secrets.postgresPassword }}
{{- if eq $owner "change-me-before-production" }}
{{- fail "secrets.postgresPassword is the published default \"change-me-before-production\". This chart will not change the owner password inside Postgres: change it there first (ALTER ROLE for postgresql.auth.username), set that value as secrets.postgresPassword, and set a different secrets.vigilAppPassword." }}
{{- end }}
{{- if and .Values.secrets.vigilAppPassword (eq $owner .Values.secrets.vigilAppPassword) }}
{{- fail "secrets.vigilAppPassword must differ from secrets.postgresPassword. App workloads log in as vigil_app and must not be able to authenticate as the database owner." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigil.postgres.ownerSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $owner | quote }}
{{- end }}
