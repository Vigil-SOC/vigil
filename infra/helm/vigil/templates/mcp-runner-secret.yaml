{{- /*
The runner's bearer, deliberately not in the app Secret: the runner pod must
hold this one key and nothing else. Skipped when secrets.existingSecret or
externalSecret supplies it (see vigil.mcpRunner.tokenSecret).

Left unset, a token is generated once and read back with lookup on every
upgrade, so it stays put. lookup sees nothing under `helm template` or a
GitOps controller, which would draw a new one each render; set
secrets.mcpRunnerToken there.
*/ -}}
{{- if and .Values.mcpRunner.enabled (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- $name := include "vigil.mcpRunner.fullname" . }}
{{- $token := .Values.secrets.mcpRunnerToken }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token = (dig "data" "MCP_RUNNER_TOKEN" "" $existing) | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "mcp-runner") | nindent 4 }}
type: Opaque
stringData:
  MCP_RUNNER_TOKEN: {{ $token | quote }}
{{- end }}
