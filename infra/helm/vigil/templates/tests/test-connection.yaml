apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vigil.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "vigil.imagePullSecrets" . | nindent 2 }}
  # The backend image ships curl and runs as its non-root vigil user (1000).
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ include "vigil.image" (dict "context" . "component" "backend") | quote }}
      imagePullPolicy: {{ include "vigil.imagePullPolicy" (dict "context" . "component" "backend") }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - /bin/sh
        - -ec
        - |
          set -eu
          echo "Checking backend /api/health/ready..."
          curl -fsS --max-time 10 "http://{{ include "vigil.backend.fullname" . }}:{{ .Values.backend.service.port }}/api/health/ready"
          echo
          {{- if .Values.daemon.enabled }}
          echo "Checking daemon /health..."
          curl -fsS --max-time 10 "http://{{ include "vigil.daemon.fullname" . }}:{{ .Values.daemon.ports.health }}/health"
          echo
          {{- end }}
          echo "All health checks passed."
