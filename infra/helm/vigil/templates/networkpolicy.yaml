{{- if .Values.networkPolicies.enabled }}
{{- /*
NetworkPolicies for Vigil SOC.

Each policy is default-deny on ingress with explicit allow-rules. Egress is
permissive by default (DNS + HTTPS to 0.0.0.0/0) because the daemon and
backend need to reach external APIs (Anthropic, SIEM/EDR, threat intel).
Users can lock egress down further by adding custom policies in the same
namespace.

Component label selectors reuse the chart's standard labels, so these
policies break cleanly if a pod isn't labeled — no silent misrouting.

No rule admits `namespaceSelector: {}`: that selects every pod in the cluster,
not the kubelet. Calico and Cilium let node-sourced probes through on their own;
elsewhere, `networkPolicies.probeAllowFrom` adds node CIDRs to the httpGet probe
ports only (backend, daemon health, agent-worker, agent-serve).
*/ -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Default: allow all egress (locked down per-component below).
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Ingress controller traffic (label selector is user-configurable)
    {{- with .Values.networkPolicies.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.backend.service.port }}
    {{- end }}
    # In-namespace traffic (daemon hitting backend, llm-worker, helm test, etc.)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- include "vigil.networkPolicy.probeRule" (dict "context" . "port" .Values.backend.service.port) | nindent 4 }}
---
{{- if .Values.daemon.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "daemon") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Webhook: external senders by CIDR (empty = in-namespace pods only)
    {{- with .Values.networkPolicies.daemon.webhookAllowFrom }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.daemon.ports.webhook }}
    {{- end }}
    # In-namespace pods (backend health check, helm test)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.daemon.ports.webhook }}
        - protocol: TCP
          port: {{ .Values.daemon.ports.metrics }}
        - protocol: TCP
          port: {{ .Values.daemon.ports.health }}
    {{- include "vigil.networkPolicy.probeRule" (dict "context" . "port" .Values.daemon.ports.health) | nindent 4 }}
---
{{- end }}
{{- if .Values.llmWorker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-llm-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "llm-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 6 }}
  policyTypes: [Ingress]
  # llm-worker does not expose ports — no pod should be hitting it.
  # Egress only.
  ingress: []
---
{{- end }}
{{- if .Values.agentWorker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-agent-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 6 }}
  policyTypes: [Ingress]
  # Its work arrives over Redis, so nothing routes to it. Only the probe port
  # 6990 is reached: by the kubelet, and by Medic, whose one sensor is /readyz.
  {{- if or .Values.networkPolicies.probeAllowFrom .Values.medic.enabled }}
  ingress:
    {{- if .Values.medic.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.medic.selectorLabels" (dict "context" . "component" "medic") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6990
    {{- end }}
    {{- include "vigil.networkPolicy.probeRule" (dict "context" . "port" 6990) | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
---
{{- end }}
{{- if .Values.agentServe.enabled }}
{{- /*
The control ADR 0014 leans on. Dropping the loopback check left the bearer token
as the only in-process gate, and this is what replaces the bind: chat and run
projections are reachable from the backend and from nowhere else.

Deliberately narrower than the backend policy above, which admits any pod in the
namespace. That one is shared by the daemon, llm-worker and helm test, so
tightening it is a change to those; this surface has exactly one caller.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-agent-serve
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-serve") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-serve") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.agentServe.service.port }}
    {{- include "vigil.networkPolicy.probeRule" (dict "context" . "port" .Values.agentServe.service.port) | nindent 4 }}
---
{{- end }}
{{- if .Values.mcpRunner.enabled }}
{{- /*
The runner's control and MCP routes answer the backend and daemon only. No
probe rule: its probes are exec, so the kubelet never dials the port. No egress
rule either: the Postgres and Redis policies below admit named components, and
the runner is not one. With the Bitnami subcharts, enable their own
networkPolicy to keep it that way.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-mcp-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "mcp-runner") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "mcp-runner") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6991
---
{{- end }}
{{- /* NetworkPolicy for MVP Postgres only. Bitnami's chart has its own
       networkPolicy.* config — enable that there instead. */ -}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.bitnami.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "db-init") | nindent 14 }}
        {{- /* Both: serve's readiness probe is a query, so omitting it here does
               not degrade the Deployment, it stops it rolling out. */}}
        {{- if .Values.agentWorker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 14 }}
        {{- end }}
        {{- if .Values.agentServe.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-serve") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
---
{{- end }}
{{- /* NetworkPolicy for MVP Redis only. Bitnami's chart has its own config. */ -}}
{{- if and .Values.redis.enabled (not .Values.redis.bitnami.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 14 }}
        {{- /* The worker only: serve never touches the queue. */}}
        {{- if .Values.agentWorker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
{{- end }}
