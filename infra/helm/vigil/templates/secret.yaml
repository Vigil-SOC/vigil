{{- /* Don't render the plain Secret when either an existingSecret was
       supplied OR an ExternalSecret will materialize one. */ -}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigil.secret.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- /* Owner password lives in the postgres Secret, not here: this Secret is
         envFrom'd into the backend, the daemon and llm-worker. */}}
  {{- $app := required "secrets.vigilAppPassword is required when secrets.existingSecret is not set" .Values.secrets.vigilAppPassword }}
  {{- if and .Values.secrets.postgresPassword (eq .Values.secrets.postgresPassword $app) }}
  {{- fail "secrets.vigilAppPassword must differ from secrets.postgresPassword. App workloads log in as vigil_app and must not be able to authenticate as the database owner." }}
  {{- end }}
  POSTGRES_APP_PASSWORD: {{ $app | quote }}
  {{- /* Unset: generated once and read back with lookup on every upgrade, as
         redis-secret.yaml does. lookup sees nothing under `helm template` or a
         GitOps controller, which would draw a new one each render; set
         secrets.vigilAgentPassword there. */}}
  {{- $agent := .Values.secrets.vigilAgentPassword }}
  {{- if not $agent }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "vigil.secret.fullname" .) }}
  {{- $agent = (dig "data" "POSTGRES_AGENT_PASSWORD" "" $existing) | b64dec | default (randAlphaNum 48) }}
  {{- end }}
  {{- if or (eq $agent $app) (and .Values.secrets.postgresPassword (eq .Values.secrets.postgresPassword $agent)) }}
  {{- fail "secrets.vigilAgentPassword must differ from secrets.vigilAppPassword and secrets.postgresPassword. The agent workloads log in as vigil_agent and must not be able to authenticate as vigil_app or the owner." }}
  {{- end }}
  POSTGRES_AGENT_PASSWORD: {{ $agent | quote }}
  {{- with .Values.secrets.jwtSecretKey }}
  JWT_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.agentInternalToken }}
  AGENT_INTERNAL_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.splunkPassword }}
  SPLUNK_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.splunkMcpToken }}
  SPLUNK_MCP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.crowdstrikeClientId }}
  CROWDSTRIKE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.crowdstrikeClientSecret }}
  FALCON_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.elasticApiKey }}
  ELASTIC_SIEM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.elasticPassword }}
  ELASTIC_SIEM_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.criblPassword }}
  CRIBL_STREAM_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.darktraceWebhookSecret }}
  DARKTRACE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.vstrikeApiKey }}
  VSTRIKE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.vstrikeInboundApiKey }}
  VSTRIKE_INBOUND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.virustotalApiKey }}
  VIRUSTOTAL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.shodanApiKey }}
  SHODAN_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.alienvaultOtxApiKey }}
  ALIENVAULT_OTX_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.joeSandboxApiKey }}
  JOE_SANDBOX_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.capeSandboxApiKey }}
  CAPE_SANDBOX_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackBotToken }}
  SLACK_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.pagerdutyRoutingKey }}
  PAGERDUTY_INTEGRATION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.teamsWebhookUrl }}
  MICROSOFT_TEAMS_WEBHOOK_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.kafkaSaslPassword }}
  KAFKA_SASL_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bifrostAdminPassword }}
  BIFROST_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
