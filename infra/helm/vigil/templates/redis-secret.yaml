{{- /*
Password for the in-chart Redis, in a Secret of its own so only the Redis pod and
the pods that connect to it hold it. Skipped when redis.auth.existingSecret
supplies it, and with the in-chart StatefulSet (Bitnami keeps its own).

Left unset, a password is generated once and read back with lookup on every
upgrade, so it stays put. lookup sees nothing under `helm template` or a GitOps
controller, which would draw a new one each render; set redis.auth.password there.
*/ -}}
{{- if and .Values.redis.enabled (not .Values.redis.bitnami.enabled) (not .Values.redis.auth.existingSecret) }}
{{- $name := include "vigil.redis.auth.secretName" . }}
{{- $key := include "vigil.redis.auth.secretKey" . }}
{{- $password := .Values.redis.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = (dig "data" $key "" $existing) | b64dec | default (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $password | quote }}
{{- end }}
