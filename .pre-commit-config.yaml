# Versions and `files` must match requirements-dev.txt and CI, or this formats
# into a state CI rejects.
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(services|core)/

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        files: ^(services|core)/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: ^(services|core)/

  # The committed frontend types are generated from the API's OpenAPI spec, and
  # CI's Generated API Types check fails when they lag it. A route docstring is
  # enough: the spec carries it. Regenerate on any backend change instead of
  # finding out in CI. Same command CI runs.
  - repo: local
    hooks:
      - id: frontend-types
        name: regenerate frontend API types
        entry: python scripts/generate_frontend_types.py
        language: system
        files: ^(services|core|tools)/.*\.py$
        pass_filenames: false
