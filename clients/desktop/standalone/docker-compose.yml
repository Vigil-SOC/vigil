# Standalone stack: every service runs from a published image, so the app needs
# no source tree, venv, Python or Node — only Docker. Mirrors
# infra/docker/docker-compose.yml minus the build: contexts and the dev-only services.
#
# Its own project name and unnamed containers keep it isolated from a dev stack
# (project "docker", containers deeptempo-*) so both can coexist on one machine.
# Only the backend publishes a port; everything else stays on the internal
# network. The app mints two Postgres passwords per install: the owner password,
# and a different one for vigil_app. It resets both on every start, so older
# volumes pick them up too. App containers receive only the vigil_app password.
name: vigil

# Both agent processes take the same environment (see x-agent-env in
# infra/docker/docker-compose.yml): a URL that drifts between them is a run that
# behaves differently depending on which process picked it up.
x-agent-env: &agent-env
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_DB=deeptempo_soc
  - POSTGRES_USER=vigil_app
  - POSTGRES_PASSWORD=${POSTGRES_APP_PASSWORD:?set by the desktop app}
  - REDIS_URL=redis://redis:6379/0
  # Each defaults to localhost:6987, which is the agent container itself here.
  - VIGIL_PLAYBOOKS_URL=http://backend:6987/internal/playbooks
  - VIGIL_PRICING_URL=http://backend:6987/internal/pricing
  - VIGIL_RUNS_URL=http://backend:6987/internal/runs
  - VIGIL_TOOLS_URL=http://backend:6987/internal/tools/invoke
  # Same secret the backend checks; empty means every /internal call is a 503.
  - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?set by the desktop app}
  - BIFROST_URL=http://bifrost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deeptempo_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by the desktop app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set by the desktop app}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptempo -d deeptempo_soc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vigil

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vigil

  bifrost:
    # Pinned to match infra/docker/docker-compose.yml; see the note there before bumping.
    image: maximhq/bifrost:${BIFROST_IMAGE_TAG:-v2.2.1}
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Same file as the server stack (prepare-standalone.js copies it).
      # Empty is rejected: an unset password would enable auth and lock /api/*.
      - BIFROST_ADMIN_PASSWORD=${BIFROST_ADMIN_PASSWORD:?set by the desktop app}
    volumes:
      # The file is the bootstrap; the volume is where Bifrost keeps what it was
      # told at runtime. The app runs `compose down` on quit, so without it every
      # UI change (keys, virtual keys, budgets) lasted until the next quit.
      - bifrost_data:/app/data
      - ./bifrost-config.json:/app/data/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # wget --spider does HEAD and Bifrost /health only answers GET (405 on HEAD).
      # Proxy vars cleared: busybox wget ignores no_proxy, so a gateway proxy would catch this loopback probe.
      test: ["CMD-SHELL", "env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY wget -qO- http://localhost:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Host Ollama: implicit on Docker Desktop, required on native Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vigil

  backend:
    image: ghcr.io/vigil-soc/vigil-backend:${VIGIL_VERSION}
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deeptempo_soc
      - POSTGRES_USER=vigil_app
      - POSTGRES_PASSWORD=${POSTGRES_APP_PASSWORD:?set by the desktop app}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=http://bifrost:8080
      - BIFROST_ADMIN_PASSWORD=${BIFROST_ADMIN_PASSWORD:?set by the desktop app}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      # Auth stays on (DEV_MODE defaults to false in the image). The app mints
      # this per install and persists it; the backend fails closed without it.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set by the desktop app}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?set by the desktop app}
      # core/config.py defaults to localhost:6989, which is nothing here.
      - AGENT_URL=http://agent-serve:6989
      - VIGIL_UPGRADE_DIR=/var/lib/vigil-upgrade
    ports:
      - "127.0.0.1:6987:6987"
    volumes:
      # Must track HOME in Dockerfile.backend, or every UI-configured key dies
      # on restart. The image pre-creates the dir owned by 1000:1000 so a fresh
      # named volume inherits that; a volume from before #701 does not, and has
      # to be recreated.
      - vigil_home:/home/vigil/.vigil
      - upgrade_state:/var/lib/vigil-upgrade
      # Detection rule repositories, fetched from Settings. Pre-created by the
      # image like the State Directory, and kept out of it.
      - detection_rules:/home/vigil/security-detections
    # logs/ is workdir-relative and /app is root-owned, so tmpfs is the only
    # mount that can carry the right owner. Keep uid/gid in step with
    # Dockerfile.backend.
    tmpfs:
      - /app/logs:uid=1000,gid=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
      upgrade:
        condition: service_completed_successfully
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vigil

  # Agent layer: one image, two commands. The worker drains BullMQ `agent-runs`;
  # serve answers AGENT_URL. Neither publishes a port — the private network plus
  # the bearer token is what keeps them off the host.
  agent-worker:
    image: ghcr.io/vigil-soc/vigil-agent:${VIGIL_VERSION}
    command: ["node", "dist/worker.js"]
    environment: *agent-env
    healthcheck:
      # 6990 is probes only; Node 20 has global fetch, so no curl in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:6990/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backup-pre-upgrade:
        condition: service_completed_successfully
      upgrade:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - vigil

  agent-serve:
    image: ghcr.io/vigil-soc/vigil-agent:${VIGIL_VERSION}
    command: ["node", "dist/serve.js"]
    environment: *agent-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6989/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # An SSE stream can sit on one model call for minutes.
    stop_grace_period: 120s
    # Postgres only, plus the upgrade one-shot: serve never touches the queue.
    depends_on:
      postgres:
        condition: service_healthy
      backup-pre-upgrade:
        condition: service_completed_successfully
      upgrade:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - vigil

  # Snapshot before the upgrade one-shot. No backups.json on a desktop install,
  # so the point lands in the upgrade directory. Writes restore-point there;
  # the upgrade service passes it and does not take another.
  backup-pre-upgrade:
    image: ghcr.io/vigil-soc/vigil-backend:${VIGIL_VERSION}
    environment:
      HOME: /home/vigil
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: deeptempo_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by the desktop app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set by the desktop app}
      VIGIL_BACKUP_OWNER_CONNECTION: "1"
      VIGIL_UPGRADE_DIR: /var/lib/vigil-upgrade
      VIGIL_UPGRADE_ACK_VERSION: ${VIGIL_UPGRADE_ACK_VERSION:-}
      VIGIL_UPGRADE_ACK_REASON: ${VIGIL_UPGRADE_ACK_REASON:-}
    volumes:
      - vigil_home:/home/vigil/.vigil
      - upgrade_state:/var/lib/vigil-upgrade
      - bifrost_data:/var/lib/vigil/bifrost
    entrypoint:
      - python
      - -m
      - core.backup
      - pre-upgrade
      - --bifrost-data
      - /var/lib/vigil/bifrost
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - vigil

  # Schema, then vigil_app's password. restart "no": a refusal leaves the API
  # and the agent processes unstarted.
  upgrade:
    image: ghcr.io/vigil-soc/vigil-backend:${VIGIL_VERSION}
    environment:
      HOME: /home/vigil
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: deeptempo_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by the desktop app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set by the desktop app}
      VIGIL_UPGRADE_DIR: /var/lib/vigil-upgrade
      VIGIL_UPGRADE_ACK_VERSION: ${VIGIL_UPGRADE_ACK_VERSION:-}
      VIGIL_UPGRADE_ACK_REASON: ${VIGIL_UPGRADE_ACK_REASON:-}
    volumes:
      - upgrade_state:/var/lib/vigil-upgrade
      - ./upgrade-oneshot.sh:/upgrade-oneshot.sh:ro
      - ./initdb/00_apply.sh:/vigil-app-password.sh:ro
    entrypoint:
      - /bin/sh
      - /upgrade-oneshot.sh
    depends_on:
      postgres:
        condition: service_healthy
      backup-pre-upgrade:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - vigil

volumes:
  postgres_data:
  redis_data:
  vigil_home:
  detection_rules:
  bifrost_data:
  upgrade_state:

networks:
  vigil:
