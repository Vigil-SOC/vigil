<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Starting Vigil</title>
    <style>
      /* Colors mirror the app theme tokens in clients/web/src/styles.css:
         --bg #0c0f14, --tx #e8ebf0, --tx-3 #7c8593, --line #232a35. The spinner
         and Retry use the sage logo color (#BCC1AB) so the splash matches the
         app icon; ok/fail use the theme green/red. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0f14; color: #e8ebf0; padding: 26px 30px; user-select: none;
      }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
      .sub { font-size: 12px; color: #7c8593; margin-bottom: 18px; }
      ul { list-style: none; margin: 0; padding: 0; flex: 1; }
      li { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 4px 0; color: #7c8593; }
      .dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; border: 2px solid #232a35; }
      li.start .dot { border-color: #bcc1ab; border-top-color: transparent; animation: spin 0.7s linear infinite; }
      li.ok .dot { background: #3aab74; border-color: #3aab74; }
      li.fail .dot { background: #e5635f; border-color: #e5635f; }
      li.ok, li.start { color: #e8ebf0; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .log { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10.5px;
        color: #58616e; height: 54px; overflow: hidden; white-space: pre-wrap;
        border-top: 1px solid #1b212b; padding-top: 8px; margin-top: 8px; }
      .err { color: #e5635f; }
      .acts { display: none; gap: 8px; margin-top: 10px; }
      button { background: #bcc1ab; border: 0; color: #0c0f14; font-weight: 600;
        padding: 7px 14px; border-radius: 6px; cursor: pointer; }
      button.ghost { background: transparent; color: #7c8593; border: 1px solid #232a35; }
      button:disabled { opacity: 0.45; cursor: default; }
      /* Shown in place of the step list when no restore point could be taken. */
      .ack { display: none; flex: 1; flex-direction: column; gap: 8px; min-height: 0; }
      .report { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: #e8ebf0;
        background: #131820; border: 1px solid #232a35; border-radius: 6px; padding: 7px 9px;
        max-height: 96px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      .ack p { margin: 0; font-size: 12px; color: #7c8593; line-height: 1.4; }
      .ack label { font-size: 12px; color: #e8ebf0; }
      textarea { width: 100%; resize: none; height: 52px; font: inherit; font-size: 12px; color: #e8ebf0;
        background: #0c0f14; border: 1px solid #232a35; border-radius: 6px; padding: 6px 8px; user-select: text; }
      textarea:focus { outline: none; border-color: #bcc1ab; }
    </style>
  </head>
  <body>
    <h1>Vigil</h1>
    <div class="sub" id="sub">Starting the security operations stack…</div>
    <ul id="steps"></ul>
    <div class="ack" id="ack">
      <div class="report" id="ack-report"></div>
      <p id="ack-note"></p>
      <label for="ack-reason">Reason for starting without a restore point</label>
      <textarea id="ack-reason" maxlength="500"></textarea>
      <div class="acts" style="display: flex; margin-top: 0">
        <button id="ack-go" disabled>Start without a restore point</button>
        <button id="ack-retry" class="ghost">Retry</button>
        <button id="ack-quit" class="ghost">Quit</button>
      </div>
    </div>
    <div class="log" id="log"></div>
    <div class="acts">
      <button id="retry">Retry</button>
      <button id="quit" class="ghost">Quit</button>
    </div>
    <script>
      const LABELS = {
        python: "Locating Python", env: "Loading configuration",
        venv: "Creating virtual environment", deps: "Installing Python dependencies",
        "frontend-deps": "Installing UI dependencies", "frontend-build": "Building the UI",
        docker: "Starting Docker", services: "Starting services (postgres, redis, bifrost, ollama)",
        images: "Preparing Vigil (first run only)",
        frontend: "Checking the UI build", schema: "Preparing the database",
        backend: "Starting the backend", setup: "Setup complete", up: "Ready",
        restore: "Restoring the pre-upgrade point",
      };
      const stepsEl = document.getElementById("steps");
      const logEl = document.getElementById("log");
      const rows = {};
      function row(phase) {
        if (rows[phase]) return rows[phase];
        const li = document.createElement("li");
        li.innerHTML = '<span class="dot"></span><span></span>';
        li.querySelector("span:last-child").textContent = LABELS[phase] || phase;
        stepsEl.appendChild(li);
        rows[phase] = li;
        return li;
      }
      window.vigil.onStep(({ phase, status }) => {
        if (phase === "up" || phase === "setup") { if (status === "done") return; }
        const li = row(phase);
        li.className = status;
      });
      window.vigil.onLog((line) => { logEl.textContent = line; });
      // No restore point could be taken. The reason is kept for this version
      // only; the main process retries the launch with it.
      window.vigil.onAck(({ report, version }) => {
        const ack = document.getElementById("ack");
        const reason = document.getElementById("ack-reason");
        const go = document.getElementById("ack-go");
        document.getElementById("sub").innerHTML =
          '<span class="err">No restore point could be taken, so the upgrade did not start.</span>';
        document.getElementById("ack-report").textContent = report;
        document.getElementById("ack-note").textContent =
          "Starting anyway upgrades without a way back. The reason is recorded and " +
          "remembered for Vigil " + version + " only.";
        stepsEl.style.display = "none";
        logEl.style.display = "none";
        document.querySelector("body > .acts").style.display = "none";
        ack.style.display = "flex";
        reason.oninput = () => { go.disabled = !reason.value.trim(); };
        reason.focus();
        const leave = () => {
          ack.style.display = "none";
          stepsEl.style.display = "";
          logEl.style.display = "";
          document.getElementById("sub").textContent = "Retrying…";
        };
        go.onclick = () => { leave(); window.vigil.acknowledge(reason.value); };
        // A transient failure (a held backup lock, a database blip) needs no reason.
        document.getElementById("ack-retry").onclick = () => { leave(); window.vigil.retry(); };
        document.getElementById("ack-quit").onclick = () => window.vigil.quit();
      });
      window.vigil.onError((msg) => {
        // Text, not markup: messages carry exception and container output.
        const err = document.createElement("span");
        err.className = "err";
        err.textContent = msg;
        document.getElementById("sub").replaceChildren(err);
        const acts = document.querySelector("body > .acts");
        acts.style.display = "flex";
        document.getElementById("retry").onclick = () => {
          acts.style.display = "none";
          document.getElementById("sub").textContent = "Retrying…";
          window.vigil.retry();
        };
        // The splash is frameless and the tray may be unavailable (Linux), so
        // this is the only guaranteed way out of a failed start.
        document.getElementById("quit").onclick = () => window.vigil.quit();
      });
    </script>
  </body>
</html>
