name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Linting & Code Quality
  # ============================================================================
  lint-backend:
    name: Lint Backend
    # Canonical repo only. Forks can't run this pipeline (private submodules +
    # missing secrets) so pushes to a fork's main/develop just email the owner
    # a failure. For pull_request events github.repository is the BASE repo, so
    # contributor PRs against Vigil-SOC/vigil still run CI as normal.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install flake8 black isort mypy import-linter

      # These gate now. Advisory is how the tree drifted to 2383 flake8
      # violations and 124 unformatted files while CI stayed green, which the
      # commit below clears. setup.cfg is the one config; black needs no flags.
      - name: Run flake8
        run: uv run flake8 services/ core/

      - name: Run black
        run: uv run black --check services/ core/

      - name: Run isort
        run: uv run isort --check-only services/ core/

      # Still advisory: the annotation backlog is real work, not a formatting pass.
      - name: Run mypy
        run: uv run mypy services/ core/ --ignore-missing-imports
        continue-on-error: true

      # The layering contracts in .importlinter (epic #481). Deliberately no
      # continue-on-error: the rest of this job is advisory, this one gates.
      - name: Run import-linter
        run: uv run lint-imports

  lint-frontend:
    name: Lint Frontend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Run ESLint
        working-directory: clients/web
        run: npm run lint
        continue-on-error: true

  lint-docker:
    name: Lint Dockerfiles
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/docker/Dockerfile.backend
          ignore: DL3008,DL3009
        continue-on-error: true

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit-backend:
    name: Unit Tests - Backend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run unit tests
        run: |
          # Exclude tests needing external services (e.g. PostgreSQL) — the unit
          # job runs without them. Such tests are marked @pytest.mark.external_service.
          # This step also carries the #415 ratchets (test_no_ambient_state,
          # test_settings_env_example): no continue-on-error here, unlike the lint
          # job, so a new raw env read or env.example drift fails the pipeline.
          # tests/security/ used to run only in nightly, where its one red
          # test was mistaken for a real auth bypass; it was the fixture not
          # forcing DEV_MODE off for routers that read settings live. Fixed,
          # so all 84 gate here.
          uv run pytest tests/unit/ tests/security/ -m "not external_service" -v \
            --cov=services --cov=core --cov-report=xml --cov-report=term
        env:
          TESTING: "true"
          CLAUDE_API_KEY: ${{ secrets.CLAUDEAPI }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDEAPI }}
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: backend-unit
        continue-on-error: true

  test-unit-frontend:
    name: Unit Tests - Frontend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Run unit tests
        working-directory: clients/web
        run: npm run test:run

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: Integration Tests
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTING: "true"
      DEV_MODE: "true"
      SECRET_KEY: "test-secret-key"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deeptempo_test

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Initialize schema
        run: |
          uv run python -c "from core.storage.connection import init_database; init_database()"

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v --cov=services --cov=core --cov-report=xml
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDEAPI }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDEAPI }}

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: integration
          name: backend-integration
        continue-on-error: true

  # ============================================================================
  # DB-backed Unit Tests (require PostgreSQL)
  # ============================================================================
  test-unit-backend-db:
    name: Unit Tests - Backend (DB-backed)
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTING: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deeptempo_test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Initialize schema
        run: |
          uv run python -c "from core.storage.connection import init_database; init_database()"

      - name: Run DB-backed unit tests
        run: |
          # Complement of the no-service unit job: only @pytest.mark.external_service
          # tests, which require a real PostgreSQL.
          uv run pytest tests/unit/ -m external_service -v --no-cov

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan-python:
    name: Security Scan - Python
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Bandit
        run: |
          uv venv
          uv pip install bandit[toml]

      - name: Run Bandit
        run: uv run bandit -r core/ services/ tools/ scripts/ -f json -o bandit-report.json || true
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

  security-scan-npm:
    name: Security Scan - NPM
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        working-directory: clients/web
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # ============================================================================
  # Build Docker Images
  # ============================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, test-unit-backend, test-unit-backend-db, test-integration]
    if: false  # Disabled - enable if you need Docker images
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata (daemon)
        id: meta-daemon
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-daemon
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
      
      - name: Build and push daemon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.daemon
          push: true
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Build Frontend Assets
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    # Runs on PRs too, not just push. This is the only job that type-checks
    # (tsc); gating it to post-merge let type errors land on main. The
    # pull_request build compiles the PR merged into its base, so it also
    # catches breakage that only appears after the merge.
    if: github.repository == 'Vigil-SOC/vigil'
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Build frontend
        working-directory: clients/web
        run: npm run build
      
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: clients/web/build/
          retention-days: 7

  # ============================================================================
  # Scan Docker Images for Vulnerabilities
  # ============================================================================
  scan-images:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    needs: [build-images]
    if: false  # Disabled - enable by changing to: github.event_name == 'push'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================================================
  # Deploy to Staging (DISABLED - Only testing enabled)
  # ============================================================================
  # Uncomment when ready to deploy to VMs
  # deploy-staging:
  #   name: Deploy to Staging
  #   runs-on: ubuntu-latest
  #   needs: [build-images, build-frontend, scan-images]
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   ... (deployment steps removed for now)

