name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Linting & Code Quality
  # ============================================================================
  lint-backend:
    name: Lint Backend
    # Canonical repo only. Forks can't run this pipeline (missing secrets) so
    # pushes to a fork's main/develop just email the owner
    # a failure. For pull_request events github.repository is the BASE repo, so
    # contributor PRs against Vigil-SOC/vigil still run CI as normal.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 services/ core/

      - name: Run black
        run: black --check --extend-exclude '^/services/medic/contracts/' services/ core/

      - name: Run isort
        run: isort --check-only services/ core/

      - name: Run mypy
        run: mypy services/ core/ --ignore-missing-imports
        continue-on-error: true

      # The layering contracts in .importlinter (epic #481). No
      # continue-on-error: this gates, as flake8, black and isort now do.
      - name: Run import-linter
        run: lint-imports

      # One tool-calling loop, and it is in TypeScript (#632). Gates for the same
      # reason: each new loop looks reasonable alone, and there were five.
      - name: Run one-loop gate
        run: python scripts/check_one_loop.py

      # No comment block over two lines in the agent layer. Advisory for now: #661
      # landed 33 that predate the gate, and they are its author's to rule on.
      - name: Run comment-style gate
        run: python scripts/check_comment_style.py
        continue-on-error: true

      # The workflow files themselves. Gates, because a schema error takes the
      # whole workflow down: GitHub rejects the file before scheduling anything,
      # so the run reports zero jobs and nothing points at the cause. A local
      # YAML parse does not catch this class — an `env:` with no keys is valid
      # YAML (it reads as null) and invalid to Actions.
      #
      # What is in and out of the gate lives in .github/actionlint.yaml, rather
      # than as -ignore flags here: quoting inside a docker:// action's `args`
      # is unreliable, and a silently-mis-parsed regex would turn this step into
      # a no-op that still reports green.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  lint-frontend:
    name: Lint Frontend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Run ESLint
        working-directory: clients/web
        run: npm run lint
        continue-on-error: true

  # Regenerating the committed OpenAPI types must be a no-op. The spec is
  # dumped from app.openapi() (no running server); unannotated routes staying
  # empty in the output is expected.
  check-generated-api-types:
    name: Generated API Types
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: clients/web
        run: npm ci

      - name: Regenerate OpenAPI types
        run: python scripts/generate_frontend_types.py

      - name: Types match the spec
        run: |
          git add -A -- clients/web/src/services/generated
          git diff --cached --exit-code -- clients/web/src/services/generated

  lint-docker:
    name: Lint Dockerfiles
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.backend
          ignore: DL3008,DL3009
        continue-on-error: true

      # Not continue-on-error, and no ignores: the agent image is clean today
      # (#635) and installs no apt packages, so the two rules waived above have
      # nothing to say about it. Advisory here would only let it rot.
      - name: Run hadolint (agent)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.agent

  # ============================================================================
  # Agent Image — build, scan, smoke test
  # ============================================================================
  # Builds locally and throws the image away, so it can run on every PR
  # and answer the three questions #635 asks of the image: does it build, is it
  # clean, does it start.
  build-agent-image:
    name: Agent Image
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: false
          load: true            # into the runner's docker, for the steps below
          tags: vigil-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-agent:ci
          format: table
          severity: HIGH,CRITICAL

      # The gate is narrower than the report on purpose. An unfixed CVE in the
      # base image is not something this repo can act on, and failing every PR
      # on one teaches people to ignore the job.
      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-agent:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Loads both entry points without running either: the main blocks guard on
      # process.argv[1], which --eval leaves undefined. That is the whole point --
      # it proves every import resolves inside the image (the failure mode that
      # typecheck cannot see, since tsc reads .ts and node runs the emitted .js)
      # without needing a Postgres or a Redis to connect to. It also checks every
      # registered arch file shipped, since tsc emits none of the YAML.
      - name: Smoke test — entry points load and plugin files ship
        run: |
          docker run --rm vigil-agent:ci \
            node --input-type=module -e "
              await import('/app/dist/worker.js');
              await import('/app/dist/serve.js');
              const { existsSync } = await import('node:fs');
              const { archFor, registeredKinds } = await import('/app/dist/plugins/kinds.js');
              const missing = registeredKinds().map((k) => archFor(k).arch).filter((p) => !existsSync(p));
              if (missing.length) throw new Error('plugin files missing from image: ' + missing.join(', '));
              console.log('agent ok');
            "

  # ============================================================================
  # Backend, daemon and MCP runner images — build and scan (#2585)
  # ============================================================================
  # Same gate as the agent image: built locally, never pushed, fail on a
  # fixable CRITICAL. Waivers live in .trivyignore, each with its reason; one
  # cache scope per image so the jobs do not evict each other's layers.
  build-backend-image:
    name: Backend Image
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the Python pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          load: true
          tags: vigil-backend:ci
          build-args: |
            PYTHON_VERSION=${{ steps.pin.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Trivy — report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-backend:ci
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  build-daemon-image:
    name: Daemon Image
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the Python pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build daemon image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.daemon
          push: false
          load: true
          tags: vigil-daemon:ci
          build-args: |
            PYTHON_VERSION=${{ steps.pin.outputs.version }}
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,scope=daemon,mode=max

      - name: Trivy — report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-daemon:ci
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-daemon:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  build-mcp-runner-image:
    name: MCP Runner Image
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read the Python pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build mcp-runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.mcp-runner
          push: false
          load: true
          tags: vigil-mcp-runner:ci
          build-args: |
            PYTHON_VERSION=${{ steps.pin.outputs.version }}
          cache-from: type=gha,scope=mcp-runner
          cache-to: type=gha,scope=mcp-runner,mode=max

      - name: Trivy — report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-mcp-runner:ci
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vigil-mcp-runner:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  # ============================================================================
  # Setup path — does ./start.sh produce the pinned interpreter on each OS?
  # ============================================================================
  # Every other job installs dependencies with setup-python + pip, so none of
  # them exercise scripts/lib.sh, the thing that installs Vigil. This job runs
  # the real setup phase and asserts what it built.
  #
  # Deliberately no `pip install` and no setup-python step. The runners ship
  # their own Pythons, and proving those are ignored is the point.
  test-setup-matrix:
    name: Setup Path (${{ matrix.os }})
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # Add a row to cover another platform — `arch` is the architecture the
        # provisioned interpreter is expected to report, and is asserted below.
        # Candidates when they're worth the minutes:
        #   - { os: macos-13,         arch: x86_64  }   # Intel macOS
        #   - { os: ubuntu-24.04-arm, arch: aarch64 }   # arm64 Linux
        #   - { os: ubuntu-22.04,     arch: x86_64  }   # older glibc
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: macos-latest,  arch: arm64  }
    steps:
      - uses: actions/checkout@v7

      - name: Show the host Python that must NOT be used
        run: |
          echo "python3 on PATH: $(command -v python3 || echo none)"
          python3 -c 'import platform,sys; print(sys.version.split()[0], platform.machine())' || true
          echo "uv on PATH:      $(command -v uv || echo none)"

      - name: Run the setup phase
        run: |
          set -euo pipefail
          source scripts/lib.sh
          ensure_venv
          install_python_deps

      - name: Assert the provisioned interpreter
        run: |
          set -euo pipefail
          want_version=$(tr -d '[:space:]' < .python-version)
          want_arch='${{ matrix.arch }}'
          read -r got_version got_arch < <(
            ./venv/bin/python -c 'import platform,sys; print(".".join(map(str,sys.version_info[:2])), platform.machine())'
          )
          echo "want ${want_version}/${want_arch} — got ${got_version}/${got_arch}"
          [ "$got_version" = "$want_version" ] || { echo "::error::wrong Python version"; exit 1; }
          [ "$got_arch" = "$want_arch" ]       || { echo "::error::wrong architecture"; exit 1; }

      - name: Assert the interpreter came from uv, not the host
        run: |
          set -euo pipefail
          # pyvenv.cfg records the interpreter the venv was built from. A path
          # outside uv's managed directory means PATH discovery crept back in.
          home=$(awk -F'= *' '/^home/ {print $2}' venv/pyvenv.cfg)
          echo "venv built from: $home"
          case "$home" in
            *"/uv/python/"*) echo "uv-managed, as intended" ;;
            *) echo "::error::venv was built from a non-managed interpreter: $home"; exit 1 ;;
          esac

      - name: Re-run setup (must be idempotent, must not rebuild)
        run: |
          set -euo pipefail
          before=$(./venv/bin/python -c 'import sys; print(sys.prefix)')
          stamp_before=$(ls -ld venv | awk '{print $6, $7, $8}')
          source scripts/lib.sh
          ensure_venv
          install_python_deps
          stamp_after=$(ls -ld venv | awk '{print $6, $7, $8}')
          after=$(./venv/bin/python -c 'import sys; print(sys.prefix)')
          [ "$before" = "$after" ] || { echo "::error::prefix changed on re-run"; exit 1; }
          [ "$stamp_before" = "$stamp_after" ] || echo "::warning::venv was recreated on an unchanged re-run"

      - name: Smoke-test the result
        run: ./venv/bin/python -c 'import sqlalchemy, fastapi, uvicorn, arq, redis, anthropic; print("imports ok")'

  # The agent layer is a second Node package with its own manifest. Node 22
  # rather than NODE_VERSION: the eval's estate (eval/estate.ts) runs SQL on
  # node:sqlite.
  typecheck-agent-layer:
    name: Typecheck - Agent Layer
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install dependencies
        working-directory: services/agent
        run: npm ci

      - name: Typecheck
        working-directory: services/agent
        run: npm run typecheck

  # ============================================================================
  # Helm Install Schema — does a fresh chart install end with every ORM table?
  # ============================================================================
  # A Helm install's post-install Job is the only schema writer:
  # helm_upgrade.py install runs python -m core.upgrade as the owner, then sets
  # vigil_app's password. The backend starts as vigil_app and only checks that
  # the database is at its head. This job renders that Job and runs the same
  # upgrade from this checkout against the chart's Postgres.
  test-helm-install-schema:
    name: Helm Install Schema
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        # As the chart's own Postgres runs: its image, database and user, which
        # the image makes the superuser, as it does in the StatefulSet.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_soc
          POSTGRES_USER: deeptempo
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: deeptempo_soc
      POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.2

      - name: Render the install Job
        run: |
          # The Job uses none of the subcharts, and all are off by default, so a
          # copy of the chart without them renders without fetching them.
          cp -R infra/helm/vigil "$RUNNER_TEMP/chart"
          rm -rf "$RUNNER_TEMP/chart/charts" "$RUNNER_TEMP/chart/medic-tests"
          rm -f "$RUNNER_TEMP/chart/Chart.lock"
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          chart = Path(os.environ["RUNNER_TEMP"]) / "chart" / "Chart.yaml"
          meta = yaml.safe_load(chart.read_text())
          meta.pop("dependencies", None)
          chart.write_text(yaml.safe_dump(meta))
          Path(os.environ["RUNNER_TEMP"], "app-version").write_text(
              str(meta["appVersion"]).strip() + "\n"
          )
          PY
          # --set splits on commas, so the reason has none.
          helm template ci "$RUNNER_TEMP/chart" \
            --set secrets.postgresPassword=test \
            --set secrets.vigilAppPassword=vigil-app-test \
            --set upgrade.acknowledgeVersion="$(tr -d '[:space:]' < "$RUNNER_TEMP/app-version")" \
            --set upgrade.acknowledgeReason=CI-fresh-install \
            --show-only templates/upgrade.yaml > "$RUNNER_TEMP/upgrade.yaml"

      - name: Run the install hook as the chart user
        # The rendered command is `python /opt/vigil-upgrade/helm_upgrade.py
        # install` in the backend image. That image is this checkout, so the
        # runner executes the same script against the chart's Postgres.
        env:
          POSTGRES_USER: deeptempo
          POSTGRES_APP_PASSWORD: vigil-app-test
          VIGIL_UPGRADE_ACK_REASON: CI-fresh-install
          VIGIL_UPGRADE_DIR: ${{ runner.temp }}/vigil-upgrade
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          export VIGIL_UPGRADE_ACK_VERSION="$version"
          export VIGIL_CHART_APP_VERSION="$version"
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          version = Path("VERSION").read_text().strip()
          docs = [
              d
              for d in yaml.safe_load_all(
                  Path(os.environ["RUNNER_TEMP"], "upgrade.yaml").read_text()
              )
              if d
          ]
          jobs = [
              d
              for d in docs
              if d.get("kind") == "Job" and d["metadata"]["name"].endswith("-install")
          ]
          if len(jobs) != 1:
              print(f"::error::expected one install Job, found {len(jobs)}")
              raise SystemExit(1)
          job = jobs[0]
          notes = job["metadata"]["annotations"]
          if notes.get("helm.sh/hook") != "post-install":
              print(f"::error::install Job hook is {notes.get('helm.sh/hook')!r}")
              raise SystemExit(1)
          container = job["spec"]["template"]["spec"]["containers"][0]
          if container["command"] != [
              "python",
              "/opt/vigil-upgrade/helm_upgrade.py",
              "install",
          ]:
              print(f"::error::install command is {container['command']!r}")
              raise SystemExit(1)
          env = {item["name"]: item for item in container["env"]}
          if env["POSTGRES_USER"].get("value") != "deeptempo":
              print("::error::install Job does not log in as the database owner")
              raise SystemExit(1)
          for key in ("POSTGRES_PASSWORD", "POSTGRES_APP_PASSWORD"):
              if "secretKeyRef" not in env[key].get("valueFrom", {}):
                  print(f"::error::install Job has no secret for {key}")
                  raise SystemExit(1)
          if env["VIGIL_CHART_APP_VERSION"].get("value") != version:
              print(
                  "::error::chart appVersion "
                  f"{env['VIGIL_CHART_APP_VERSION'].get('value')!r} is not VERSION {version}"
              )
              raise SystemExit(1)
          if env["VIGIL_UPGRADE_ACK_VERSION"].get("value") != version:
              print("::error::install acknowledgement is not this release")
              raise SystemExit(1)
          if not str(env["VIGIL_UPGRADE_ACK_REASON"].get("value", "")).strip():
              print("::error::install acknowledgement reason is empty")
              raise SystemExit(1)
          PY
          mkdir -p "$VIGIL_UPGRADE_DIR"
          python infra/helm/vigil/files/upgrade/helm_upgrade.py install

      - name: Initialize schema as vigil_app
        id: init-schema
        # What the backend does on a Helm install: log in as vigil_app and
        # require this image's head. create_tables is the grant check — the
        # upgrade already built the tables, and vigil_app holds no CREATE on
        # the owner's. A missing table fails here.
        env:
          POSTGRES_USER: vigil_app
          POSTGRES_PASSWORD: vigil-app-test
          DB_STRICT_SCHEMA: "true"
        run: |
          python - <<'PY'
          from core.storage.connection import (
              check_schema_drift,
              get_db_manager,
              init_database,
          )

          manager = get_db_manager()
          manager.initialize()
          manager.create_tables()
          check_schema_drift(manager, provisioned=True)
          init_database()
          PY

      - name: Every ORM table exists
        # Also after a failed create_all, to name the tables it left out.
        if: ${{ !cancelled() && steps.init-schema.outcome != 'skipped' }}
        env:
          POSTGRES_USER: vigil_app
          POSTGRES_PASSWORD: vigil-app-test
        run: |
          python - <<'PY'
          from sqlalchemy import inspect

          from core.storage.connection import get_db_manager
          from core.storage.models import Base

          manager = get_db_manager()
          manager.initialize()
          expected = set(Base.metadata.tables)
          missing = sorted(expected - set(inspect(manager.engine).get_table_names()))
          print(f"{len(expected) - len(missing)} of {len(expected)} ORM tables exist")
          if missing:
              print(f"::error::Missing after a Helm install: {', '.join(missing)}")
              raise SystemExit(1)
          PY

      - name: Default rows are seeded
        # The upgrade baseline writes the default SLA policies and case
        # templates (#1246); only a count shows an install left without them.
        # The expected count is one row per INSERT in the seed file, so a
        # multi-row VALUES default would need this to count rows instead.
        env:
          POSTGRES_USER: vigil_app
          POSTGRES_PASSWORD: vigil-app-test
        run: |
          python - <<'PY'
          from sqlalchemy import text

          from core.storage.connection import get_db_manager
          from core.storage.reference_seed import SEED_FILE, find_seed_file, inserts_by_table

          path = find_seed_file()
          if path is None:
              print(f"::error::{SEED_FILE} not found; the backend seeds nothing without it")
              raise SystemExit(1)
          expected = {t: len(s) for t, s in inserts_by_table(path.read_text()).items()}
          if not expected:
              print(f"::error::No INSERT found in {SEED_FILE}; this check needs updating")
              raise SystemExit(1)

          manager = get_db_manager()
          manager.initialize()
          short = []
          with manager.engine.connect() as conn:
              quote = conn.dialect.identifier_preparer.quote
              for table, want in sorted(expected.items()):
                  got = conn.execute(text(f"SELECT count(*) FROM {quote(table)}")).scalar()
                  print(f"{table}: {got} of {want} default rows")
                  if got != want:
                      short.append(f"{table} has {got}, expected {want}")
          if short:
              print(f"::error::Default rows after a Helm install: {'; '.join(short)}")
              raise SystemExit(1)
          PY

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan-python:
    name: Security Scan - Python
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      # Gate: medium-or-higher severity and confidence. A justified exception is
      # a `# nosec Bxxx - <reason>` at the call site.
      - name: Run Bandit
        run: bandit -r core/ services/ tools/ scripts/ -ll -ii

      - name: Write Bandit report
        if: always()
        run: bandit -r core/ services/ tools/ scripts/ -ll -ii -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  security-scan-npm:
    name: Security Scan - NPM
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # --omit=dev audits what ships. clients/web's remaining highs are the
      # braces chain under tailwindcss (build-time only; the fix is a breaking
      # tailwind 4 upgrade).
      # The registry sometimes returns 503 or 400 after npm's own retries
      # (run 39713754392 on services/agent; the same step on main). That is
      # not a finding. One more attempt; a high-or-worse report still fails.
      - name: Run npm audit
        run: |
          status=0
          for dir in clients/web services/agent clients/desktop; do
            echo "::group::npm audit ($dir)"
            log="$(mktemp)"
            set +e
            (cd "$dir" && npm audit --omit=dev --audit-level=high) >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$rc" -ne 0 ] && grep -q "audit endpoint returned an error" "$log"; then
              echo "npm audit registry error in $dir; retrying once"
              sleep 20
              (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            elif [ "$rc" -ne 0 ]; then
              status=1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
          exit $status

  # ============================================================================
  # Build Frontend Assets
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    # Runs on PRs too, not just push. This is the only job that type-checks
    # (tsc); gating it to post-merge let type errors land on main. The
    # pull_request build compiles the PR merged into its base, so it also
    # catches breakage that only appears after the merge.
    if: github.repository == 'Vigil-SOC/vigil'
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Build frontend
        working-directory: clients/web
        run: npm run build
      
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: clients/web/build/
          retention-days: 7
