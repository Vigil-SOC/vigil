name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Linting & Code Quality
  # ============================================================================
  lint-backend:
    name: Lint Backend
    # Canonical repo only. Forks can't run this pipeline (missing secrets) so
    # pushes to a fork's main/develop just email the owner
    # a failure. For pull_request events github.repository is the BASE repo, so
    # contributor PRs against Vigil-SOC/vigil still run CI as normal.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 services/ core/

      - name: Run black
        run: black --check services/ core/

      - name: Run isort
        run: isort --check-only services/ core/

      - name: Run mypy
        run: mypy services/ core/ --ignore-missing-imports
        continue-on-error: true

      # The layering contracts in .importlinter (epic #481). No
      # continue-on-error: this gates, as flake8, black and isort now do.
      - name: Run import-linter
        run: lint-imports

      # One tool-calling loop, and it is in TypeScript (#632). Gates for the same
      # reason: each new loop looks reasonable alone, and there were five.
      - name: Run one-loop gate
        run: python scripts/check_one_loop.py

      # No comment block over two lines in the agent layer. Advisory for now: #661
      # landed 33 that predate the gate, and they are its author's to rule on.
      - name: Run comment-style gate
        run: python scripts/check_comment_style.py
        continue-on-error: true

      # The workflow files themselves. Gates, because a schema error takes the
      # whole workflow down: GitHub rejects the file before scheduling anything,
      # so the run reports zero jobs and nothing points at the cause. A local
      # YAML parse does not catch this class — an `env:` with no keys is valid
      # YAML (it reads as null) and invalid to Actions.
      #
      # What is in and out of the gate lives in .github/actionlint.yaml, rather
      # than as -ignore flags here: quoting inside a docker:// action's `args`
      # is unreliable, and a silently-mis-parsed regex would turn this step into
      # a no-op that still reports green.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  lint-frontend:
    name: Lint Frontend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Run ESLint
        working-directory: clients/web
        run: npm run lint
        continue-on-error: true

  # Regenerating the committed OpenAPI types must be a no-op. The spec is
  # dumped from app.openapi() (no running server); unannotated routes staying
  # empty in the output is expected.
  check-generated-api-types:
    name: Generated API Types
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: clients/web
        run: npm ci

      - name: Regenerate OpenAPI types
        run: python scripts/generate_frontend_types.py

      - name: Types match the spec
        run: |
          git add -A -- clients/web/src/services/generated
          git diff --cached --exit-code -- clients/web/src/services/generated

  lint-docker:
    name: Lint Dockerfiles
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.backend
          ignore: DL3008,DL3009
        continue-on-error: true

      # Not continue-on-error, and no ignores: the agent image is clean today
      # (#635) and installs no apt packages, so the two rules waived above have
      # nothing to say about it. Advisory here would only let it rot.
      - name: Run hadolint (agent)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.agent

  # ============================================================================
  # Agent Image — build, scan, smoke test
  # ============================================================================
  # Separate from build-images below, which pushes to a registry and is disabled.
  # This one builds locally and throws the image away, so it can run on every PR
  # and answer the three questions #635 asks of the image: does it build, is it
  # clean, does it start.
  build-agent-image:
    name: Agent Image
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: false
          load: true            # into the runner's docker, for the steps below
          tags: vigil-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vigil-agent:ci
          format: table
          severity: HIGH,CRITICAL

      # The gate is narrower than the report on purpose. An unfixed CVE in the
      # base image is not something this repo can act on, and failing every PR
      # on one teaches people to ignore the job.
      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vigil-agent:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Loads both entry points without running either: the main blocks guard on
      # process.argv[1], which --eval leaves undefined. That is the whole point --
      # it proves every import resolves inside the image (the failure mode that
      # typecheck cannot see, since tsc reads .ts and node runs the emitted .js)
      # without needing a Postgres or a Redis to connect to. It also checks every
      # registered arch file shipped, since tsc emits none of the YAML.
      - name: Smoke test — entry points load and arch files ship
        run: |
          docker run --rm vigil-agent:ci \
            node --input-type=module -e "
              await import('/app/dist/worker.js');
              await import('/app/dist/serve.js');
              const { existsSync } = await import('node:fs');
              const { archFor, registeredKinds } = await import('/app/dist/arch/registry.js');
              const missing = registeredKinds().map((k) => archFor(k).arch).filter((p) => !existsSync(p));
              if (missing.length) throw new Error('arch files missing from image: ' + missing.join(', '));
              console.log('agent ok');
            "

  # ============================================================================
  # Unit Tests
  # ============================================================================
  # ============================================================================
  # Setup path — does ./start.sh produce the pinned interpreter on each OS?
  # ============================================================================
  # Every other job installs dependencies with setup-python + pip, so none of
  # them exercise scripts/lib.sh: the code gets tested, the thing that installs
  # it does not. This job runs the real setup phase and asserts what it built.
  #
  # Deliberately no `pip install` and no setup-python step. The runners ship
  # their own Pythons, and proving those are ignored is the point.
  test-setup-matrix:
    name: Setup Path (${{ matrix.os }})
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # Add a row to cover another platform — `arch` is the architecture the
        # provisioned interpreter is expected to report, and is asserted below.
        # Candidates when they're worth the minutes:
        #   - { os: macos-13,         arch: x86_64  }   # Intel macOS
        #   - { os: ubuntu-24.04-arm, arch: aarch64 }   # arm64 Linux
        #   - { os: ubuntu-22.04,     arch: x86_64  }   # older glibc
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: macos-latest,  arch: arm64  }
    steps:
      - uses: actions/checkout@v7

      - name: Show the host Python that must NOT be used
        run: |
          echo "python3 on PATH: $(command -v python3 || echo none)"
          python3 -c 'import platform,sys; print(sys.version.split()[0], platform.machine())' || true
          echo "uv on PATH:      $(command -v uv || echo none)"

      - name: Run the setup phase
        run: |
          set -euo pipefail
          source scripts/lib.sh
          ensure_venv
          install_python_deps

      - name: Assert the provisioned interpreter
        run: |
          set -euo pipefail
          want_version=$(tr -d '[:space:]' < .python-version)
          want_arch='${{ matrix.arch }}'
          read -r got_version got_arch < <(
            ./venv/bin/python -c 'import platform,sys; print(".".join(map(str,sys.version_info[:2])), platform.machine())'
          )
          echo "want ${want_version}/${want_arch} — got ${got_version}/${got_arch}"
          [ "$got_version" = "$want_version" ] || { echo "::error::wrong Python version"; exit 1; }
          [ "$got_arch" = "$want_arch" ]       || { echo "::error::wrong architecture"; exit 1; }

      - name: Assert the interpreter came from uv, not the host
        run: |
          set -euo pipefail
          # pyvenv.cfg records the interpreter the venv was built from. A path
          # outside uv's managed directory means PATH discovery crept back in.
          home=$(awk -F'= *' '/^home/ {print $2}' venv/pyvenv.cfg)
          echo "venv built from: $home"
          case "$home" in
            *"/uv/python/"*) echo "uv-managed, as intended" ;;
            *) echo "::error::venv was built from a non-managed interpreter: $home"; exit 1 ;;
          esac

      - name: Re-run setup (must be idempotent, must not rebuild)
        run: |
          set -euo pipefail
          before=$(./venv/bin/python -c 'import sys; print(sys.prefix)')
          stamp_before=$(ls -ld venv | awk '{print $6, $7, $8}')
          source scripts/lib.sh
          ensure_venv
          install_python_deps
          stamp_after=$(ls -ld venv | awk '{print $6, $7, $8}')
          after=$(./venv/bin/python -c 'import sys; print(sys.prefix)')
          [ "$before" = "$after" ] || { echo "::error::prefix changed on re-run"; exit 1; }
          [ "$stamp_before" = "$stamp_after" ] || echo "::warning::venv was recreated on an unchanged re-run"

      - name: Smoke-test the result
        run: ./venv/bin/python -c 'import sqlalchemy, fastapi, uvicorn, arq, redis, anthropic; print("imports ok")'

  test-unit-backend:
    name: Unit Tests - Backend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      
      - name: Run unit tests
        run: |
          # Exclude tests needing external services (e.g. PostgreSQL) — the unit
          # job runs without them. Such tests are marked @pytest.mark.external_service.
          # This step also carries the #415 ratchets (test_no_ambient_state,
          # test_settings_env_example): no continue-on-error here, unlike the lint
          # job, so a new raw env read or env.example drift fails the pipeline.
          # tests/security/ used to run only in nightly, where its one red
          # test was mistaken for a real auth bypass; it was the fixture not
          # forcing DEV_MODE off for routers that read settings live. Fixed,
          # so all 84 gate here.
          pytest tests/unit/ tests/security/ -m "not external_service" -v \
            --cov=services --cov=core --cov-report=xml --cov-report=term
        env:
          TESTING: "true"
          CLAUDE_API_KEY: ${{ secrets.CLAUDEAPI }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDEAPI }}
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: backend-unit
        continue-on-error: true

  test-unit-frontend:
    name: Unit Tests - Frontend
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Run unit tests
        working-directory: clients/web
        run: npm run test:run

  # The agent layer is a second Node package with its own manifest, so it needs
  # its own job -- the frontend job above is scoped to frontend/. Node 20 rather
  # than NODE_VERSION because services/agent/package.json requires it.
  test-agent-layer:
    name: Unit Tests - Agent Layer
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      AGENT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/agent_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install dependencies
        working-directory: services/agent
        run: npm ci

      # Goldens are the output of the implementation being replaced, at a commit
      # that is not an ancestor of main and is absent from a depth-1 checkout.
      # Pin that SHA. Do not follow the threat-hunt branch tip, and do not
      # vendor its ai/ tree into this checkout. The generator loads that tree
      # by path; its modules need yaml, which this job already installed.
      # Run from the repo root: git archive pathspecs are relative to the cwd,
      # and `ai/` exists only at the root of that commit.
      - name: Check fold goldens against the original implementation
        env:
          FOLD_GOLDEN_SOURCE: 2051232ab97e95da8f081a616a843977db937abd
        run: |
          root="$(mktemp -d)"
          git fetch --depth 1 origin "$FOLD_GOLDEN_SOURCE"
          git archive "$FOLD_GOLDEN_SOURCE" ai | tar -x -C "$root"
          mkdir -p "$root/node_modules"
          ln -s "$PWD/services/agent/node_modules/yaml" "$root/node_modules/yaml"
          ./services/agent/node_modules/.bin/tsx services/agent/scripts/generate-fold-goldens.ts \
            --original "$root" \
            --ledgers services/agent/tests/fixtures/runs \
            --check services/agent/tests/fixtures/runs

      - name: Apply agent-layer schema
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d agent_test \
            -f infra/database/init/19_agent_ledger.sql \
            -f infra/database/init/31_agent_ledger_hash_chain.sql \
            -f infra/database/init/20_agent_directives.sql \
            -f infra/database/init/21_agent_run_leases.sql

      - name: Typecheck
        working-directory: services/agent
        run: npm run typecheck

      - name: Run unit tests
        working-directory: services/agent
        run: npm test

  # ============================================================================
  # Column snapshot must not change inside a patch release
  # ============================================================================
  # A PR that only updates the snapshot (VERSION untouched) stays green. The
  # release PR is what fails: VERSION moved, major.minor did not, and the
  # snapshot differs from the previous v* tag.
  schema-snapshot-patch-gate:
    name: Schema Snapshot Patch Gate
    if: github.repository == 'Vigil-SOC/vigil' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Default checkout is depth 1 and does not fetch tags, so
          # `git show v0.6.0:<snapshot>` cannot resolve the tag. Full history
          # makes the three-dot VERSION diff against the PR base work; tags
          # are fetched explicitly below.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch release tags
        # An unknown tag fails the gate. A tag that resolves but whose tree
        # has no snapshot file is the bootstrap pass. Fetching is what makes
        # those two outcomes different; a shallow clone reports both as an
        # unknown object.
        run: git fetch --force --tags origin

      - name: Fail a patch release that changes the column snapshot
        env:
          SCHEMA_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_schema_snapshot_patch.py

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: Integration Tests
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # The walking-skeleton test enqueues onto BullMQ and spawns the TypeScript
      # worker, so this job needs Redis and Node as well as Postgres.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      TESTING: "true"
      # Auth on, as a fresh install runs; tests/conftest.py supplies the JWT secret.
      DEV_MODE: "false"
      SECRET_KEY: "test-secret-key"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deeptempo_test
      DATABASE_URL: postgresql://test:test@localhost:5432/deeptempo_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install agent-layer dependencies
        working-directory: services/agent
        run: npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Initialize schema
        # Strict here, and only here: CI provisions from empty, so a schema that
        # cannot serve the models at this point is a provisioning bug rather
        # than a stale deployment (#562). Scoped to the step rather than the job
        # so it does not change how every test in the job behaves.
        env:
          DB_STRICT_SCHEMA: "true"
        run: |
          python -c "from core.storage.connection import init_database; init_database()"

      # The agent layer's tables are raw SQL with no ORM model, deliberately:
      # Python makes two reads against the ledger and a model invites writes.
      # init_database() builds from the models, so it creates none of them.
      - name: Apply agent-layer schema
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -f infra/database/init/19_agent_ledger.sql \
            -f infra/database/init/31_agent_ledger_hash_chain.sql \
            -f infra/database/init/20_agent_directives.sql \
            -f infra/database/init/21_agent_run_leases.sql

      - name: Install restic and pg_dump
        # backup create shells out to both. pg_dump's major must be at least the
        # server's (16). restic is pinned.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl bzip2 ca-certificates
          pg_major() {
            pg_dump --version | sed -n 's/.*PostgreSQL) \([0-9][0-9]*\).*/\1/p'
          }
          need_client=0
          if ! command -v pg_dump >/dev/null 2>&1; then
            need_client=1
          else
            major="$(pg_major)"
            if [ -z "$major" ] || [ "$major" -lt 16 ]; then
              need_client=1
            fi
          fi
          if [ "$need_client" -eq 1 ]; then
            sudo apt-get install -y gnupg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
            . /etc/os-release
            echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          if [ -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
            export PATH="/usr/lib/postgresql/16/bin:${PATH}"
          fi
          major="$(pg_major)"
          if [ -z "$major" ] || [ "$major" -lt 16 ]; then
            echo "pg_dump $(pg_dump --version) is older than server 16" >&2
            exit 1
          fi
          version=0.19.1
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c ;;
            aarch64) arch=arm64; sha=a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${version}/restic_${version}_linux_${arch}.bz2"
          echo "${sha}  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 -f /tmp/restic.bz2
          sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          restic version
          pg_dump --version

      # restic talks to S3 with the process AWS credentials. The image's default
      # command is not `server`, so name it. minio/minio left Docker Hub; this
      # tag is a community build of the same server.
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker rm -f vigil-minio >/dev/null 2>&1 || true
          docker run -d --name vigil-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=vigilbackup \
            -e MINIO_ROOT_PASSWORD=vigilbackupsecret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z \
            server /data
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs vigil-minio >&2 || true
            echo "MinIO did not answer on port 9000" >&2
            exit 1
          fi
          docker exec vigil-minio \
            mc alias set local http://127.0.0.1:9000 vigilbackup vigilbackupsecret
          docker exec vigil-minio mc mb --ignore-existing local/vigil-backup

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=services --cov=core --cov-report=xml
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDEAPI }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDEAPI }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: integration
          name: backend-integration
        continue-on-error: true

  # ============================================================================
  # DB-backed Unit Tests (require PostgreSQL)
  # ============================================================================
  test-unit-backend-db:
    name: Unit Tests - Backend (DB-backed)
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TESTING: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deeptempo_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Initialize schema
        # Strict here, and only here: CI provisions from empty, so a schema that
        # cannot serve the models at this point is a provisioning bug rather
        # than a stale deployment (#562). Scoped to the step rather than the job
        # so it does not change how every test in the job behaves.
        env:
          DB_STRICT_SCHEMA: "true"
        run: |
          python -c "from core.storage.connection import init_database; init_database()"

      - name: Run DB-backed unit tests
        run: |
          # Complement of the no-service unit job: only @pytest.mark.external_service
          # tests, which require a real PostgreSQL.
          pytest tests/unit/ -m external_service -v --no-cov

  # ============================================================================
  # Helm Install Schema — does a fresh chart install end with every ORM table?
  # ============================================================================
  # The jobs above run init_database() as the database owner before any init
  # SQL, so they cannot see what a Helm install does. There the db-init Job
  # applies dbInit.sqlFiles as the chart user first, and the backend then runs
  # create_all as vigil_app, which holds no REFERENCES on the chart user's
  # tables. A new ORM table with a foreign key to one of them must therefore be
  # created by a listed SQL file; if it is not, create_all fails, and since it is
  # one transaction every table it was creating goes with it. 0.6.0 shipped that
  # way: mcp_credentials was left out, and 29 of 52 tables with it. This job
  # provisions in that order, as those roles, from the chart's own Job.
  test-helm-install-schema:
    name: Helm Install Schema
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        # As the chart's own Postgres runs: its image, database and user, which
        # the image makes the superuser, as it does in the StatefulSet.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_soc
          POSTGRES_USER: deeptempo
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: deeptempo_soc
      POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.2

      - name: Render the db-init Job
        run: |
          # The Job uses none of the subcharts, and all are off by default, so a
          # copy of the chart without them renders without fetching them.
          cp -R infra/helm/vigil "$RUNNER_TEMP/chart"
          yq -i 'del(.dependencies)' "$RUNNER_TEMP/chart/Chart.yaml"
          helm template ci "$RUNNER_TEMP/chart" \
            --show-only templates/db-init-job.yaml > "$RUNNER_TEMP/db-init-job.yaml"

      - name: Run the db-init Job as the chart user
        env:
          # The service answers to its id on the job network, as the chart's
          # Postgres Service answers to its name in the cluster.
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          # The Job's image and command, run as its pod runs them: uid 70, a
          # read-only root filesystem, and the chart's SQL bundle at /sql.
          job="$RUNNER_TEMP/db-init-job.yaml"
          container='.spec.template.spec.containers[] | select(.name == "db-init")'
          readarray -d '' command < <(yq -0 "$container | .command[]" "$job")
          docker run --rm --network "$NETWORK" --user 70:70 --read-only \
            -v "$PWD/infra/helm/vigil/files/database-init:/sql:ro" \
            -e PGHOST=postgres -e PGPORT=5432 -e PGDATABASE="$POSTGRES_DB" \
            -e PGUSER=deeptempo -e PGPASSWORD="$POSTGRES_PASSWORD" \
            "$(yq "$container | .image" "$job")" "${command[@]}"

      - name: Initialize schema as vigil_app
        id: init-schema
        # As the backend starts under the chart: _env.tpl logs it in as
        # vigil_app, and services/api/main.py calls init_database() at startup.
        # Strict for the reason the jobs above are (#562), and it covers what
        # theirs cannot: here about half the ORM tables come from init SQL, as on
        # a real install, so a table whose SQL disagrees with its model is drift.
        env:
          POSTGRES_USER: vigil_app
          DB_STRICT_SCHEMA: "true"
        run: |
          python -c "from core.storage.connection import init_database; init_database()"

      - name: Every ORM table exists
        # Also after a failed create_all, to name the tables it left out.
        if: ${{ !cancelled() && steps.init-schema.outcome != 'skipped' }}
        env:
          POSTGRES_USER: vigil_app
        run: |
          python - <<'PY'
          from sqlalchemy import inspect

          from core.storage.connection import get_db_manager
          from core.storage.models import Base

          manager = get_db_manager()
          manager.initialize()
          expected = set(Base.metadata.tables)
          missing = sorted(expected - set(inspect(manager.engine).get_table_names()))
          print(f"{len(expected) - len(missing)} of {len(expected)} ORM tables exist")
          if missing:
              print(f"::error::Missing after a Helm install: {', '.join(missing)}")
              raise SystemExit(1)
          PY

      - name: Default rows are seeded
        # init_database() seeds the default SLA policies and case templates into
        # empty tables after create_all (#1246), and logs rather than fails when
        # it cannot, so only a count shows an install left without them. The
        # expected count is one row per INSERT the backend's seeder finds, so a
        # multi-row VALUES default would need this to count rows instead.
        env:
          POSTGRES_USER: vigil_app
        run: |
          python - <<'PY'
          from sqlalchemy import text

          from core.storage.connection import get_db_manager
          from core.storage.reference_seed import SEED_FILE, find_seed_file, inserts_by_table

          path = find_seed_file()
          if path is None:
              print(f"::error::{SEED_FILE} not found; the backend seeds nothing without it")
              raise SystemExit(1)
          expected = {t: len(s) for t, s in inserts_by_table(path.read_text()).items()}
          if not expected:
              print(f"::error::No INSERT found in {SEED_FILE}; this check needs updating")
              raise SystemExit(1)

          manager = get_db_manager()
          manager.initialize()
          short = []
          with manager.engine.connect() as conn:
              quote = conn.dialect.identifier_preparer.quote
              for table, want in sorted(expected.items()):
                  got = conn.execute(text(f"SELECT count(*) FROM {quote(table)}")).scalar()
                  print(f"{table}: {got} of {want} default rows")
                  if got != want:
                      short.append(f"{table} has {got}, expected {want}")
          if short:
              print(f"::error::Default rows after a Helm install: {'; '.join(short)}")
              raise SystemExit(1)
          PY

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan-python:
    name: Security Scan - Python
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      # Gate: medium-or-higher severity and confidence. A justified exception is
      # a `# nosec Bxxx - <reason>` at the call site.
      - name: Run Bandit
        run: bandit -r core/ services/ tools/ scripts/ -ll -ii

      - name: Write Bandit report
        if: always()
        run: bandit -r core/ services/ tools/ scripts/ -ll -ii -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  security-scan-npm:
    name: Security Scan - NPM
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # --omit=dev audits what ships. clients/web's remaining highs are the
      # braces chain under tailwindcss (build-time only; the fix is a breaking
      # tailwind 4 upgrade).
      - name: Run npm audit
        run: |
          status=0
          for dir in clients/web services/agent clients/desktop; do
            echo "::group::npm audit ($dir)"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status

  # ============================================================================
  # Build Docker Images
  # ============================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, test-unit-backend, test-unit-backend-db, test-integration]
    if: false  # Disabled - enable if you need Docker images
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
      
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata (daemon)
        id: meta-daemon
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-daemon
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
      
      - name: Build and push daemon image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.daemon
          push: true
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Build Frontend Assets
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    # Runs on PRs too, not just push. This is the only job that type-checks
    # (tsc); gating it to post-merge let type errors land on main. The
    # pull_request build compiles the PR merged into its base, so it also
    # catches breakage that only appears after the merge.
    if: github.repository == 'Vigil-SOC/vigil'
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      
      - name: Build frontend
        working-directory: clients/web
        run: npm run build
      
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: clients/web/build/
          retention-days: 7

  # ============================================================================
  # Scan Docker Images for Vulnerabilities
  # ============================================================================
  scan-images:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    needs: [build-images]
    if: false  # Disabled - enable by changing to: github.event_name == 'push'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

