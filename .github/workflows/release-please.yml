name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the next release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Only run on the canonical repo. Forks lack the release-please GitHub
    # App vars/secrets below, so this job would fail on every push to their
    # main and email the fork owner. Skipping (not failing) keeps forks quiet.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mint a short-lived token (1-hour TTL, auto-rotated) from the
      # release-please GitHub App. Using an App rather than a long-lived
      # PAT means the token is not tied to any individual maintainer and
      # is auto-revoked when the App is uninstalled.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # Every release is a patch by default (config: always-bump-patch). This
      # step adds an empty `Release-As:` commit to main so release-please opens
      # or updates the release PR even when merged PR titles carry no
      # conventional prefix. The Run workflow button picks minor/major.
      # Needs the release-please App as a bypass actor on the "main branch
      # protection" ruleset.
      - name: Add Release-As commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            BUMP=patch
            # Merging a release PR (or a hand-written `chore: release`) must not start the next one.
            if [[ "${HEAD_MSG%%$'\n'*}" =~ ^chore(\(main\))?:\ release\  ]]; then
              echo "Head commit is a release commit; skipping."; exit 0
            fi
            if [ -n "$(gh pr list --repo "$REPO" --label 'autorelease: pending' --state open --json number --jq '.[].number')" ]; then
              echo "A release PR is already open; skipping."; exit 0
            fi
          fi
          for attempt in 1 2 3 4; do
            head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
            cur=$(gh api "repos/$REPO/contents/.github/.release-please-manifest.json?ref=$head" \
              -H 'Accept: application/vnd.github.raw' | jq -r '.["."]')
            [[ "$cur" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Bad manifest version: $cur"; exit 1; }
            maj=${BASH_REMATCH[1]} min=${BASH_REMATCH[2]} pat=${BASH_REMATCH[3]}
            case "$BUMP" in
              major) next="$((maj + 1)).0.0" ;;
              minor) next="$maj.$((min + 1)).0" ;;
              *) next="$maj.$min.$((pat + 1))" ;;
            esac
            msg=$(printf 'chore: release %s\n\n[skip ci]\n\nRelease-As: %s' "$next" "$next")
            new=$(gh api "repos/$REPO/git/commits" -f message="$msg" -f tree="$tree" -f "parents[]=$head" --jq .sha)
            if out=$(gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$new" -F force=false 2>&1); then
              echo "Added Release-As: $next ($BUMP) on $new"; exit 0
            fi
            case "$out" in
              *"not a fast forward"*) echo "main moved (attempt $attempt); retrying" ;;
              *) echo "::error::Could not commit to main: $out. The \"main branch protection\" ruleset must list the release-please GitHub App as a bypass actor."; exit 1 ;;
            esac
          done
          echo "::error::main kept moving; gave up after 4 attempts."; exit 1

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
