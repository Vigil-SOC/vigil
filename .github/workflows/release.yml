# .github/workflows/release.yml
#
# Triggered when release-please merges a release PR and pushes a vX.Y.Z tag.
# Builds (via build-images.yml), signs and publishes four OCI images to ghcr.io:
#
#   ghcr.io/vigil-soc/vigil-backend:<tag>   (FastAPI API + bundled SPA)
#   ghcr.io/vigil-soc/vigil-daemon:<tag>    (headless SOC daemon)
#   ghcr.io/vigil-soc/vigil-agent:<tag>     (TypeScript agent: worker + serve)
#   ghcr.io/vigil-soc/vigil-mcp-runner:<tag> (MCP servers, each under its own uid)
#
# The llm-worker Deployment reuses the backend image (different command), and
# agent-worker/agent-serve are the same arrangement over the agent image: one
# artifact, two commands, two Deployments that scale independently (#635).
#
# Prerequisites (one-time, per https://vigilsoc.org/docs/releasing/):
#   • GitHub App installed with id=vars.RELEASE_PLEASE_APP_ID
#     and private key at secrets.RELEASE_PLEASE_PRIVATE_KEY
#   • "Read and write" Packages permission on the repo
#     (Settings → Actions → General → Workflow permissions)

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # only vX.Y.Z tags from release-please

# Least-privilege defaults; each job overrides what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the release version once, for every downstream job.
  # The pushed image tags use docker/metadata-action's {{version}}, which
  # strips the leading "v" (vX.Y.Z → X.Y.Z). github.ref_name keeps the "v",
  # so jobs that pull/inspect the images must use this stripped value or they
  # reference a tag that was never pushed.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    # Canonical repo only. This pipeline pushes to ghcr.io/vigil-soc and needs
    # org packages permissions a fork can't use; skipping keeps forks quiet if
    # a vX.Y.Z tag is ever pushed in one.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build, push and smoke-test the four images (shared with beta.yml)
  # ---------------------------------------------------------------------------
  build:
    name: Build images
    needs: [version]
    permissions:
      contents: read
      packages: write          # push to ghcr.io
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: stable
      ref: ${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Sign the images keyless. Signing lives here, not in build-images.yml: the
  # certificate records the workflow that signed, and the verify command in
  # README.md and SECURITY.md checks for release.yml.
  # ---------------------------------------------------------------------------
  sign:
    name: Sign images
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write          # push signatures to ghcr.io
      id-token: write          # keyless cosign signing

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      # Sign the multi-arch index digests, not the tags: tags are mutable.
      - name: Sign images (keyless)
        env:
          BACKEND: ghcr.io/vigil-soc/vigil-backend@${{ needs.build.outputs.backend_digest }}
          DAEMON: ghcr.io/vigil-soc/vigil-daemon@${{ needs.build.outputs.daemon_digest }}
          AGENT: ghcr.io/vigil-soc/vigil-agent@${{ needs.build.outputs.agent_digest }}
          MCP_RUNNER: ghcr.io/vigil-soc/vigil-mcp-runner@${{ needs.build.outputs.mcp_runner_digest }}
        run: cosign sign --yes "$BACKEND" "$DAEMON" "$AGENT" "$MCP_RUNNER"

  # ---------------------------------------------------------------------------
  # Attach image digests to the GitHub Release
  # ---------------------------------------------------------------------------
  update-release:
    name: Annotate GitHub Release
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    needs: [version, build, sign]
    permissions:
      contents: write    # edit release body

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build support tarball
        run: scripts/build-support-tarball.sh "${{ needs.version.outputs.version }}" support-dist

      # The digests come from the build: the multi-arch index digest of each
      # image, which the sign job signed. Refuse to publish a blank or non-sha256 value.
      - name: Check digests
        env:
          BACKEND: ${{ needs.build.outputs.backend_digest }}
          DAEMON: ${{ needs.build.outputs.daemon_digest }}
          AGENT: ${{ needs.build.outputs.agent_digest }}
          MCP_RUNNER: ${{ needs.build.outputs.mcp_runner_digest }}
        run: |
          fail=0
          for name in BACKEND DAEMON AGENT MCP_RUNNER; do
            case "${!name}" in
              sha256:?*) ;;
              *) echo "::error::${name} digest is '${!name}', expected sha256:…"; fail=1 ;;
            esac
          done
          exit "$fail"

      - name: Append image refs to release notes
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          files: |
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz.sha256
          body: |

            ---
            ### Container Images

            | Image | Tag | Digest |
            |-------|-----|--------|
            | `ghcr.io/vigil-soc/vigil-backend` | `${{ needs.version.outputs.version }}` | `${{ needs.build.outputs.backend_digest }}` |
            | `ghcr.io/vigil-soc/vigil-daemon`  | `${{ needs.version.outputs.version }}` | `${{ needs.build.outputs.daemon_digest }}`  |
            | `ghcr.io/vigil-soc/vigil-agent`   | `${{ needs.version.outputs.version }}` | `${{ needs.build.outputs.agent_digest }}`   |
            | `ghcr.io/vigil-soc/vigil-mcp-runner` | `${{ needs.version.outputs.version }}` | `${{ needs.build.outputs.mcp_runner_digest }}` |

            ```bash
            # Pull by tag
            docker pull ghcr.io/vigil-soc/vigil-backend:${{ needs.version.outputs.version }}
            docker pull ghcr.io/vigil-soc/vigil-daemon:${{ needs.version.outputs.version }}
            docker pull ghcr.io/vigil-soc/vigil-agent:${{ needs.version.outputs.version }}
            docker pull ghcr.io/vigil-soc/vigil-mcp-runner:${{ needs.version.outputs.version }}
            ```
