name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ============================================================================
  # Full Test Suite
  # ============================================================================
  full-test-suite:
    name: Full Test Suite
    # Canonical repo only. Scheduled workflows run on the default branch of any
    # fork with Actions enabled, but forks lack the secrets this suite needs, so a
    # nightly run just emails the fork owner a failure.
    # Skipping (not failing) keeps forks quiet.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    # Same services, job env, extensions, init_database(), and agent-layer SQL
    # as ci-cd.yml test-integration (and the DB pieces of test-unit-backend-db).
    # DatabaseConfig does not read DATABASE_URL (#752); POSTGRES_* on the job
    # is what Python actually uses. DATABASE_URL stays for the TypeScript
    # walking-skeleton test, which shells out to npx tsx and reads it itself.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # The walking-skeleton test enqueues onto BullMQ and spawns the TypeScript
      # worker, so this job needs Redis and Node as well as Postgres.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      TESTING: "true"
      DEV_MODE: "true"
      SECRET_KEY: "test-secret-key"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deeptempo_test
      DATABASE_URL: postgresql://test:test@localhost:5432/deeptempo_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install agent-layer dependencies
        working-directory: services/agent
        run: npm ci
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Initialize schema
        # Strict here, and only here: CI provisions from empty, so a schema that
        # cannot serve the models at this point is a provisioning bug rather
        # than a stale deployment (#562). Scoped to the step rather than the job
        # so it does not change how every test in the job behaves.
        env:
          DB_STRICT_SCHEMA: "true"
        run: |
          python -c "from core.storage.connection import init_database; init_database()"

      # The agent layer's tables are raw SQL with no ORM model, deliberately:
      # Python makes two reads against the ledger and a model invites writes.
      # init_database() builds from the models, so it creates none of them.
      - name: Apply agent-layer schema
        run: |
          PGPASSWORD=test psql -h localhost -p 5432 -U test -d deeptempo_test \
            -f infra/database/init/19_agent_ledger.sql \
            -f infra/database/init/31_agent_ledger_hash_chain.sql \
            -f infra/database/init/20_agent_directives.sql \
            -f infra/database/init/21_agent_run_leases.sql
      
      - name: Run all tests
        run: |
          pytest tests/ -v --cov --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: nightly
          name: nightly-full-suite

  # ============================================================================
  # Performance Regression Tests
  # ============================================================================
  performance-tests:
    name: Performance Regression Tests
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-benchmark
      
      - name: Run performance tests
        run: |
          pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark.json || true
      
      - name: Store benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  # ============================================================================
  # Security Audit
  # ============================================================================
  security-audit:
    name: Security Audit
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Run pip-audit
        run: |
          # Pinned: a pip-audit that cannot run now fails this job, so an
          # upstream release is not allowed to decide whether nightly is red.
          pip install pip-audit==2.10.1
          # The lock, not requirements.txt: open ranges audit versions nothing installs.
          # Findings are not a build failure. pip-audit not running is -- and it
          # writes no report at all when it fails, so an empty file is the tell.
          pip-audit -r requirements.lock --format json --output pip-audit.json || true
          test -s pip-audit.json || {
            echo "::error::pip-audit wrote no report -- it did not run"
            exit 1
          }

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: security-audit
          path: pip-audit.json

      - name: Summarise findings
        run: |
          python3 -c '
          import json
          deps = json.load(open("pip-audit.json")).get("dependencies", [])
          hits = [(d["name"], d["version"], v["id"]) for d in deps for v in d.get("vulns", [])]
          print(f"{len(hits)} known vulnerabilities in {len(deps)} dependencies")
          for name, version, vid in hits:
              print(f"  {name} {version}: {vid}")
          '

  # ============================================================================
  # Notify on Failure
  # ============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [full-test-suite, performance-tests, security-audit]
    if: failure() && github.repository == 'Vigil-SOC/vigil'
    # `secrets` is not available in `if`, so it comes through env to be tested.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          # v4 wants the webhook as an input; env alone is "Missing input!".
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ Nightly Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ Nightly Tests Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Action:* Review test results"
                  }
                }
              ]
            }

