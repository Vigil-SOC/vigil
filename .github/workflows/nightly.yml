name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================================
  # Full Test Suite
  # ============================================================================
  full-test-suite:
    name: Full Test Suite
    # Canonical repo only. Scheduled workflows run on the default branch of any
    # fork with Actions enabled, but forks lack the private submodules + secrets
    # this suite needs, so a nightly run just emails the fork owner a failure.
    # Skipping (not failing) keeps forks quiet.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
      
      - name: Run all tests
        run: |
          uv run pytest tests/ -v --cov --cov-report=xml --cov-report=term
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:test@localhost:5432/deeptempo_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: nightly
          name: nightly-full-suite

  # ============================================================================
  # Performance Regression Tests
  # ============================================================================
  performance-tests:
    name: Performance Regression Tests
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest-benchmark
      
      - name: Run performance tests
        run: |
          uv run pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark.json || true
      
      - name: Store benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: benchmark.json

  # ============================================================================
  # Security Audit
  # ============================================================================
  security-audit:
    name: Security Audit
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run pip-audit
        run: |
          uv tool run pip-audit -r requirements.txt --format json --output pip-audit.json || true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v5
        with:
          name: security-audit
          path: pip-audit.json
      
      - name: Check for critical vulnerabilities
        run: |
          if grep -q '"vulnerabilities": \[\]' pip-audit.json; then
            echo "No vulnerabilities found"
          else
            echo "Vulnerabilities detected - review pip-audit.json"
          fi

  # ============================================================================
  # Notify on Failure
  # ============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [full-test-suite, performance-tests, security-audit]
    if: failure() && github.repository == 'Vigil-SOC/vigil' && vars.SLACK_NOTIFY == 'true'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Nightly Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ Nightly Tests Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Action:* Review test results"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

