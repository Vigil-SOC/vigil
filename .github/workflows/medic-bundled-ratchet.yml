name: Medic bundled pack ratchet

# A release must not ship a stale bundled pack: the pack in
# services/medic/packs/bundled/ has to fit ./VERSION and have 60+ days left, by the
# importer's own pack_check. release-please's PR changes VERSION, so the path filter
# below covers release PRs.
#
# Do NOT make this a required status check. GitHub applies the path filter to the
# whole workflow, so a required check behind it would never report on a PR that
# touches none of these paths and would block it forever. medic-bundled-check.yml
# has no filter and is the one to require.
on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - "services/medic/packs/bundled/**"
      - ".github/workflows/medic-bundled-ratchet.yml"
      - "scripts/medic/check_bundled_fresh.sh"

permissions:
  contents: read
  pull-requests: read

jobs:
  ratchet:
    name: Bundled pack fits this Vigil and is not about to expire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.7"

      - name: Install Medic's locked dependencies
        run: uv sync --project services/medic --frozen

      # A missing bundled file only fails a PR that changes VERSION (a release). A PR
      # that merely edits this check has nothing to ship, so it must not be blocked
      # by the file not existing yet.
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename')
          if grep -qxF VERSION <<<"$files"; then
            MISSING_OK=0
          else
            MISSING_OK=1
          fi
          export MISSING_OK
          scripts/medic/check_bundled_fresh.sh
