# actionlint configuration.
#
# The gate exists for schema and syntax errors: those take the whole workflow
# down, since GitHub rejects the file before scheduling anything and the run
# then reports zero jobs with nothing pointing at the cause.
#
# The ignore below is a pre-existing advisory finding, kept out of the gate so
# it fails only on things that actually break a workflow:
#   - shellcheck findings inside `run:` blocks (style, and often wrong about
#     Actions-specific idioms)
paths:
  .github/workflows/*.yml:
    ignore:
      - 'shellcheck reported issue in this script'
