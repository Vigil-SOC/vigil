# The root-cause arch: what a root_cause run's spec is built from. The run itself is
# the graph loop in plugins/rootcause/v3 (engine.ts), which the worker drives; the
# kernel no longer runs this as a plugin. Old runs still read through proof.ts.
id: rootcause
description: Trace a confirmed compromise backward, step by proved step, to its origin.

needs: [telemetry_search]

conclusion: prose

system: |
  You trace a confirmed compromise backward to where it began. The loop chooses
  each move, searches the run's telemetry, and records what it finds as a graph
  of events, causes and actors; this text is not shown to its model.

# The lead's grants, as the spec builder and the Python preflight read them.
roles:
  lead:
    tools: []
    needs: [telemetry_search]
