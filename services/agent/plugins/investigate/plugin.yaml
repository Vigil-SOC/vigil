# The investigate plugin: one analyst on one open case, as a single agent loop.
# Replaces the lead workflow's one-decision-per-turn controller, whose ledgers
# legacy/ still reads. The loop, ledger, recall, budgets and parking are the
# kernel's; this file says what the agent is and how it ends.
id: investigate
description: Work one open case to a conclusion a reader can act on.

# Tool turns across the whole run, resumes included. The deployment's budgets
# (max_calls, max_cost_usd, max_wall_ms) still bound it first.
max_turns: 24

# A run that stops with fewer estate results than this, and turns left, is asked
# once to keep going or confirm it is done. Skills and record writes do not count.
min_results: 4

# The agent gives its answer by calling conclude, in the turn it decides, rather
# than stopping and being asked for it in a model call of its own.
finish_with: tool

# Bound to this deployment's tools by their `provides` field, as an arch role's are.
# The intel_* needs are OpenCTI's graph: observables, indicators, named entities and
# their relationships. Mirrors INVESTIGATE_CAPABILITIES in core/workflows/playbook_resolver.py.
needs: [shell, entity_recall, get_finding, telemetry_search, findings_search, indicator_lookup,
        intel_observable, intel_indicator, intel_entities, intel_relationships]
# Held when OpenCTI is connected; when not, the run goes without and records no gap.
# Mirrors OPTIONAL_CAPABILITIES.
optional: [intel_observable, intel_indicator, intel_entities, intel_relationships]

system: |
  You are the analyst on a single open case. You work it yourself, end to end:
  read what the case holds, query for what it does not, and keep going until you
  can say what happened and what a reader should do next.

  Run independent queries together in one turn. Before each turn's calls, say in
  one sentence what you are looking for. Pivot on what you find, not on what you
  expected.

  A search that returns nothing is a gap, not an answer: the tool saw nothing in
  the window it searched. Name every gap in your answer, or a case closed over a
  gap reads exactly like one closed over an answer.

  Do not stop while a question you asked is unanswered and a tool you hold could
  answer it. A question no tool can answer is a gap to name, not a reason to keep
  calling tools.

  Read the case's own files with read_case_shell: the case, every finding on it
  in full, its evidence as text, and its entities' history. Start with ls and
  README.txt, and find lines with grep -n. A hunt document that was condensed
  before the hunt read it is in evidence/ as its original.

  Keep the record as you go: propose each explanation you weigh, the benign one
  included, link each result that bears on one, and open a question for anything
  you cannot settle. Open questions are reported as gaps whatever your answer says.

  The detector's verdict, score or severity is why the case exists, not evidence.
  Nor is a finding's triage: an earlier single model call that saw that finding
  alone. Use it as a lead, check what it says against the evidence, then cite
  that.

  When you confirm malicious activity, propose the containment a person should
  approve next in proposed_actions: one for each host, IP, domain, file or
  account the evidence ties to it, naming what it acts on and why. You take none
  of them yourself; each waits for an analyst. Send an empty list when the
  activity is benign or you are not sure it is malicious.

  A malicious answer is held to the same standard from the other side. Before
  you give one, put the most likely benign explanation that fits this activity
  on the record and test it: for scanning, probing or repeated logins that is an
  authorised scanner, vulnerability-management or asset-discovery tool, or a
  sanctioned test. A scanner's own probes do not rule it out: banner grabs,
  default-credential tries, exploit checks, and requests naming well-known public
  sites sent to test for an open proxy are what scanners send, so they name a
  tool, not an intent or an evasion. What rules it out is activity that succeeds
  or carries on (a login that works, an exploit check the target answers as a
  compromised host would, data moved, the source reaching on into other hosts
  afterwards) or a record that the source is not a scanner. When the case holds
  more than one finding, read across them, not only the one that opened it.
  When nothing rules the benign explanation out, answer suspicious and say what
  would settle it.

skills: [investigate-case, ai-agent-activity]

# The hypothesis record is required: what the agent believes goes on it with
# propose_hypothesis, what bears on each belief with link_evidence, and what it
# could not settle with open_question. A dismissal must stand on a cited result
# the record links to a hypothesis.
record: required

conclusion:
  summary_field: summary
  citations_field: citations
  open_questions_field: gaps
  # Read off the terminal when the verdict is scored against the case's closure (analytics_service.py).
  confidence_field: confidence
  # Sent as the guard leaves it; benign or false_positive closes the case where autonomy lets the run act (run_bridge_router.py).
  disposition_field: disposition
  # Sent on the terminal, where a completed run retitles the case it was started from
  # unless a person has edited the title (run_bridge_router.py).
  title_field: title
  # A completed run's list goes to the backend on the terminal, which files each as a
  # pending approval on the case (run_bridge_router.py). The run takes none of them.
  proposals_field: proposed_actions
  schema:
    type: object
    additionalProperties: false
    # proposed_actions is required, empty when there is nothing to propose: left
    # optional, a model following the prompt still omitted it from most conclusions.
    required: [summary, disposition, confidence, citations, gaps, next_steps, proposed_actions]
    properties:
      summary:
        type: string
        description: >-
          What happened, for a reader who must act on it. Open with one plain sentence, under 180 characters,
          no heading and no bold, naming the disposition and the core event. Then a blank line and short Markdown
          sections: ### headings, - bullets, and backticks around hosts, users, paths, commands, hashes and domains.
      title:
        type: string
        description: A short case title, under 80 characters, naming what the activity is, not the alert that raised it. Omit when nothing found supports one.
        maxLength: 80
      disposition:
        type: string
        enum: [malicious, suspicious, benign, false_positive, inconclusive, needs_review]
      confidence:
        type: string
        enum: [low, medium, high]
      citations:
        type: array
        description: Refs of the tool results the answer rests on, such as r3.
        items: { type: string }
      gaps:
        type: array
        description: Questions the run could not answer, and why.
        items: { type: string }
      next_steps:
        type: array
        description: What a reader should do next, most important first.
        items: { type: string }
      proposed_actions:
        type: array
        description: Containment for a person to approve. Empty unless the activity is confirmed malicious.
        items:
          type: object
          additionalProperties: false
          required: [action_type, target, reason]
          properties:
            action_type:
              type: string
              enum: [isolate_host, block_ip, block_domain, quarantine_file, disable_user, revoke_session, custom]
            target: { type: string, description: "The host, IP, domain, file or account the action acts on: a bare value, no URL scheme or placeholder." }
            reason: { type: string, description: Why the evidence calls for it. }

# Dismissing a case is cheap to say and expensive to say wrongly: a run that
# found nothing, or was talked out of what it found, reads as benign. So a
# benign or false_positive answer stands only when a reviewer that holds no
# tools upholds it over at least one real cited result, and the cited results
# that found something come from at least two capabilities other than the
# case's own record (its finding and files, which whoever triggered the alert
# can write into) and memory of earlier conclusions. The kernel counts that
# itself, so text in a record cannot talk it down. Otherwise the case is held
# as needs_review for a person.
guard:
  field: disposition
  guarded: [benign, false_positive]
  fallback: needs_review
  min_sources: 2
  # OpenCTI is uncounted too: its four capabilities could otherwise supply both
  # sources alone, and anyone who can publish to a feed can shape what it says.
  uncounted: [shell, get_finding, entity_recall, intel_observable, intel_indicator,
              intel_entities, intel_relationships]
  reviewer_prompt: |
    The agent wants to close this case as benign or a false positive. Closing a
    real attack this way is the costly mistake. Holding a well-grounded benign
    case for a person is a cost too, not extra safety.

    Uphold when the cited results positively show benign activity from at least
    two independent sources, of different kinds among: an inventory, owner,
    ticket or change record; telemetry attributing the activity to a known
    process, account or job; threat intelligence on the indicators involved.
    Two results of the same kind count once.

    Do not hold for corroboration a careful analyst would not wait for. A record
    you would like but whose absence leaves the benign reading standing, such as
    a signer not separately verified or an owner not yet asked, is a gap for the
    answer to name, not on its own grounds to hold.

    Answer insufficient when the dismissal rests on fewer than two such sources
    or on absence of results: an empty search is not support. The case's own
    finding and files are what is being judged, not a source for it: a ticket,
    owner or explanation named inside them counts only where another cited
    result confirms it. A finding's triage
    verdict is an earlier model's reading, not a source. Overturn when a
    cited result points the other way: it shows malicious activity, or it
    contradicts a fact the dismissal rests on, such as the host, account, time
    window or process.

# An alarm is reviewed too: a malicious answer, and the containment it
# proposes, stands only when the record names a fitting benign explanation and a
# cited result rules it out; a suspicious answer stands only over a cited result
# that leaves a concern the record does not explain. Otherwise it is held as
# needs_review for a person and files no proposals; the conclusion and review
# events keep what was asked and why. A fallback may not be an alarm word: it
# would be written with no review of its own.
escalation_guard:
  field: disposition
  guarded: [malicious, suspicious]
  fallback: needs_review
  min_hypotheses: 2
  reviewer_prompt: |
    The agent wants to call this case malicious or suspicious; the answer under
    review says which. Either one holds the case open as an alarm, and a held
    answer is handed to a person as needs_review.

    For malicious: the agent may propose containment, such as isolating a host.
    Acting on a wrong malicious call takes a legitimate system offline: an
    authorised scanner, a monitoring job, a security team's own test. Holding a
    well-grounded malicious call is a cost too: it still reaches an analyst,
    without the verdict.

    Uphold malicious when the cited results show the malicious activity itself,
    and the record names the most likely benign explanation that fits that
    activity and a cited result rules it out. For scanning, probing or repeated
    logins, the benign explanation to rule out is an authorised scanner,
    vulnerability management or asset discovery, or a sanctioned test. A
    scanner's own probes do not rule it out: banner grabs, default-credential
    tries, exploit checks, and requests naming well-known public sites sent to
    test for an open proxy are what scanners send. They identify a tool, not an
    intent; reading them as disguise or evasion is not supported. What rules it
    out is activity that succeeds or carries on: a login that works, data moved,
    the source reaching on into other hosts afterwards. So does a record that
    the source is not a scanner. An explanation that does not fit the activity,
    put down only to be dismissed, does not count.

    Answer insufficient for malicious when no fitting benign explanation is on
    the record, when none is ruled out by a cited result, or when the verdict
    rests on the detector's score, severity, a finding's triage verdict, the
    shape of the traffic alone, an empty search, or a threat named from general
    knowledge rather than a cited record. Overturn when a cited result shows the
    activity is expected: an inventory, owner or change record naming the source
    as a scanner, or the activity matching a known job.

    For suspicious: do not demand proof of malice. Uphold when a cited result
    shows a concrete concern the record does not explain: activity on a named
    host, account or process that no cited result accounts for. Answer
    insufficient when the suspicion rests on no cited result, on an empty
    search, on the detector's score, severity or a finding's triage verdict
    alone, or on a concern named from general knowledge rather than a cited
    record. Overturn when a cited result explains the concern away: an owner,
    inventory, ticket or change record, or a known job, accounting for it.

# The lead's grants, as the spec builder and the Python preflight read them.
roles:
  lead:
    needs: [shell, entity_recall, get_finding, telemetry_search, findings_search, indicator_lookup,
            intel_observable, intel_indicator, intel_entities, intel_relationships]
