# The investigate plugin: one analyst on one open case, as a single agent loop.
# Replaces the lead workflow's one-decision-per-turn controller (workflows/lead)
# and the arch prompt in arch/investigate.yaml. The loop, ledger, recall, budgets
# and parking are the kernel's; this file says what the agent is and how it ends.
id: investigate
description: Work one open case to a conclusion a reader can act on.

# Tool turns across the whole run, resumes included. The deployment's budgets
# (max_calls, max_cost_usd, max_wall_ms) still bound it first.
max_turns: 24

# A run that stops with fewer estate results than this, and turns left, is asked
# once to keep going or confirm it is done. Skills and record writes do not count.
min_results: 4

# The agent gives its answer by calling conclude, in the turn it decides, rather
# than stopping and being asked for it in a model call of its own.
finish_with: tool

# Bound to this deployment's tools by their `provides` field, as an arch role's are.
needs: [case_records, get_finding, telemetry_search, findings_search, indicator_lookup]

system: |
  You are the analyst on a single open case. You work it yourself, end to end:
  read what the case holds, query for what it does not, and keep going until you
  can say what happened and what a reader should do next.

  Run independent queries together in one turn. Before each turn's calls, say in
  one sentence what you are looking for. Pivot on what you find, not on what you
  expected.

  A search that returns nothing is a gap, not an answer: the tool saw nothing in
  the window it searched. Name every gap in your answer, or a case closed over a
  gap reads exactly like one closed over an answer.

  Do not stop while a question you asked is unanswered and a tool you hold could
  answer it. A question no tool can answer is a gap to name, not a reason to keep
  calling tools.

  Keep the record as you go: propose each explanation you weigh, the benign one
  included, link each result that bears on one, and open a question for anything
  you cannot settle. Open questions are reported as gaps whatever your answer says.

skills: [investigate-case]

# The hypothesis record is required: what the agent believes goes on it with
# propose_hypothesis, what bears on each belief with link_evidence, and what it
# could not settle with open_question. A dismissal must stand on a cited result
# the record links to a hypothesis.
record: required

conclusion:
  summary_field: summary
  citations_field: citations
  open_questions_field: gaps
  schema:
    type: object
    additionalProperties: false
    required: [summary, disposition, confidence, citations, gaps, next_steps]
    properties:
      summary:
        type: string
        description: What happened, in a paragraph a reader can act on.
      disposition:
        type: string
        enum: [malicious, suspicious, benign, false_positive, inconclusive, needs_review]
      confidence:
        type: string
        enum: [low, medium, high]
      citations:
        type: array
        description: Refs of the tool results the answer rests on, such as r3.
        items: { type: string }
      gaps:
        type: array
        description: Questions the run could not answer, and why.
        items: { type: string }
      next_steps:
        type: array
        description: What a reader should do next, most important first.
        items: { type: string }

# Dismissing a case is cheap to say and expensive to say wrongly: a run that
# found nothing, or was talked out of what it found, reads as benign. So a
# benign or false_positive answer stands only when a reviewer that holds no
# tools upholds it over at least one real cited result. Otherwise the case is
# held as needs_review for a person.
guard:
  field: disposition
  guarded: [benign, false_positive]
  fallback: needs_review
  reviewer_prompt: |
    The agent wants to close this case as benign or a false positive. Closing a
    real attack this way is the costly mistake, so the bar is higher than for
    escalating. Uphold only when the cited results positively show benign
    activity: an owner, a known job, a matching change, a clean result from a
    search that would have found the activity. Absence of results is not
    support. Overturn when a cited result points the other way.
