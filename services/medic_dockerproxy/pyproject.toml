# The read-only Docker proxy between Medic and the Docker socket (C3 §4.3, SP2).
# Its own lock, like the gateway's: it imports nothing from core, services.medic
# or any other service (.importlinter), and it has no runtime dependencies at
# all (SP2 ⚑2 (a)): the component that holds the Docker socket has no
# dependency tree to audit.
[project]
name = "vigil-medic-dockerproxy"
version = "0.0.0"
description = "Medic's read-only proxy to the Docker Engine API"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pytest>=8",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["services"]
