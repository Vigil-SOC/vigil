rule: llm.cost-cap-paused
cases:
- kind: fires
  id: v01-hourly-cap-reached
  title: Hourly cap reached
  end: +40m
  sensors:
  - {id: gateway.orchestrator, covers: [orchestrator_status], interval: 300s, service: backend, states: [[+0s, ok]]}
  types:
    orchestrator_status: {cost.hourly_paused: bool}
  series:
  - {signal: orchestrator_status, key: cost.hourly_paused, steps: [[+0s, false], [+5m, true], [+30m, false]]}
  expect:
  - {at: +5m, rule: llm.cost-cap-paused, eval: true, state: pending}
  - {at: +10m, rule: llm.cost-cap-paused, eval: true, state: firing, incident: A}
  - {at: +30m, rule: llm.cost-cap-paused, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.cost-cap-paused, active_since: +5m, opened_at: +10m, resolving_since: +30m, resolved_at: +35m, reason: cleared, routed_at: +10m}
- kind: silent
  id: v02-under-the-cap
  title: Under the cap
  end: +30m
  sensors:
  - {id: gateway.orchestrator, covers: [orchestrator_status], interval: 300s, service: backend, states: [[+0s, ok]]}
  types:
    orchestrator_status: {cost.hourly_paused: bool}
  series:
  - {signal: orchestrator_status, key: cost.hourly_paused, steps: [[+0s, false]]}
  expect:
  - {at: +5m, rule: llm.cost-cap-paused, eval: false, state: inactive}
  - {at: +20m, rule: llm.cost-cap-paused, eval: false, state: inactive}
  incidents: {}
