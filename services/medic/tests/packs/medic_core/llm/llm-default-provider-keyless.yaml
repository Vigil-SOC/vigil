rule: llm.default-provider-keyless
cases:
- kind: fires
  id: v01-keyless-anthropic-default
  title: 'The fresh-install seed (L-1.a), until a key is added at +10m.'
  end: +20m
  sensors:
  - {id: gateway.llm-providers, covers: [llm_providers], interval: 60s, service: backend, states: [[+0s, ok]]}
  types:
    llm_providers: {providers.is_default: bool, providers.is_active: bool, providers.has_api_key: bool, providers.provider_type: enum}
  series:
  - signal: llm_providers
    key: providers.is_default
    labels: {provider: anthropic-1}
    steps:
    - - +0s
      - true
  - signal: llm_providers
    key: providers.is_active
    labels: {provider: anthropic-1}
    steps:
    - - +0s
      - true
  - signal: llm_providers
    key: providers.has_api_key
    labels: {provider: anthropic-1}
    steps:
    - - +0s
      - false
    - - +10m
      - true
  - signal: llm_providers
    key: providers.provider_type
    labels: {provider: anthropic-1}
    steps:
    - - +0s
      - anthropic
  expect:
  - at: +5m
    rule: llm.default-provider-keyless
    group: {provider: anthropic-1}
    eval: true
    state: firing
    incident: A
  - at: +10m
    rule: llm.default-provider-keyless
    group: {provider: anthropic-1}
    eval: false
    state: resolving
    incident: A
  incidents:
    A:
      rule: llm.default-provider-keyless
      group: {provider: anthropic-1}
      active_since: +0s
      opened_at: +5m
      resolving_since: +10m
      resolved_at: +15m
      reason: cleared
      routed_at: +5m
- kind: silent
  id: v02-keyless-ollama-default-is-fine
  title: Ollama needs no API key.
  end: +15m
  sensors:
  - {id: gateway.llm-providers, covers: [llm_providers], interval: 60s, service: backend, states: [[+0s, ok]]}
  types:
    llm_providers: {providers.is_default: bool, providers.is_active: bool, providers.has_api_key: bool, providers.provider_type: enum}
  series:
  - signal: llm_providers
    key: providers.is_default
    labels: {provider: ollama-1}
    steps:
    - - +0s
      - true
  - signal: llm_providers
    key: providers.is_active
    labels: {provider: ollama-1}
    steps:
    - - +0s
      - true
  - signal: llm_providers
    key: providers.has_api_key
    labels: {provider: ollama-1}
    steps:
    - - +0s
      - false
  - signal: llm_providers
    key: providers.provider_type
    labels: {provider: ollama-1}
    steps:
    - - +0s
      - ollama
  expect:
  - at: +1m
    rule: llm.default-provider-keyless
    group: {provider: ollama-1}
    eval: false
    state: inactive
  - at: +10m
    rule: llm.default-provider-keyless
    group: {provider: ollama-1}
    eval: false
    state: inactive
  incidents: {}
- kind: silent
  id: v03-keyless-vertex-default-is-fine
