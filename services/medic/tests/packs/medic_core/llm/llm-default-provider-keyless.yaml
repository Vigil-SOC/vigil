  - {signal: llm_providers, key: providers.is_active, labels: {provider: vertex-1}, steps: [[+0s, true]]}
  - {signal: llm_providers, key: providers.has_api_key, labels: {provider: vertex-1}, steps: [[+0s, false]]}
  - {signal: llm_providers, key: providers.provider_type, labels: {provider: vertex-1}, steps: [[+0s, vertex]]}
  expect:
  - {at: +10m, rule: llm.default-provider-keyless, group: {provider: vertex-1}, eval: false, state: inactive}
