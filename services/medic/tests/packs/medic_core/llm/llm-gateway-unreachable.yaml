rule: llm.gateway-unreachable
cases:
- id: mirror-reconcile-outage
  fires: true
  start: '2026-10-08T10:00:00Z'
  end: +25m
  sensors:
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_backend
    level: ERROR
    logger: core.llm.bifrost.mirror
    template: 'Mirror reconcile skipped — Bifrost unreachable: %s'
    message: 'Mirror reconcile skipped — Bifrost unreachable: ConnectError: [Errno 111] Connection refused'
    at: +2m
  - signal: log_backend
    level: INFO
    logger: core.llm.bifrost.mirror
    template: '%s; recovered after %d failures'
    message: Bifrost reachable for mirror reconcile; recovered after 3 failures
    at: +17m
  expect:
  - {at: +4m, rule: llm.gateway-unreachable, eval: true, state: firing, incident: A}
  - {at: +17m, rule: llm.gateway-unreachable, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.gateway-unreachable, active_since: +2m, opened_at: +4m, resolving_since: +17m, resolved_at: +22m, reason: cleared, routed_at: +4m}
- id: backend-restart-clears-then-still-down-resets
  fires: true
  why: The backend restarts (clear), but Bifrost is still down, so the new process logs the entry ERROR again and a new incident opens.
  start: '2026-10-08T10:00:00Z'
  end: +20m
  sensors:
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_backend
    level: ERROR
    logger: core.llm.bifrost.mirror
    template: 'Mirror reconcile skipped — Bifrost unreachable: %s'
    message: 'Mirror reconcile skipped — Bifrost unreachable: ConnectError: [Errno 111] Connection refused'
    at: +1m
  - signal: log_backend
    level: INFO
    logger: services.api.main
    template: Starting Vigil SOC Backend
    at: +6m
  - signal: log_backend
    level: ERROR
    logger: core.llm.bifrost.mirror
    template: 'Mirror reconcile skipped — Bifrost unreachable: %s'
    message: 'Mirror reconcile skipped — Bifrost unreachable: ConnectError: [Errno 111] Connection refused'
    at: +7m
  expect:
  - {at: +6m, rule: llm.gateway-unreachable, eval: false, state: resolving, incident: A}
  - {at: +7m, rule: llm.gateway-unreachable, eval: true, state: firing, incident: A}
  incidents:
    A: {rule: llm.gateway-unreachable, active_since: +1m, opened_at: +3m, resolving_since: null, resolved_at: null, routed_at: +3m}
- id: rate-refresh-outage-is-not-this-rule
  fires: false
  why: The rate refresher's #1689 line comes from another logger and template.
  start: '2026-10-08T10:00:00Z'
  end: +10m
  sensors:
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_backend
    level: ERROR
    logger: core.llm.bifrost.admin
    template: 'Gateway rate refresh failed, LLM calls are recorded unpriced: %s'
    message: 'Gateway rate refresh failed, LLM calls are recorded unpriced: ConnectError'
    at: +2m
  expect:
  - {at: +6m, rule: llm.gateway-unreachable, eval: false, state: inactive}
  incidents: {}
