rule: llm.rate-limited
cases:
- id: sustained-429s
  fires: true
  why: A 429 every minute for 20 minutes.
  start: '2026-10-08T10:00:00Z'
  end: +35m
  sensors:
  - {id: log.llm-worker-errors, covers: [llm_worker_errors_as_success], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.llm-worker, covers: [log_llm_worker], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: llm_worker_errors_as_success
    level: ERROR
    logger: services.worker.jobs
    template: 'llm_call failed (returning error dict): %s'
    message: "llm_call failed (returning error dict): RateLimitError: Error code: 429 - rate_limit_error"
    at: +1m
    repeat: {every: 1m, until: +20m}
  expect:
  - {at: +3m, rule: llm.rate-limited, eval: true, state: pending}
  - {at: +13m, rule: llm.rate-limited, eval: true, state: pending}
  - {at: +18m, rule: llm.rate-limited, eval: true, state: firing, incident: A}
  - {at: +23m, rule: llm.rate-limited, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.rate-limited, active_since: +3m, opened_at: +18m, resolving_since: +23m, resolved_at: +33m, reason: cleared, routed_at: +18m}
- id: retries-exhausted-on-429
  fires: true
  start: '2026-10-08T10:00:00Z'
  end: +20m
  sensors:
  - {id: log.llm-worker-errors, covers: [llm_worker_errors_as_success], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.llm-worker, covers: [log_llm_worker], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_backend
    level: WARNING
    logger: core.llm.gateway_retry
    template: 'gateway retries exhausted: last status %s after %d attempts'
    message: 'gateway retries exhausted: last status 429 after 3 attempts'
    at: +1m
    repeat: {every: 1m, until: +20m}
  expect:
  - {at: +18m, rule: llm.rate-limited, eval: true, state: firing, incident: A}
  incidents:
    A: {rule: llm.rate-limited, active_since: +3m, opened_at: +18m, resolving_since: null, resolved_at: null, routed_at: +18m}
- id: one-burst-does-not-fire
  fires: false
  why: Five minutes of 429s (a flood of findings, which an outsider can cause) isn't enough persistence.
  start: '2026-10-08T10:00:00Z'
  end: +20m
  sensors:
  - {id: log.llm-worker-errors, covers: [llm_worker_errors_as_success], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.llm-worker, covers: [log_llm_worker], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: llm_worker_errors_as_success
    level: ERROR
    logger: services.worker.jobs
    template: 'llm_call failed (returning error dict): %s'
    message: "llm_call failed (returning error dict): RateLimitError: Error code: 429 - rate_limit_error"
    at: +1m
    repeat: {every: 30s, until: +6m}
  - signal: log_backend
    level: WARNING
    logger: core.llm.gateway_retry
    template: 'gateway retries exhausted: last status %s after %d attempts'
    message: 'gateway retries exhausted: last status 503 after 3 attempts'
    at: +1m
    repeat: {every: 1m, until: +20m}
  expect:
  - {at: +4m, rule: llm.rate-limited, eval: true, state: pending}
  - {at: +12m, rule: llm.rate-limited, eval: false, state: inactive}
  incidents: {}
