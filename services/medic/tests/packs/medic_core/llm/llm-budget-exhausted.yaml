rule: llm.budget-exhausted
cases:
- id: virtual-key-budget-spent
  fires: true
  why: I1 live eval cell L-5.a (near-zero virtual key). Two refused calls, then quiet for the 30 m window.
  start: '2026-10-08T10:00:00Z'
  end: +40m
  sensors:
  - {id: log.llm-worker-errors, covers: [llm_worker_errors_as_success], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  logs:
  - signal: llm_worker_errors_as_success
    level: ERROR
    logger: services.worker.jobs
    template: 'llm_call failed (returning error dict): %s'
    message: 'llm_call failed (returning error dict): BudgetExceeded: Bifrost reported the budget is spent'
    at: +1m
    repeat: {every: 1m, until: +2m}
  expect:
  - {at: +3m, rule: llm.budget-exhausted, eval: true, state: firing, incident: A}
  - {at: +32m, rule: llm.budget-exhausted, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.budget-exhausted, active_since: +1m, opened_at: +3m, resolving_since: +32m, resolved_at: +37m, reason: cleared, routed_at: +3m}
- id: other-errors-and-mentions-are-not-budget
  fires: false
  why: Only an error whose class is BudgetExceeded counts, not one that mentions it.
  start: '2026-10-08T10:00:00Z'
  end: +35m
  sensors:
  - {id: log.llm-worker-errors, covers: [llm_worker_errors_as_success], interval: 15s, service: llm-worker, states: [[+0s, ok]]}
  logs:
  - signal: llm_worker_errors_as_success
    level: ERROR
    logger: services.worker.jobs
    template: 'llm_call failed (returning error dict): %s'
    message: "llm_call failed (returning error dict): RateLimitError: Error code: 429 - rate limit reached"
    at: +1m
  - signal: llm_worker_errors_as_success
    level: ERROR
    logger: services.worker.jobs
    template: 'llm_call failed (returning error dict): %s'
    message: 'llm_call failed (returning error dict): RuntimeError: BudgetExceeded: quoted from an alert'
    at: +2m
  expect:
  - {at: +5m, rule: llm.budget-exhausted, eval: unknown, state: inactive}
  - {at: +31m, rule: llm.budget-exhausted, eval: false, state: inactive}
  incidents: {}
