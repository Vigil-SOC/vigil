rule: llm.triage-no-provider
cases:
- kind: fires
  id: v01-no-provider-until-one-is-configured
  title: 'Another outage''s recovery line doesn''t clear this one; only "LLM provider configured" does.'
  end: +20m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'No LLM provider configured, AI triage is skipped until one is set up'
    at: +1m
  - signal: log_soc_daemon
    level: INFO
    logger: services.daemon.processor
    template: '%s; recovered after %d failures'
    message: LLM gateway connected for AI triage; recovered after 3 failures
    at: +6m
  - signal: log_soc_daemon
    level: INFO
    logger: services.daemon.processor
    template: '%s; recovered after %d failures'
    message: LLM provider configured; recovered after 40 failures
    at: +12m
  expect:
  - {at: +3m, rule: llm.triage-no-provider, eval: true, state: firing, incident: A}
  - {at: +8m, rule: llm.triage-no-provider, eval: true, state: firing, incident: A}
  - {at: +12m, rule: llm.triage-no-provider, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.triage-no-provider, active_since: +1m, opened_at: +3m, resolving_since: +12m, resolved_at: +17m, reason: cleared, routed_at: +3m}
- kind: fires
  id: v02-daemon-restart-clears-the-latch
  title: Daemon restart clears the latch
  end: +15m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'No LLM provider configured, AI triage is skipped until one is set up'
    at: +1m
  - signal: log_soc_daemon
    level: INFO
    logger: __main__
    template: SOC Daemon initialized
    at: +6m
  expect:
  - {at: +3m, rule: llm.triage-no-provider, eval: true, state: firing, incident: A}
  - {at: +6m, rule: llm.triage-no-provider, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.triage-no-provider, active_since: +1m, opened_at: +3m, resolving_since: +6m, resolved_at: +11m, reason: cleared, routed_at: +3m}
- kind: silent
  id: v03-configured-within-the-hold
  title: Configured within the hold
  end: +10m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'No LLM provider configured, AI triage is skipped until one is set up'
    at: +1m
  - signal: log_soc_daemon
    level: INFO
    logger: services.daemon.processor
    template: '%s; recovered after %d failures'
    message: LLM provider configured; recovered after 1 failures
    at: +2m
  expect:
  - {at: +1m, rule: llm.triage-no-provider, eval: true, state: pending}
  - {at: +2m, rule: llm.triage-no-provider, eval: false, state: inactive}
  incidents: {}
