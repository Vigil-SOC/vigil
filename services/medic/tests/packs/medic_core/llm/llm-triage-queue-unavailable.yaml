rule: llm.triage-queue-unavailable
cases:
- id: daemon-outage-latches-until-recovery
  fires: true
  why: soc-daemon logs the #1689 ERROR once, then the recovery line 8 minutes later.
  start: '2026-10-08T10:00:00Z'
  end: +20m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
    message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: ConnectionError: Error 111 connecting to redis:6379. Connection refused.'
    at: +2m
  - signal: log_soc_daemon
    level: INFO
    logger: services.daemon.processor
    template: '%s; recovered after %d failures'
    message: LLM gateway connected for AI triage; recovered after 14 failures
    at: +10m
  expect:
  - {at: +2m, rule: llm.triage-queue-unavailable, eval: true, state: pending}
  - {at: +4m, rule: llm.triage-queue-unavailable, eval: true, state: firing, incident: A}
  - {at: +10m, rule: llm.triage-queue-unavailable, eval: false, state: resolving, incident: A}
  - {at: +16m, rule: llm.triage-queue-unavailable, eval: false, state: inactive}
  incidents:
    A: {rule: llm.triage-queue-unavailable, active_since: +2m, opened_at: +4m, resolving_since: +10m, resolved_at: +15m, reason: cleared, routed_at: +4m}
- id: daemon-restart-clears-the-latch
  fires: true
  why: Fixed and restarted. The new process logs no recovery line (outage state is per process), so its start line clears the latch.
  start: '2026-10-08T10:00:00Z'
  end: +20m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
    message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: ConnectionError: Connection refused'
    at: +2m
  - signal: log_soc_daemon
    level: INFO
    logger: __main__
    template: SOC Daemon initialized
    at: +8m
  expect:
  - {at: +8m, rule: llm.triage-queue-unavailable, eval: false, state: resolving, incident: A}
  incidents:
    A: {rule: llm.triage-queue-unavailable, active_since: +2m, opened_at: +4m, resolving_since: +8m, resolved_at: +13m, reason: cleared, routed_at: +4m}
- id: reminder-catches-a-late-start
  fires: true
  why: Medic started after the entry ERROR; the every-100-failures reminder sets the latch.
  start: '2026-10-08T10:00:00Z'
  end: +10m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: '%s (still failing, %d failures)'
    message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: ConnectionError: Connection refused (still failing, 100 failures)'
    at: +1m
  expect:
  - {at: +3m, rule: llm.triage-queue-unavailable, eval: true, state: firing, incident: A}
  incidents:
    A: {rule: llm.triage-queue-unavailable, active_since: +1m, opened_at: +3m, resolving_since: null, resolved_at: null, routed_at: +3m}
- id: backend-startup-failure-latches
  fires: true
  why: The backend logs once at startup that the gateway is unavailable and never reconnects.
  start: '2026-10-08T10:00:00Z'
  end: +10m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_backend
    level: ERROR
    logger: services.api.main
    template: 'LLM Gateway not available, LLM calls will fail until Redis and the ARQ worker are up: %s'
    message: 'LLM Gateway not available, LLM calls will fail until Redis and the ARQ worker are up: Error 111 connecting to redis:6379. Connection refused.'
    at: +1m
  expect:
  - {at: +3m, rule: llm.triage-queue-unavailable, eval: true, state: firing, incident: A}
  - {at: +10m, rule: llm.triage-queue-unavailable, eval: true, state: firing, incident: A}
  incidents:
    A: {rule: llm.triage-queue-unavailable, active_since: +1m, opened_at: +3m, resolving_since: null, resolved_at: null, routed_at: +3m}
- id: recovery-inside-the-hold
  fires: false
  why: Redis came back within the 2 m hold; nothing opens.
  start: '2026-10-08T10:00:00Z'
  end: +10m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
    message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: TimeoutError: timed out'
    at: +2m
  - signal: log_soc_daemon
    level: INFO
    logger: services.daemon.processor
    template: '%s; recovered after %d failures'
    message: LLM gateway connected for AI triage; recovered after 2 failures
    at: +3m
  expect:
  - {at: +2m, rule: llm.triage-queue-unavailable, eval: true, state: pending}
  - {at: +3m, rule: llm.triage-queue-unavailable, eval: false, state: inactive}
  incidents: {}
- id: unrendered-lookalike-is-ignored
  fires: false
  why: A line whose message equals its %-template wasn't rendered from args (an f-string lookalike), so it isn't catalog-trusted (fingerprint.md §2) and can't set the latch.
  start: '2026-10-08T10:00:00Z'
  end: +10m
  sensors:
  - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
  - {id: log.backend, covers: [log_backend], interval: 15s, service: backend, states: [[+0s, ok]]}
  logs:
  - signal: log_soc_daemon
    level: ERROR
    logger: services.daemon.processor
    template: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
    message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
    at: +2m
  expect:
  - {at: +5m, rule: llm.triage-queue-unavailable, eval: false, state: inactive}
  incidents: {}
