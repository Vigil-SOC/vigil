rule: ingest.integration-config-incomplete
defaults:
  sensors:
    - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
cases:
  - kind: fires
    id: v01-fires-until-the-config-is-complete
    title: The first warning latches; a reminder keeps it; the complete line clears it
    end: +40m
    logs:
      - {at: +1m, signal: log_soc_daemon, level: WARNING, logger: core.integrations.elastic.ingestion,
         template: '%s configuration incomplete (missing: %s); skipping polls until it is completed',
         message: 'Elastic configuration incomplete (missing: elasticsearch_url); skipping polls until it is completed'}
      - {at: +20m, signal: log_soc_daemon, level: WARNING, logger: core.integrations.elastic.ingestion,
         template: '%s configuration still incomplete (missing: %s); %d polls skipped',
         message: 'Elastic configuration still incomplete (missing: elasticsearch_url); 60 polls skipped'}
      - {at: +30m, signal: log_soc_daemon, level: INFO, logger: core.integrations.elastic.ingestion,
         template: '%s configuration complete; polling resumed after %d skipped polls',
         message: Elastic configuration complete; polling resumed after 90 skipped polls}
    expect:
      - {at: +1m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: true, state: pending}
      - {at: +3m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: true, state: firing, incident: A}
      - {at: +25m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: true, state: firing, incident: A, note: quiet between reminders}
      - {at: +30m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: false, state: resolving, incident: A}
      - {at: +35m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: false, state: inactive}
    incidents:
      A: {rule: ingest.integration-config-incomplete, group: {integration: Elastic}, active_since: +1m, opened_at: +3m,
          resolving_since: +30m, resolved_at: +35m, reason: cleared, routed_at: +3m}
  - kind: silent
    id: v02-silent-on-a-forged-warning
    title: A warning line the catalog doesn't trust (an f-string or forged text) never sets the latch
    end: +15m
    logs:
      - {at: +1m, signal: log_soc_daemon, level: INFO, logger: core.integrations.elastic.ingestion,
         template: '%s configuration complete; polling resumed after %d skipped polls',
         message: Elastic configuration complete; polling resumed after 3 skipped polls}
      - {at: +5m, signal: log_soc_daemon, level: WARNING, logger: core.integrations.elastic.ingestion, trusted: false,
         template: 'Elastic configuration incomplete (missing: elasticsearch_url); skipping polls until it is completed',
         message: 'Elastic configuration incomplete (missing: elasticsearch_url); skipping polls until it is completed'}
    expect:
      - {at: +2m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: false, state: inactive}
      - {at: +10m, rule: ingest.integration-config-incomplete, group: {integration: Elastic}, eval: false, state: inactive}
    incidents: {}
