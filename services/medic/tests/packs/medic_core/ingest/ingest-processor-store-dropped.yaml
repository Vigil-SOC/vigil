rule: ingest.processor-store-dropped
defaults:
  sensors:
    - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
cases:
  - kind: fires
    id: v01-fires-when-the-database-rejects-a-finding
    title: Postgres rejects writes; the processor drops findings after its retry
    end: +15m
    logs:
      - {at: +4m, signal: log_soc_daemon, level: ERROR, logger: services.daemon.processor,
         template: 'Dropped finding %s: database store failed', message: 'Dropped finding f-2026-0042: database store failed',
         repeat: {every: 1m, until: +8m}}
    expect:
      - {at: +4m, rule: ingest.processor-store-dropped, eval: true, state: pending}
      - {at: +6m, rule: ingest.processor-store-dropped, eval: true, state: firing, incident: A}
    incidents:
      A: {rule: ingest.processor-store-dropped, active_since: +4m, opened_at: +6m, resolving_since: null, resolved_at: null}
  - kind: silent
    id: v02-silent-on-an-untrusted-copy
    title: The same words in a line the catalog doesn't trust don't count
    end: +20m
    logs:
      - {at: +4m, signal: log_soc_daemon, level: ERROR, logger: services.daemon.processor, trusted: false,
         template: 'Dropped finding f-1: database store failed', message: 'Dropped finding f-1: database store failed'}
    expect:
      - {at: +10m, rule: ingest.processor-store-dropped, eval: unknown, state: inactive}
      - {at: +20m, rule: ingest.processor-store-dropped, eval: false, state: inactive}
    incidents: {}
