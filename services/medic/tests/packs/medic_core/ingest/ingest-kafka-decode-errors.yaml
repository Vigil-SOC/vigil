rule: ingest.kafka-decode-errors
defaults:
  sensors:
    - {id: http.daemon-status, covers: [daemon_status.kafka], interval: 30s, service: soc-daemon, states: [[+0s, ok]]}
  types:
    daemon_status.kafka: {decode_errors: counter, missing_id_errors: counter}
cases:
  - kind: fires
    id: v01-fires-on-a-burst-of-undecodable-messages
    title: Ten undecodable messages arrive at +5m, then the producer is fixed
    end: +40m
    series:
      - {signal: daemon_status.kafka, key: decode_errors, steps: [[+0m, 0], [+5m, 10]]}
      - {signal: daemon_status.kafka, key: missing_id_errors, steps: [[+0s, 0]]}
    expect:
      - {at: +5m, rule: ingest.kafka-decode-errors, eval: true, state: pending}
      - {at: +15m, rule: ingest.kafka-decode-errors, eval: true, state: firing, incident: A}
      - {at: +20m, rule: ingest.kafka-decode-errors, eval: false, state: resolving, incident: A, note: the rise has left the 15m window}
      - {at: +35m, rule: ingest.kafka-decode-errors, eval: false, state: inactive}
    incidents:
      A: {rule: ingest.kafka-decode-errors, active_since: +5m, opened_at: +15m, resolving_since: +20m, resolved_at: +35m, reason: cleared}
  - kind: silent
    id: v02-silent-on-a-couple-of-bad-messages
    title: Two bad messages in 15 minutes stay under the threshold
    end: +25m
    series:
      - {signal: daemon_status.kafka, key: decode_errors, steps: [[+0m, 0], [+5m, 2]]}
      - {signal: daemon_status.kafka, key: missing_id_errors, steps: [[+0s, 0]]}
    expect:
      - {at: +10m, rule: ingest.kafka-decode-errors, eval: unknown, state: inactive, note: a rise of 2 seen decides nothing yet}
      - {at: +20m, rule: ingest.kafka-decode-errors, eval: false, state: inactive}
    incidents: {}
