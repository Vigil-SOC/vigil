rule: pipeline.agent-port-in-use
defaults:
  sensors:
    - {id: log.agent-worker, covers: [log_agent_worker], interval: 15s, service: agent-worker, shape: start_sh, states: [[+0s, ok]]}
    - {id: log.agent-serve, covers: [log_agent_serve], interval: 15s, service: agent-serve, shape: start_sh, states: [[+0s, ok]]}
cases:
  - kind: fires
    id: v01-fires-when-the-new-worker-dies-on-eaddrinuse
    title: start.sh restarts the agents while an orphaned worker holds :6990
    end: +40m
    logs:
      - {at: +1m, signal: log_agent_worker, level: INFO, logger: agent-worker, trusted: false,
         template: 'Error: listen EADDRINUSE: address already in use :::6990', message: 'Error: listen EADDRINUSE: address already in use :::6990'}
    expect:
      - {at: +1m, rule: pipeline.agent-port-in-use, eval: true, state: firing, incident: A}
      - {at: +31m, rule: pipeline.agent-port-in-use, eval: false, state: resolving, incident: A}
      - {at: +36m, rule: pipeline.agent-port-in-use, eval: false, state: inactive}
    incidents:
      A: {rule: pipeline.agent-port-in-use, active_since: +1m, opened_at: +1m, resolving_since: +31m,
          resolved_at: +36m, reason: cleared, routed_at: +1m}
  - kind: silent
    id: v02-silent-on-other-ports-and-clean-starts
    title: A tool's EADDRINUSE on another port, and a clean start, are not this fault
    end: +40m
    logs:
      - {at: +1m, signal: log_agent_serve, level: INFO, logger: agent-serve, trusted: false,
         template: 'Error: listen EADDRINUSE: address already in use :::5173', message: 'Error: listen EADDRINUSE: address already in use :::5173'}
    expect:
      - {at: +30s, rule: pipeline.agent-port-in-use, eval: unknown, state: inactive, note: the window is not watched yet}
      - {at: +40m, rule: pipeline.agent-port-in-use, eval: false, state: inactive}
    incidents: {}
