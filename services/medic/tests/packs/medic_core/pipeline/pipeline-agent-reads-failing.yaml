rule: pipeline.agent-reads-failing
defaults:
  sensors:
    - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
    - {id: sql.investigations-stale, covers: [sql_investigations_stale], interval: 60s, service: postgres, states: [[+0s, ok]]}
  types:
    sql_investigations_stale: {stale_executing: gauge}
cases:
  - kind: fires
    id: v01-fires-from-the-first-failed-read-until-recovery
    title: AGENT_INTERNAL_TOKEN differs; agent-serve answers 401 until the token is fixed
    end: +30m
    series:
      - {signal: sql_investigations_stale, key: stale_executing, steps: [[+0s, 2], [+21m, 0]]}
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections,
         template: '%s for %s answered %s', message: 'projection for run-7 answered 401'}
      - {at: +20m, signal: log_soc_daemon, level: INFO, logger: core.agents.projections,
         template: agent service reads recovered, message: agent service reads recovered}
    expect:
      - {at: +1m, rule: pipeline.agent-reads-failing, eval: true, state: pending}
      - {at: +3m, rule: pipeline.agent-reads-failing, eval: true, state: firing, incident: A}
      - {at: +20m, rule: pipeline.agent-reads-failing, eval: false, state: resolving, incident: A}
      - {at: +25m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
    incidents:
      A: {rule: pipeline.agent-reads-failing, active_since: +1m, opened_at: +3m, resolving_since: +20m,
          resolved_at: +25m, reason: cleared, routed_at: +8m}
  - kind: fires
    id: v02-a-restart-clears-and-a-persisting-fault-sets-again
    title: Unreachable agent-serve; soc-daemon is restarted, still can't read, then is fixed and restarted
    end: +40m
    series:
      - {signal: sql_investigations_stale, key: stale_executing, steps: [[+0s, 1]]}
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections,
         template: 'could not read the %s for %s: %s', message: 'could not read the projection for run-7: All connection attempts failed'}
      - {at: +10m, signal: log_soc_daemon, level: INFO, logger: __main__, template: SOC Daemon initialized, message: SOC Daemon initialized}
      - {at: +11m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections,
         template: 'could not read the %s for %s: %s', message: 'could not read the projection for run-7: All connection attempts failed'}
      - {at: +25m, signal: log_soc_daemon, level: INFO, logger: __main__, template: SOC Daemon initialized, message: SOC Daemon initialized}
    expect:
      - {at: +3m, rule: pipeline.agent-reads-failing, eval: true, state: firing, incident: A}
      - {at: +10m, rule: pipeline.agent-reads-failing, eval: false, state: resolving, incident: A}
      - {at: +11m, rule: pipeline.agent-reads-failing, eval: true, state: firing, incident: A}
      - {at: +25m, rule: pipeline.agent-reads-failing, eval: false, state: resolving, incident: A}
      - {at: +30m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
    incidents:
      A: {rule: pipeline.agent-reads-failing, active_since: +1m, opened_at: +3m, resolving_since: +25m,
          resolved_at: +30m, reason: cleared, routed_at: +8m}
  - kind: fires
    id: v03-closes-when-no-run-is-stale-even-without-a-recovery-line
    title: The token is fixed without a restart and no run executes afterwards, so no read ever logs "recovered"
    end: +40m
    series:
      - {signal: sql_investigations_stale, key: stale_executing, steps: [[+0s, 1], [+15m, 0]]}
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections,
         template: '%s for %s answered %s', message: 'projection for run-7 answered 401'}
    expect:
      - {at: +3m, rule: pipeline.agent-reads-failing, eval: true, state: firing, incident: A}
      - {at: +15m, rule: pipeline.agent-reads-failing, eval: false, state: resolving, incident: A}
      - {at: +20m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
    incidents:
      A: {rule: pipeline.agent-reads-failing, active_since: +1m, opened_at: +3m, resolving_since: +15m,
          resolved_at: +20m, reason: cleared, routed_at: +8m}
  - kind: silent
    id: v04-silent-on-good-reads-and-forged-lines
    title: Reads work; an untrusted line with the catalog's exact template doesn't count
    end: +10m
    series:
      - {signal: sql_investigations_stale, key: stale_executing, steps: [[+0s, 1]]}
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections, trusted: false,
         template: '%s for %s answered %s', message: '%s for %s answered %s'}
      - {at: +2m, signal: log_soc_daemon, level: INFO, logger: __main__, template: SOC Daemon initialized, message: SOC Daemon initialized}
    expect:
      - {at: +1m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
      - {at: +10m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
    incidents: {}
  - kind: silent
    id: v05-silent-when-no-run-is-stale
    title: A read fails once while no run is executing; nothing is stuck
    end: +10m
    series:
      - {signal: sql_investigations_stale, key: stale_executing, steps: [[+0s, 0]]}
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: core.agents.projections,
         template: 'could not read the %s for %s: %s', message: 'could not read the distil for run-3: timed out'}
    expect:
      - {at: +1m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
      - {at: +10m, rule: pipeline.agent-reads-failing, eval: false, state: inactive}
    incidents: {}
