rule: pipeline.escalation-delivery-failing
defaults:
  sensors:
    - {id: log.soc-daemon, covers: [log_soc_daemon], interval: 15s, service: soc-daemon, states: [[+0s, ok]]}
cases:
  - kind: fires
    id: v01-fires-on-a-failed-slack-escalation
    title: The Slack token was revoked; a critical finding is escalated
    end: +7h
    logs:
      - {at: +1m, signal: log_soc_daemon, level: ERROR, logger: services.daemon.responder, trusted: false,
         template: 'Slack alert failed: {"ok":false,"error":"invalid_auth"}', message: 'Slack alert failed: {"ok":false,"error":"invalid_auth"}'}
    expect:
      - {at: +1m, rule: pipeline.escalation-delivery-failing, eval: true, state: firing, incident: A}
      - {at: +6h1m, rule: pipeline.escalation-delivery-failing, eval: false, state: resolving, incident: A}
      - {at: +6h6m, rule: pipeline.escalation-delivery-failing, eval: false, state: inactive}
    incidents:
      A: {rule: pipeline.escalation-delivery-failing, active_since: +1m, opened_at: +1m, resolving_since: +6h1m,
          resolved_at: +6h6m, reason: cleared, routed_at: +1m}
  - kind: silent
    id: v02-silent-when-slack-is-not-configured
    title: No Slack configured is a choice, not a delivery failure
    end: +7h
    logs:
      - {at: +1m, signal: log_soc_daemon, level: WARNING, logger: services.daemon.responder, trusted: false,
         template: 'Slack not configured, skipping escalation', message: 'Slack not configured, skipping escalation'}
    expect:
      - {at: +30s, rule: pipeline.escalation-delivery-failing, eval: unknown, state: inactive, note: the window is not watched yet}
      - {at: +7h, rule: pipeline.escalation-delivery-failing, eval: false, state: inactive}
    incidents: {}
