openapi: 3.1.0
info:
  title: Medic API
  version: "1.0.0"
  summary: Medic's read-only API, plus one admin write (decision feedback).
  description: |
    Contract X2 (2026-10-07). G3 builds this API inside the Medic process; H3 (the backend
    proxy) is its only caller. ADR: outputs/X2-medic-api-adr.md.

    Rules that the schema alone can't express:
    - **One caller.** Medic binds to `medic-net` (Compose), the pod IP behind a deny-all
      ingress NetworkPolicy that admits only the backend (Helm), or loopback (host-native).
      Every request needs `X-Medic-Key`, compared in constant time. A request without a valid
      key gets `401 unauthorized` before routing, even on an unknown path.
    - **Permissions live in H3.** Medic has one caller and one secret, so it can't tell roles
      apart. Each operation names the Vigil permission H3 must check (`x-medic-permission`).
      Medic does enforce *rateability* itself (which incidents and values accept feedback).
    - **Feedback identity comes from the session.** H3 sets `X-Medic-Admin` from the
      logged-in user (`user:<Vigil user id>`) and drops any client-supplied value. The body has
      no identity field, and Medic rejects unknown body fields (K1 T-17).
    - **No HTML, no free text from Vigil except redacted excerpts.** Every leaf field carries
      `x-medic-type` (same tags as G2, plus `admin_input` on the one request body). Free text
      is either `redacted_excerpt` (K2) or `pack_text` (signed pack content).
    - **Records are G2's.** Decision records are served exactly as stored
      (`decision-record.schema.json`), never re-shaped.
    - **Pagination** is keyset (cursor). Cursors are opaque, bound to the query's filters,
      and stay valid while records are appended. `limit` defaults to 50; maximums are per route.
    - **Clients treat unknown enum values as "unknown"** and ignore unknown fields, so adding
      either is a MINOR change (see the ADR, versioning).
    - Every response carries `Cache-Control: no-store`, `X-Request-Id` (echoed if the caller
      sent one matching `^[A-Za-z0-9-]{1,64}$`, otherwise generated) and `X-Medic-Api-Version`.
  license:
    name: Apache-2.0
servers:
  - url: "http://{host}:{port}"
    description: |
      Compose: the backend calls the gateway (`medic-gateway`), whose inbound path list is
      exactly this file's operations. Helm: `<fullname>-medic` Service. Host-native: 127.0.0.1.
      The default port 8470 (`VIGIL_MEDIC_API_PORT`) is PROVISIONAL until C6.
    variables:
      host:
        default: medic
      port:
        default: "8470"
security:
  - medicKey: []
tags:
  - name: status
  - name: incidents
  - name: decisions
  - name: sensors
  - name: pack
  - name: export
  - name: feedback

components:
  examples:
    RecordOpened:
      summary: chain-01 seq 0 (fixtures/decision-records/valid/chain-01-pilot-day.jsonl)
      value: &rec_opened
        at: "2026-12-07T09:15:00Z"
