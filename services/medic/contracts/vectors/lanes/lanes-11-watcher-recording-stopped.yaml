id: lanes-11-watcher-recording-stopped
description: The built-in watcher.recording-stopped is lane 2, because the admin frees disk or raises the store cap. It is never a suppression child. Its record has subject watcher, so it is left out of gate lane metrics and the lane-3 case rate (R7).
until: 3600
incidents:
  - {id: a, rule: watcher.recording-stopped, lane: 2, trust: trusted, signals: 1, samples: 1, opened_at: 0}
expect:
  a: {lane: {value: 2, reason: rule}, routed_at: 0, suppressed_by: null, would_have: {L0: record, L1: notify_admin, L2: {action: notify_admin, not_eligible: not_lane1}}, escalation: null}
