id: lanes-13-watcher-policy-unenforced
description: The built-in watcher.policy-unenforced is lane 2, because the cluster's network plugin is the customer's to fix. It is never a suppression child. Its record has subject watcher, so it is left out of the lane-3 case rate (R7).
until: 3600
incidents:
  - {id: a, rule: watcher.policy-unenforced, lane: 2, trust: trusted, signals: 1, samples: 1, opened_at: 0}
expect:
  a: {lane: {value: 2, reason: rule}, routed_at: 0, suppressed_by: null, would_have: {L0: record, L1: notify_admin, L2: {action: notify_admin, not_eligible: not_lane1}}, escalation: null}
