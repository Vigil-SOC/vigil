id: lanes-07-routing-hold-retroactive
description: E3 6.2. The symptom crosses its `for` first. It is a suppression child, so it holds for 5 min. Its parent opens 2 min later, within the hold, and suppresses it retroactively.
until: 3600
suppression:
  - {parent: llm.provider-keyless-default, child: pipeline.triage-stalled}
  - {parent: llm.provider-keyless-default, child: pipeline.probe-missed}
incidents:
  - {id: c, rule: pipeline.triage-stalled, lane: 3, trust: trusted, signals: 2, samples: 2, opened_at: 0}
  - {id: p, rule: llm.provider-keyless-default, lane: 2, trust: trusted, signals: 2, samples: 1, opened_at: 120}
expect:
  c: {lane: {value: 3, reason: rule}, routed_at: null, suppressed_by: p, would_have: {L0: record, L1: prepare_support_bundle, L2: {action: prepare_support_bundle, not_eligible: not_lane1}}, escalation: null}
  p: {lane: {value: 2, reason: rule}, routed_at: 120, suppressed_by: null, would_have: {L0: record, L1: notify_admin, L2: {action: notify_admin, not_eligible: not_lane1}}, escalation: null}
