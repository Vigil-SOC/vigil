id: v35-intel-stale
title: OpenCTI's newest object past stale_after opens intel-stale while its facts are fresh; a stopped collector never does
covers:
- §2 age
- §2 latest absent
- §4 keep_firing_for
start: '2026-10-07T10:00:00Z'
end: +95m
rules:
- ref: ingest-intel-stale.yaml
  params:
    stale_after: 3600
sensors:
- id: http.integration-health
  covers:
  - integration_health
  interval: 60s
  service: backend
  states:
  - - +0s
    - ok
types:
  integration_health:
    opencti.collected_at: timestamp
    opencti.newest_intel_at: timestamp
series:
- signal: integration_health
  key: opencti.collected_at
  steps:
  - - +0s
    - null
  - - +5m
    - '2026-10-07T10:05:00Z'
  - - +10m
    - '2026-10-07T10:10:00Z'
  - - +15m
    - '2026-10-07T10:15:00Z'
  - - +20m
    - '2026-10-07T10:20:00Z'
  - - +25m
    - '2026-10-07T10:25:00Z'
  - - +30m
    - '2026-10-07T10:30:00Z'
  - - +35m
    - '2026-10-07T10:35:00Z'
  - - +40m
    - '2026-10-07T10:40:00Z'
  - - +45m
    - '2026-10-07T10:45:00Z'
- signal: integration_health
  key: opencti.newest_intel_at
  steps:
  - - +0s
    - null
  - - +5m
    - '2026-10-07T09:10:00Z'
  - - +30m
    - '2026-10-07T10:29:00Z'
expect:
- at: +2m
  rule: ingest.intel-stale
  eval: false
  state: inactive
  note: 'no facts yet: absent'
- at: +10m
  rule: ingest.intel-stale
  eval: false
  state: inactive
  note: exactly stale_after old
- at: +10m15s
  rule: ingest.intel-stale
  eval: true
  state: pending
- at: +20m15s
  rule: ingest.intel-stale
  eval: true
  state: firing
  incident: A
- at: +30m
  rule: ingest.intel-stale
  eval: false
  state: resolving
  incident: A
  note: a fresh object
- at: +40m
  rule: ingest.intel-stale
  eval: false
  state: inactive
- at: +60m
  rule: ingest.intel-stale
  eval: false
  state: inactive
  note: collected 15 min ago
- at: +95m
  rule: ingest.intel-stale
  eval: false
  state: inactive
  note: newest past stale_after
incidents:
  A:
    rule: ingest.intel-stale
    active_since: +10m15s
    opened_at: +20m15s
    resolving_since: +30m
    resolved_at: +40m
    reason: cleared
    routed_at: +20m15s
