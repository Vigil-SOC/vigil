id: v28-resolving-unknown-holds
title: A sensor outage while resolving holds the incident open past keep_firing_for
covers:
- §4 never resolve blind
- §2 coverage
start: '2026-10-07T10:00:00Z'
end: +90m
rules:
- ref: ingest-kafka-decode-errors.yaml
sensors:
- id: http.daemon
  covers:
  - daemon_status.kafka
  - daemon_status.processor
  - daemon_status.poller
  - daemon_health
  interval: 15s
  service: soc-daemon
  states:
  - - +0s
    - ok
  - - +40m
    - stopped
  - - +70m
    - ok
types:
  daemon_status.kafka:
    decode_errors: counter
    missing_id_errors: counter
    connected: bool
series:
- signal: daemon_status.kafka
  key: decode_errors
  steps:
  - - +0s
    - 0
  - - +20m
    - 10
- signal: daemon_status.kafka
  key: missing_id_errors
  steps:
  - - +0s
    - 0
expect:
- at: +35m
  rule: ingest.kafka-decode-errors
  eval: false
  state: resolving
  incident: A
- at: +50m
  rule: ingest.kafka-decode-errors
  eval: unknown
  state: resolving
  incident: A
  note: keep_firing_for (15m) has passed, but the tick is unknown, so it stays open
- at: +70m
  rule: ingest.kafka-decode-errors
  eval: unknown
  state: resolving
  incident: A
  note: reads are back; the 15m window isn't covered until +85m
- at: +84m45s
  rule: ingest.kafka-decode-errors
  eval: unknown
  state: resolving
  incident: A
- at: +85m
  rule: ingest.kafka-decode-errors
  eval: false
  state: inactive
  note: first false tick after the outage resolves it
- at: +42m30s
  rule: watcher.sensor-blind
  eval: true
  state: firing
  group:
    sensor: http.daemon
  incident: SB
- at: +70m
  rule: watcher.sensor-blind
  eval: false
  state: inactive
  group:
    sensor: http.daemon
incidents:
  A:
    rule: ingest.kafka-decode-errors
    active_since: +20m
    opened_at: +30m
    resolving_since: +35m
    resolved_at: +85m
    reason: cleared
    routed_at: +30m
  SB:
    rule: watcher.sensor-blind
    active_since: +40m30s
    opened_at: +42m30s
    resolving_since: +70m
    resolved_at: +70m
    reason: cleared
    group:
      sensor: http.daemon
    routed_at: +42m30s
