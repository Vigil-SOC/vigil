id: v23-group-retired
title: A group with no observations for 24 h of covered sensor time retires and its open incident resolves as group_retired
covers:
- §3 group lifetime
start: '2026-10-07T10:00:00Z'
end: +24h15m
rules:
- inline:
    apiVersion: medic.rules/v1
    kind: Rule
    id: ingest.source-erroring
    title: Vector rule ingest.source-erroring
    revision: 1
    fault:
      class: ingest
      mode: I-2
      causes:
      - I-2.a
    lane: 2
    signals:
      errors:
        sample:
          signal: federation_sources
          key: sources.consecutive_errors
          by:
          - source
    when:
      fn: latest
      signal: errors
      op: '>'
      value: 3
    group_by:
    - source
    for: 0s
    keep_firing_for: 0s
    advice:
      summary: Test rule for an evaluation vector.
      fix: 'No action: this rule exists only in a test vector.'
sensors:
- id: http.federation
  covers:
  - federation_sources
  interval: 30s
  service: backend
  states:
  - - +0s
    - ok
types:
  federation_sources:
    sources.consecutive_errors: gauge
series:
- signal: federation_sources
  key: sources.consecutive_errors
  labels:
    source: a
  steps:
  - - +0s
    - 0
- signal: federation_sources
  key: sources.consecutive_errors
  labels: &id001
    source: gone
  to: +10m
  steps:
  - - +0s
    - 5
expect:
- at: +1m
  rule: ingest.source-erroring
  eval: true
  state: firing
  group: *id001
  incident: A
- at: +12h
  rule: ingest.source-erroring
  eval: unknown
  state: firing
  group: *id001
  incident: A
  note: 'no fresh value: unknown keeps the incident firing (§4)'
- at: +24h9m45s
  rule: ingest.source-erroring
  eval: unknown
  state: firing
  group: *id001
  incident: A
- at: +24h10m
  rule: ingest.source-erroring
  eval: unknown
  state: inactive
  group: *id001
  note: '24 h since its last observation (+10m), sensor covered throughout: retired'
- at: +24h10m
  rule: ingest.source-erroring
  eval: false
  state: inactive
  group:
    source: a
incidents:
  A:
    rule: ingest.source-erroring
    active_since: +0s
    opened_at: +0s
    resolving_since: null
    resolved_at: +24h10m
    reason: group_retired
    group: *id001
    routed_at: +0s
