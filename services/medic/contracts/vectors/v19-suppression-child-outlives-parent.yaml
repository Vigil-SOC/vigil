id: v19-suppression-child-outlives-parent
title: 'Triage stays stalled after the gateway recovers: unsuppressed 10 min after the parent resolves'
covers:
- §6 child outlives parent
start: '2026-10-07T10:00:00Z'
end: +80m
rules:
- ref: llm-gateway-outage.yaml
- ref: pipeline-triage-stalled.yaml
suppression:
- parent:
    class: llm
  children:
    mode: P-4
sensors:
- id: http.daemon
  covers:
  - daemon_status.kafka
  - daemon_status.processor
  - daemon_status.poller
  - daemon_health
  interval: 15s
  service: soc-daemon
  states:
  - - +0s
    - ok
- id: log.soc-daemon
  covers:
  - log_soc_daemon
  interval: 15s
  service: soc-daemon
  states:
  - - +0s
    - ok
types:
  daemon_status.processor:
    processed: counter
    triaged: counter
series:
- signal: daemon_status.processor
  key: processed
  steps:
  - - +0m
    - 0
  - - +5m
    - 10
  - - +10m
    - 20
  - - +15m
    - 30
  - - +20m
    - 40
  - - +25m
    - 50
  - - +30m
    - 60
  - - +35m
    - 70
  - - +40m
    - 80
  - - +45m
    - 90
  - - +50m
    - 100
  - - +55m
    - 110
  - - +60m
    - 120
  - - +65m
    - 130
  - - +70m
    - 140
  - - +75m
    - 150
  - - +80m
    - 160
  - - +85m
    - 170
  - - +90m
    - 180
  - - +95m
    - 190
- signal: daemon_status.processor
  key: triaged
  steps:
  - - +0s
    - 0
  - - +5m
    - 10
  - - +10m
    - 20
logs:
- signal: log_soc_daemon
  level: ERROR
  logger: services.daemon.processor
  template: 'Failed to connect LLM gateway, AI triage is skipped until it connects: %s'
  message: 'Failed to connect LLM gateway, AI triage is skipped until it connects: ConnectError: connection refused'
  at: +10m
- signal: log_soc_daemon
  level: INFO
  logger: services.daemon.processor
  template: '%s; recovered after %d failures'
  message: LLM gateway connected for AI triage; recovered after 12 failures
  at: +60m
expect:
- at: +50m
  rule: pipeline.triage-stalled
  eval: true
  state: firing
  incident: C
  suppressed: true
- at: +65m
  rule: llm.gateway-outage
  eval: false
  state: inactive
- at: +70m
  rule: pipeline.triage-stalled
  eval: true
  state: firing
  incident: C
  suppressed: true
- at: +75m
  rule: pipeline.triage-stalled
  eval: true
  state: firing
  incident: C
  suppressed: false
incidents:
  P:
    rule: llm.gateway-outage
    active_since: +10m
    opened_at: +12m
    resolving_since: +60m
    resolved_at: +65m
    reason: cleared
    routed_at: +12m
  C:
    rule: pipeline.triage-stalled
    active_since: +40m
    opened_at: +50m
    resolving_since: null
    resolved_at: null
    suppressed_by: P
    routed_at: +75m
