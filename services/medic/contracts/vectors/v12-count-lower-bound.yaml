id: v12-count-lower-bound
title: Lines seen still count during a log gap; absence of lines doesn't
covers:
- §2 count
- §2 lower bound
- §4 never resolve blind
start: '2026-10-07T10:00:00Z'
end: +40m
rules:
- inline:
    apiVersion: medic.rules/v1
    kind: Rule
    id: ingest.kafka-poll-errors
    title: Vector rule ingest.kafka-poll-errors
    revision: 1
    fault:
      class: ingest
      mode: I-3
      causes:
      - I-3.k
    lane: 3
    signals:
      line:
        log:
          signal: log_soc_daemon
          logger:
            eq: services.daemon.kafka_ingestor
          template:
            eq: 'Kafka consumer poll error: %s'
    when:
      fn: count
      signal: line
      window: 10m
      op: '>='
      value: 3
    for: 0s
    keep_firing_for: 0s
    advice:
      summary: Test rule for an evaluation vector.
      fix: 'No action: this rule exists only in a test vector.'
sensors:
- id: log.soc-daemon
  covers:
  - log_soc_daemon
  interval: 15s
  service: soc-daemon
  states:
  - - +0s
    - ok
  - - +18m
    - stopped
  - - +25m
    - ok
logs:
- at: +0s
  signal: log_soc_daemon
  level: ERROR
  logger: services.daemon.kafka_ingestor
  template: 'Kafka consumer poll error: %s'
  message: 'Kafka consumer poll error: KafkaTimeoutError'
  repeat:
    every: 1m
    until: +12m
expect:
- at: +1m
  rule: ingest.kafka-poll-errors
  eval: unknown
  state: inactive
- at: +2m
  rule: ingest.kafka-poll-errors
  eval: true
  state: firing
  incident: A
- at: +18m30s
  rule: ingest.kafka-poll-errors
  eval: true
  state: firing
  incident: A
  note: gap, but 4 lines already seen
- at: +21m
  rule: ingest.kafka-poll-errors
  eval: unknown
  state: firing
  incident: A
- at: +34m45s
  rule: ingest.kafka-poll-errors
  eval: unknown
  state: firing
  incident: A
- at: +35m
  rule: ingest.kafka-poll-errors
  eval: false
  state: inactive
- at: +20m30s
  rule: watcher.sensor-blind
  eval: true
  state: firing
  group:
    sensor: log.soc-daemon
  incident: SB
- at: +25m
  rule: watcher.sensor-blind
  eval: false
  state: inactive
  group:
    sensor: log.soc-daemon
incidents:
  A:
    rule: ingest.kafka-poll-errors
    active_since: +2m
    opened_at: +2m
    resolving_since: +35m
    resolved_at: +35m
    reason: cleared
    routed_at: +2m
  SB:
    rule: watcher.sensor-blind
    active_since: +18m30s
    opened_at: +20m30s
    resolving_since: +25m
    resolved_at: +25m
    reason: cleared
    group:
      sensor: log.soc-daemon
    routed_at: +20m30s
