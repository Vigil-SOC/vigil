id: v01-hold-for-fires-and-resolves
title: for 10m then keep_firing_for 15m on a counter jump
covers:
- §2 increase
- §4 pending/firing/resolving
start: '2026-10-07T10:00:00Z'
end: +55m
rules:
- ref: ingest-kafka-decode-errors.yaml
sensors:
- id: http.daemon
  covers:
  - daemon_status.kafka
  - daemon_status.processor
  - daemon_status.poller
  - daemon_health
  interval: 15s
  service: soc-daemon
  states:
  - - +0s
    - ok
types:
  daemon_status.kafka:
    decode_errors: counter
    missing_id_errors: counter
    connected: bool
series:
- signal: daemon_status.kafka
  key: decode_errors
  steps:
  - - +0s
    - 0
  - - +20m
    - 10
- signal: daemon_status.kafka
  key: missing_id_errors
  steps:
  - - +0s
    - 0
expect:
- at: +5m
  rule: ingest.kafka-decode-errors
  eval: unknown
  state: inactive
  note: window not covered yet; lower bound 0 doesn't decide > 5
- at: +16m
  rule: ingest.kafka-decode-errors
  eval: false
  state: inactive
- at: +20m
  rule: ingest.kafka-decode-errors
  eval: true
  state: pending
- at: +29m45s
  rule: ingest.kafka-decode-errors
  eval: true
  state: pending
- at: +30m
  rule: ingest.kafka-decode-errors
  eval: true
  state: firing
  incident: A
- at: +35m
  rule: ingest.kafka-decode-errors
  eval: false
  state: resolving
  incident: A
  note: baseline is now the +20m sample
- at: +49m45s
  rule: ingest.kafka-decode-errors
  eval: false
  state: resolving
  incident: A
- at: +50m
  rule: ingest.kafka-decode-errors
  eval: false
  state: inactive
incidents:
  A:
    rule: ingest.kafka-decode-errors
    active_since: +20m
    opened_at: +30m
    resolving_since: +35m
    resolved_at: +50m
    reason: cleared
    routed_at: +30m
