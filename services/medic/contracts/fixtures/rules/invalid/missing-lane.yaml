# expect: E-SCHEMA
# why: Every rule carries a lane (G1 consumes it)
apiVersion: medic.rules/v1
kind: Rule
id: ingest.kafka-decode-errors
title: Kafka consumer is skipping malformed messages
revision: 1
fault:
  class: ingest
  mode: I-3
  causes:
  - I-3.j
signals:
  decode_errors:
    sample:
      signal: daemon_status.kafka
      key: decode_errors
  missing_id:
    sample:
      signal: daemon_status.kafka
      key: missing_id_errors
when:
  any:
  - fn: increase
    signal: decode_errors
    window: 15m
    op: '>'
    value: 5
  - fn: increase
    signal: missing_id
    window: 15m
    op: '>'
    value: 5
for: 10m
keep_firing_for: 15m
advice:
  summary: Messages from the Kafka topic are dropped because they can't be decoded
    or have no finding_id.
  fix: Check the producer that writes to the Vigil Kafka topic. Each message must
    be valid JSON with a finding_id field. Dropped messages are not retried.
