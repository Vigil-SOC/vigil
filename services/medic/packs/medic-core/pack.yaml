# medic-core pack source (F4). pack_build.py turns this directory into one
# medic.pack/v1 file. Bumping `version` on main is the release: medic-pack-release.yml
# tags medic-core-vX.Y.Z and publishes the built file with its SHA-256 on the Release
# (nothing is signed). An admin imports the file by the sha256 they expect it to have.
# DeepTempo publishes the stable channel only.
format: medic.pack/v1
pack:
  id: medic-core
  version: 0.4.0
  channel: stable
  created_at: "2026-10-08T00:00:00Z"
  expires_at: "2027-04-06T00:00:00Z"
  publisher: deeptempo
engine_api: "1.0"
fingerprint: fp1
vigil: {min: 1.0.0, max_exclusive: 2.0.0}
