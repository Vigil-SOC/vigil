# A lower item cap means findings arrive later, and alerts past the cap that
# share one timestamp are skipped. Compared with the cap one window earlier; a
# higher cap reports nothing. Same gate, window and hold as the floor rule.
apiVersion: medic.rules/v1
kind: Rule
id: ingest.federation-cap-lowered
title: Federation source item cap was lowered
revision: 1
fault: {class: ingest, mode: I-6, causes: [I-6.b]}
lane: 2
detection: event
signals:
  federation: {sample: {signal: federation_sources, key: global.enabled}}
  enabled:    {sample: {signal: federation_sources, key: sources.enabled, by: [source]}}
  configured: {sample: {signal: federation_sources, key: sources.is_configured, by: [source]}}
  cap:        {sample: {signal: federation_sources, key: sources.max_items, by: [source]}}
group_by: [source]
when:
  all:
    - {fn: latest, signal: federation, op: "==", value: true}
    - {fn: latest, signal: enabled, op: "==", value: true}
    - {fn: latest, signal: configured, op: "==", value: true}
    - {fn: increase, signal: cap, window: 70m, op: "<", value: 0}
for: 10m
keep_firing_for: 12h
advice:
  summary: This source's item cap is lower, so findings arrive later.
  fix: >-
    A lower cap means findings arrive later, and alerts beyond the cap that
    share one timestamp are skipped. If that was intended, there is nothing to
    do. Otherwise set the cap back through PATCH /api/federation/sources/{id}.
