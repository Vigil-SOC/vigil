# P-1.j (PROVISIONAL B5 row, F7c; was the skeleton's dev rule) · the agent worker is
# up (/healthz is always "ok") but its /readyz says no: the BullMQ worker isn't
# running or its Redis client isn't ready (services/agent/worker.ts:645-650), so
# queued runs aren't picked up. A refused connection reads ready=false too (the
# process is gone). Which of Redis or the worker is at fault can't be told from
# /readyz alone, so lane 3 (Phase 1: restart, once Redis is shown healthy).
# Outsider: no (an unauthenticated probe on a port only Medic and the agents reach).
apiVersion: medic.rules/v1
kind: Rule
id: pipeline.agent-worker-not-ready
title: The agent worker is running but not ready
revision: 2
fault: {class: pipeline, mode: P-1, causes: [P-1.j]}
lane: 3
detection: event
signals:
  ready: {sample: {signal: agent_worker_readyz, key: ready}}
when: {fn: latest, signal: ready, op: "==", value: false}
for: 2m
keep_firing_for: 5m
advice:
  summary: The agent worker has reported not ready for 2 minutes, so new investigation runs are queued but not picked up.
  fix: >-
    Send this incident to DeepTempo Support with the evidence report. Check that
    the agent worker can reach Redis; restarting it reconnects only if Redis is
    up. Record what you did.
