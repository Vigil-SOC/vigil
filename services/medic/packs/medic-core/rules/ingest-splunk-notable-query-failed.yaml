# I-1.g · the notable-index query fails, a fallback query runs and the tick still
# counts as a success, so the notable window is lost. Repeats every tick.
apiVersion: medic.rules/v1
kind: Rule
id: ingest.splunk-notable-query-failed
title: Splunk notable query keeps failing behind a successful fallback
revision: 1
fault: {class: ingest, mode: I-1, causes: [I-1.g]}
lane: 3
detection: event
signals:
  failed:
    log:
      signal: log_soc_daemon
      logger: {re2: '^(core\.integrations\.splunk\.adapter|services\.daemon\.poller)$'}
      level: [WARNING]
      template: {eq: 'Splunk query failed (%s): %s'}
when: {fn: count, signal: failed, window: 30m, op: ">=", value: 2}
for: 10m
keep_firing_for: 15m
advice:
  summary: Splunk polls look healthy but the notable-event query fails each time, so notable alerts are being skipped.
  fix: >-
    Check that the Splunk account Vigil uses can search index=notable (its role
    needs that index). If it can, send this incident to DeepTempo Support with
    the evidence report: alerts from the failed windows are not re-fetched.
