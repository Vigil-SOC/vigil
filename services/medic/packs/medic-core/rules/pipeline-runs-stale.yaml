# P-1.d / P-2.b · investigations sit in "executing" with no progress. The daemon
# stale-kills only runs whose last_activity_at is set (orchestrator.py:1128-1130),
# so a run that was never picked up (NULL) stays executing forever (P-1.d).
# sql_investigations_stale (D1) lists both kinds; the NULL kind needs its own
# timestamp (requires: D6 sql_investigations_stale.oldest_never_active_since =
# the oldest such run's started_at/created_at).
apiVersion: medic.rules/v1
kind: Rule
id: pipeline.runs-stale
title: Investigation runs are executing with no progress
revision: 1
fault: {class: pipeline, mode: P-2, causes: [P-1.d, P-2.b]}
lane: 3
detection: absence
signals:
  stale_count:  {sample: {signal: sql_investigations_stale, key: stale_executing}}
  oldest:       {sample: {signal: sql_investigations_stale, key: oldest_last_activity_at}}
  never_active: {sample: {signal: sql_investigations_stale, key: oldest_never_active_since}}
when:
  any:
    - all:
        - {fn: latest, signal: stale_count, op: ">", value: 0}
        - {fn: age, signal: oldest, op: ">", value: {param: stale_after}}
    - {fn: age, signal: never_active, op: ">", value: {param: stale_after}}
for: 10m
keep_firing_for: 30m
params:
  stale_after: {type: number, default: 1800, min: 600, max: 86400}
advice:
  summary: At least one investigation has been executing with no progress for over 30 minutes, or was never picked up.
  fix: >-
    Send this incident to DeepTempo Support with the evidence report. Cancelling
    the stuck run in the console frees its slot; record that you did so.
