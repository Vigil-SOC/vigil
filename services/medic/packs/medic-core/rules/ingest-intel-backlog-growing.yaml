# I-7 · intelligence feed: messages waiting in OpenCTI's connector queues rose by
# more than the floor over the window, so OpenCTI ingests slower than intelligence
# arrives. A gauge, so the rise is last minus the value one window ago; a
# backlog that drains back stays quiet. Same freshness gate as intel-stale: a
# stopped OpenCTI leaves its last facts in place and must not read either way.
apiVersion: medic.rules/v1
kind: Rule
id: ingest.intel-backlog-growing
title: OpenCTI's ingest backlog keeps growing
revision: 1
fault: {class: ingest, mode: I-7, causes: [I-7.b]}
lane: 2
detection: event
signals:
  collected: {sample: {signal: integration_health, key: opencti.collected_at}}
  backlog:   {sample: {signal: integration_health, key: opencti.queue_messages_total}}
when:
  all:
    - {fn: age, signal: collected, op: "<", value: 900}
    - {fn: increase, signal: backlog, window: {param: window}, op: ">", value: {param: floor}}
for: 15m
keep_firing_for: 30m
params:
  window: {type: duration, default: 6h, min: 1h, max: 48h}
  # Messages the backlog may rise by within the window before it counts.
  floor: {type: number, default: 10000, min: 1, max: 10000000}
advice:
  summary: The messages waiting in OpenCTI's connector queues grew by more than this rule's floor over its window, so OpenCTI ingests slower than intelligence arrives.
  fix: >-
    Add OpenCTI workers (the opencti/worker service's replicas) so more
    messages are consumed at once. If one connector is sending far more than
    the rest, open Data, Ingestion in OpenCTI to find the connector holding
    the messages; Vigil's Integration Health row for OpenCTI lists each
    connector's queue. The evidence shows the backlog at the start and end of
    the window. The incident clears once the backlog stops growing.
