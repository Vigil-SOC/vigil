# Dev-mode rule (S4 walking skeleton): loaded through the S4b loader, not a pack (F6).
# B5 has no row for exactly this symptom. The worker's /readyz is false when its
# BullMQ worker isn't running or its Redis client isn't ready
# (services/agent/worker.ts:645-650), so runs queue and nothing picks them up:
# mode P-1. Which P-1 cause can't be told from /readyz alone, and the Redis lane
# depends on who runs Redis (P-1.f "1/2 by ownership"), so: lane 3 (S4-1).
apiVersion: medic.rules/v1
kind: Rule
id: pipeline.agent-worker-not-ready
title: The agent worker is running but not ready
revision: 1
fault: {class: pipeline, mode: P-1, causes: [P-1.f]}
lane: 3
detection: event
signals:
  ready: {sample: {signal: agent_worker_readyz, key: ready}}
when: {fn: latest, signal: ready, op: "==", value: false}
for: 2m
keep_firing_for: 5m
advice:
  summary: The agent worker has reported not ready for 2 minutes, so new investigation runs are queued but not picked up.
  fix: >-
    Send this incident to DeepTempo Support with the evidence report. Check that
    the agent worker can reach Redis; restarting it reconnects only if Redis is
    up. Record what you did.
