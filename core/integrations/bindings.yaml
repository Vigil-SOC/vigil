# What each shipped tool answers, by server then the server's own tool name
# (#5312). Vigil's own tools sit under `vigil` and bind by bare name. A person's
# binding on a tool's class row (Settings -> Limits & autonomy) replaces the one
# here. Every bound tool a deployment carries binds; there is no preference
# order. Server order is the order a capability's tools are held in.
vigil:
  lookup_indicators: indicator_lookup
  search_findings: findings_search
  # Episodic memory is Vigil's own tier: a deployment carries it or has no history.
  recall_entity: entity_recall
  # The case shell (#4199); unbound where no sidecar runs.
  read_case_shell: shell
  get_finding: get_finding
  # Rules declaring a technique and what tested it: where to look, never evidence.
  analyze_coverage: detection_coverage

# Telemetry. splunk_execute takes earliest, which splunk_nl_search cannot express.
splunk-selfhosted:
  splunk_execute: telemetry_search
elastic:
  elastic_search_logs: telemetry_search
# One region per call; a region not allowed answers a pointer, never rows.
amazon-security-lake:
  security_lake_query: telemetry_search
# Third-party servers this repo cannot list: each name is a guess, bound only
# when the server reports it.
splunk:
  run_splunk_search: telemetry_search
  search: telemetry_search
  oneshot_search: telemetry_search
azure-sentinel:
  query: telemetry_search
  run_query: telemetry_search
  search: telemetry_search
gcp-secops:
  search_security_events: telemetry_search
  search: telemetry_search
crowdstrike:
  falcon_search_detects: telemetry_search
  query: telemetry_search
  search: telemetry_search

# Indicators.
misp:
  misp_search_ioc: indicator_lookup
alienvault-otx:
  otx_check_ip: indicator_lookup
virustotal:
  get_ip_report: indicator_lookup

# OpenCTI's graph, opt-in: held when connected, missed by nothing when not.
opencti:
  opencti_search_observable: intel_observable
  opencti_get_indicator: intel_indicator
  opencti_search_entities: intel_entities
  opencti_get_related: intel_relationships

# One account read; aad_disable_user carries disable_user and answers nothing.
azure-ad:
  aad_get_user: identity_lookup
  aad_disable_user:
    act: disable_user
    id_arg: user_id
    note_arg: reason
    lookup: aad_get_user
    lookup_arg: user
    id: id
    name: userPrincipalName
    state:
      read: [{field: accountEnabled, map: {true: enabled}}]
      default: disabled
    # No state read: the lookup's accountEnabled says when it holds.
    act_state: {default: requested}
    undo: aad_enable_user
# fctr-id/okta-mcp-server's names at the tag mcp-config.json pins.
okta:
  get_okta_user: identity_lookup

# Sandboxes, split by question. Reads only: no submit tool is bound.
cape-sandbox:
  cape_search_hash: sandbox_hash_lookup
  cape_get_report: sandbox_report
hybrid-analysis:
  ha_search_hash: sandbox_hash_lookup
  ha_get_report: sandbox_report
anyrun:
  anyrun_search_hash: sandbox_hash_lookup
  anyrun_get_report: sandbox_report

# A topology graph and the console view it drives, one tool each.
vstrike:
  vstrike_network_graph_get: topology_graph
  vstrike_ui_rightpanel_focus: topology_focus
  vstrike_ui_legend_apply: topology_legend

opensearch:
  opensearch_search_logs: telemetry_search

# The emulator the red team loop runs (#5315): held to the hosts listed under
# Settings -> Limits & autonomy -> Emulators.
atomic-red-team:
  atomic_red_team_execute: emulation

# Act carriers (#5313, docs/acts.md): what an approved act of each kind calls
# on the server, keyed by the act tool. Every tool named is the server's own.
microsoft-defender:
  mde_isolate:
    act: isolate_host
    id_arg: machine_id
    note_arg: comment
    lookup: mde_find_machine
    lookup_arg: hostname
    address_arg: ip
    rows: machines
    id: machine_id
    name: name
    # A newer action still out is the state before the last one that succeeded.
    state:
      read:
        - {field: isolation.pending.status, map: {Pending: requested, InProgress: requested}}
        - {field: isolation.state, map: {isolated: contained}}
      default: not_contained
    # The act answers a machine action; its status is the state.
    act_state: &mde_action
      read: [{field: status, map: {Pending: requested, InProgress: requested, Succeeded: contained}}]
      default: failed
    state_read: {tool: mde_get_machine_action, arg: action_id}
    read_state: *mde_action
    undo: mde_release
carbon-black:
  cb_quarantine:
    act: isolate_host
    id_arg: device_id
    note_arg: reason
    lookup: cb_search_device
    lookup_arg: hostname
    address_arg: ip
    rows: devices
    id: device_id
    name: name
    state:
      read: [{field: quarantined, map: {true: contained}}]
      default: not_contained
    # No action read: the lookup's quarantine flag says when it holds.
    act_state: {default: requested}
    undo: cb_lift_quarantine
# Keyless: the target is the vendor's key. Cloudflare answers a refusal with
# success false and no error, so only success true is done. undo_from names the
# field of the act's answer the undo is called with.
cloudflare:
  cf_waf_block_ip:
    act: block_ip
    carrier: Cloudflare WAF
    takes: [address]
    id_arg: ip
    note_arg: reason
    act_state: {read: [{field: success, map: {true: blocked}}], default: failed}
    undo: cf_waf_unblock_ip
    undo_from: rule_id
  # The domain goes into the rule's expression: only a bare name passes.
  cf_gateway_block_domain:
    act: block_domain
    carrier: Cloudflare Gateway
    takes: [domain]
    id_arg: domain
    note_arg: reason
    act_state: {read: [{field: success, map: {true: blocked}}], default: failed}
    undo: cf_gateway_unblock_domain
    undo_from: rule_id
  # No undo: Vigil cannot give a session back.
  cf_access_revoke_session:
    act: revoke_session
    carrier: Cloudflare Access
    takes: [email]
    id_arg: email
    note_arg: reason
    act_state: {read: [{field: success, map: {true: revoked}}], default: failed}
# The unregister takes the address itself, so no undo_from.
palo-alto:
  pan_block_ip:
    act: block_ip
    carrier: Palo Alto
    takes: [address]
    id_arg: ip
    note_arg: reason
    act_state: {read: [{field: success, map: {true: blocked}}], default: failed}
    undo: pan_unblock_ip
